<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>A01 · AGI</title>
<link rel="stylesheet" href="../lib/theme.css">
<link rel="stylesheet" href="../lib/fonts-spartan.css">
<style>
  /* Bauhaus / suizo: papel cálido, formas planas, primarios apagados. Sin texto. */
  body { background: #F2EDE4; }
  #cv { position: absolute; inset: 0; }
  #grain { position: absolute; inset: -20px; opacity: 0.10; mix-blend-mode: multiply; pointer-events: none; }
  #fade { position: absolute; inset: 0; background: #F2EDE4; opacity: 1; }
</style>
</head>
<body>
<div id="world">
  <canvas id="cv" width="1920" height="1080"></canvas>
  <canvas id="grain" width="512" height="512" style="width:1960px;height:1120px"></canvas>
  <div id="fade"></div>
</div>
<script src="../node_modules/gsap/dist/gsap.min.js"></script>
<script src="../node_modules/gsap/dist/SplitText.min.js"></script>
<script src="../node_modules/gsap/dist/DrawSVGPlugin.min.js"></script>
<script src="../node_modules/gsap/dist/CustomEase.min.js"></script>
<script src="../lib/stage.js"></script>
<script src="../lib/audio.js"></script>
<script>
/* Storyboard (14 s) — sin texto
   0,15–1,1   la grilla suiza se dibuja; aparecen 8 sistemas estrechos, uno por celda
   1,1–3,5    cada uno hace SU tarea, aislado: gira · ordena · traduce · clasifica · encaja · predice · equilibra · completa
   3,5–4,5    se tienden líneas entre vecinos; donde cruzan, las paredes de las celdas se abren
   4,45–5,75  los aparatos se borran, los sistemas se frenan; cada uno se reduce a un punto y brota su ficha
   5,8–6,8    las fichas convergen (la red se contrae) y se funden en una forma negra: impacto
   7,2–12,0   montaje que acelera: la forma general visita las 8 celdas (fantasmas) y hace cada tarea
              con el aparato de tinta de ese sistema; al irse queda la huella del aparato
   12,0–13,35 tarea nueva, en el centro: predice la trayectoria y clasifica a la vez (cae en su cajón)
   13,35–13,75 fundido al papel */
M.scene({ duration: 14, push: 0, audio: { key: 'D', mode: 'lydian', bed: { cycle: 9, bright: 0.9 } } }, (tl, M) => {
  const $ = (s) => document.querySelector(s);
  const ctx = $('#cv').getContext('2d');
  { const g = $('#grain').getContext('2d'); const im = g.createImageData(512, 512); const rn = M.rng(3);
    for (let i = 0; i < im.data.length; i += 4) { const v = 170 + rn() * 85; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
    g.putImageData(im, 0, 0); }

  const C = { paper: '#F2EDE4', red: '#D2452B', blue: '#2E4A9E', yellow: '#E8B63B', ink: '#1B1A18' };
  const TAU = Math.PI * 2, clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v)), lerp = (a, b, m) => a + (b - a) * m;
  const eA = gsap.parseEase('apple'), eO = gsap.parseEase('appleOut'), eI = gsap.parseEase('appleIn'), eSp = M.spring(0.18);
  const CX = 960, CY = 540;

  /* ---------- formas: N puntos por ángulo desde un origen interior → morph punto a punto ---------- */
  const N = 160;
  const fromPoly = (verts, o = [0, 0]) => { const out = [];
    for (let i = 0; i < N; i++) { const a = -Math.PI / 2 + i / N * TAU, dx = Math.cos(a), dy = Math.sin(a); let best = 1e9;
      for (let j = 0; j < verts.length; j++) { const A = [verts[j][0] - o[0], verts[j][1] - o[1]], B0 = verts[(j + 1) % verts.length], B = [B0[0] - o[0], B0[1] - o[1]];
        const ex = B[0] - A[0], ey = B[1] - A[1], den = dx * ey - dy * ex; if (Math.abs(den) < 1e-12) continue;
        const t = (A[0] * ey - A[1] * ex) / den, s = (A[0] * dy - A[1] * dx) / den; if (t > 0 && s >= -1e-9 && s <= 1 + 1e-9 && t < best) best = t; }
      out.push([dx * best, dy * best]); }   // relativo al origen: el origen pasa a ser el (0, 0) de la forma
    return out; };
  const HC = 4 / (3 * Math.PI);   // centroide del semicírculo (desde el lado plano)
  const SH = {
    circle: Array.from({ length: N }, (_, i) => { const a = -Math.PI / 2 + i / N * TAU; return [Math.cos(a), Math.sin(a)]; }),
    square: fromPoly([[-1, -1], [1, -1], [1, 1], [-1, 1]]),
    tri: fromPoly([0, 1, 2].map((k) => [Math.cos(-Math.PI / 2 + k * TAU / 3), Math.sin(-Math.PI / 2 + k * TAU / 3)])),
    // semicírculo con cúpula arriba, centrado en su centroide (lado plano en y = +HC)
    half: fromPoly(Array.from({ length: 145 }, (_, k) => { const a = Math.PI + k / 144 * Math.PI; return [Math.cos(a), Math.sin(a)]; }), [0, -HC]),
  };
  const lerpPts = (A, B, m) => (m <= 0 ? A : m >= 1 ? B : A.map((p, i) => [p[0] + (B[i][0] - p[0]) * m, p[1] + (B[i][1] - p[1]) * m]));
  const drawBlob = (b) => { if (b.sx < 0.3 && b.sy < 0.3) return; ctx.save(); ctx.translate(b.x, b.y); if (b.rot) ctx.rotate(b.rot); ctx.beginPath();
    const P = b.pts; for (let i = 0; i < N; i++) { const p = P[i]; i ? ctx.lineTo(p[0] * b.sx, p[1] * b.sy) : ctx.moveTo(p[0] * b.sx, p[1] * b.sy); }
    ctx.closePath(); ctx.fillStyle = b.c; ctx.fill();
    if (b.seam) { ctx.lineWidth = 4; ctx.strokeStyle = C.paper; ctx.lineJoin = 'miter'; ctx.stroke(); }
    ctx.restore(); };
  const line = (x1, y1, x2, y2, w = 3, c = C.ink) => { if (w < 0.05) return; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineWidth = w; ctx.strokeStyle = c; ctx.lineCap = 'butt'; ctx.stroke(); };
  const dotted = (P, f0, f1, n = 80) => { ctx.save(); ctx.setLineDash([1, 13]); ctx.lineCap = 'round'; ctx.lineWidth = 6; ctx.strokeStyle = C.ink; ctx.beginPath();
    const i0 = Math.floor(f0 * n), i1 = Math.floor(f1 * n); for (let i = i0; i <= i1; i++) { const [x, y] = P(i / n); i === i0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
    ctx.stroke(); ctx.restore(); };

  /* ---------- grilla de 4 × 2 celdas ---------- */
  const S = 392, G = 32, X0 = 128, Y0 = 132;
  const cells = Array.from({ length: 8 }, (_, i) => { const x = X0 + (i % 4) * (S + G), y = Y0 + Math.floor(i / 4) * (S + G);
    return { i, x, y, cx: x + S / 2, cy: y + S / 2, on: { v: 0 }, frame: { v: 0 }, gap: [{ v: 0 }, { v: 0 }, { v: 0 }, { v: 0 }] }; });

  /* ---------- sistemas estrechos: app(lt) dibuja el aparato en tinta; blobs(lt) devuelve SIEMPRE la misma
     cantidad de formas de color (coordenadas locales a la celda) ---------- */
  const sideCls = (j) => [1, -1, -1, 1, -1, 1, 1, -1][((j % 8) + 8) % 8];
  const sorter = (lt, start, SW, hold, reset) => {   // posiciones (en ranuras) de cada barra en un ordenamiento burbuja animado
    const steps = [], ord = start.slice();
    for (let a = 0; a < ord.length; a++) for (let b = 0; b < ord.length - 1 - a; b++) if (ord[b] > ord[b + 1]) { steps.push(b); [ord[b], ord[b + 1]] = [ord[b + 1], ord[b]]; }
    const cyc = steps.length * SW + hold + reset, u = reset ? ((lt % cyc) + cyc) % cyc : Math.max(0, lt);
    const slotOf = (arr) => { const p = []; arr.forEach((bar, s) => (p[bar] = s)); return p; };
    const cur = start.slice(), nS = Math.min(steps.length, Math.floor(u / SW));
    for (let s = 0; s < nS; s++) { const b = steps[s]; [cur[b], cur[b + 1]] = [cur[b + 1], cur[b]]; }
    let P = slotOf(cur), lift = [], mover = -1;
    if (nS < steps.length) { const b = steps[nS], f = eA(clamp((u - nS * SW) / (SW - 0.06))); P[cur[b]] = b + f; P[cur[b + 1]] = b + 1 - f; if (f > 0 && f < 1) { lift[cur[b]] = Math.sin(Math.PI * f); mover = cur[b]; } }
    else if (reset && u > steps.length * SW + hold) { const f = eA(clamp((u - steps.length * SW - hold) / (reset - 0.1))); const P0 = slotOf(start); P = P.map((p, bar) => p + (P0[bar] - p) * f); }
    P.lift = lift; P.mover = mover; return P; };
  const bars = (P, H, x0, dx, base, w, lh, c) => {   // la barra que avanza pasa por arriba (se levanta y se dibuja al final, con junta de papel)
    const out = H.map((h, bar) => ({ pts: SH.square, x: x0 + P[bar] * dx, y: base - h / 2 - lh * (P.lift[bar] || 0), sx: w, sy: h / 2, rot: 0, c, seam: bar === P.mover }));
    if (P.mover >= 0) { const m = out.splice(P.mover, 1)[0]; out.push(m); } return out; };
  const SYS = [
    // 0 · gira (paso de 90° por segundo)
    { per: 1.0, want: 0.75,
      app() { ctx.beginPath(); ctx.arc(0, 0, 124, 0, TAU); ctx.lineWidth = 3; ctx.strokeStyle = C.ink; ctx.stroke(); },
      top() { ctx.beginPath(); ctx.arc(0, 0, 6, 0, TAU); ctx.fillStyle = C.ink; ctx.fill(); },
      blobs(lt) { const k = Math.floor(lt), u = eA(clamp((lt - k) / 0.55)); return [{ pts: SH.half, x: 0, y: 0, sx: 120, sy: 120, rot: (k + u) * Math.PI / 2, c: C.red }]; } },
    // 1 · ordena
    { per: 5 * 0.42 + 0.9 + 0.7, want: 2.6,
      app() { line(-140, 126, 140, 126, 3); },
      blobs(lt) { return bars(sorter(lt, [3, 0, 4, 1, 2], 0.42, 0.9, 0.7), [60, 100, 140, 180, 220], -108, 54, 126, 19, 36, C.blue); } },
    // 2 · traduce un patrón: puntos (tinta) → barras (amarillo) al cruzar la línea
    { per: 448 / 44, want: 3.0,
      app() { line(0, -130, 0, 130, 3); },
      blobs(lt) { const R = [9, 20, 14, 26, 12, 22, 17, 10], K = R.length, SP = 56, out = [];
        for (let k = 0; k < K; k++) { const x = -224 + ((((lt * 44 + k * SP) % (K * SP)) + K * SP) % (K * SP)), m = x < 0 ? 0 : 1, r = R[k];
          out.push({ pts: m ? SH.square : SH.circle, x, y: 0, sx: m ? 11 : r, sy: m ? r * 4.4 : r, rot: 0, c: m ? C.yellow : C.ink }); }
        return out; } },
    // 3 · clasifica: rojos a un lado, azules al otro
    { per: 0.8 * 8, want: 1.95,
      app(lt) { const P = 0.8, k = Math.floor((lt - 0.5) / P), u = eA(clamp(((lt - 0.5) - k * P) / 0.3)), ang = lerp(sideCls(k - 1), sideCls(k), u) * 0.5;
        ctx.save(); ctx.translate(0, -36); ctx.rotate(ang); line(-60, 0, 60, 0, 5); ctx.restore();
        [-1, 1].forEach((s) => { ctx.beginPath(); ctx.moveTo(s * 96 - 40, 90); ctx.lineTo(s * 96 - 40, 146); ctx.lineTo(s * 96 + 40, 146); ctx.lineTo(s * 96 + 40, 90); ctx.lineWidth = 3; ctx.strokeStyle = C.ink; ctx.stroke(); }); },
      top() { ctx.beginPath(); ctx.arc(0, -36, 6, 0, TAU); ctx.fillStyle = C.ink; ctx.fill(); },
      blobs(lt) { const P = 0.8, out = [], k1 = Math.floor(lt / P);
        for (let k = k1 - 2; k <= k1; k++) { const u = lt - k * P, s = sideCls(k); let x = 0, y = -200, sc = 0;
          if (u >= 0 && u <= 1.75) { sc = 1;
            if (u < 0.5) y = -200 + 140 * (u / 0.5) ** 2; else if (u < 1.1) { const f = eI(clamp((u - 0.5) / 0.6)); x = s * 96 * f; y = -60 + 182 * f; } else { x = s * 96; y = 122; sc = 1 - eI(clamp((u - 1.35) / 0.4)); } }
          out[((k % 3) + 3) % 3] = { pts: SH.circle, x, y, sx: 20 * sc, sy: 20 * sc, rot: 0, c: s < 0 ? C.red : C.blue }; }
        return out; } },
    // 4 · encaja: arranca torcida 40°, prueba dos giros de 20° y entra
    { per: 3.4, want: 2.5,
      app() { ctx.save(); ctx.translate(0, 84); ctx.beginPath(); for (let k = 0; k < 3; k++) { const a = -Math.PI / 2 + k * TAU / 3; ctx.lineTo(Math.cos(a) * 80, Math.sin(a) * 80); } ctx.closePath(); ctx.lineWidth = 3; ctx.strokeStyle = C.ink; ctx.lineJoin = 'miter'; ctx.stroke(); ctx.restore(); },
      blobs(lt) { const u = ((lt % 3.4) + 3.4) % 3.4, d = Math.PI / 9; let rot = 2 * d, y = -84;
        if (u < 0.5) rot = 2 * d; else if (u < 0.95) rot = 2 * d - d * eA(clamp((u - 0.5) / 0.45)); else if (u < 1.3) rot = d; else if (u < 1.75) rot = d - d * eA(clamp((u - 1.3) / 0.45));
        else { rot = 0; if (u < 2.3) y = -84 + 168 * eA(clamp((u - 1.75) / 0.55)); else if (u < 2.8) y = 84; else { const f = eA(clamp((u - 2.8) / 0.55)); y = 84 - 168 * f; rot = 2 * d * f; } }
        return [{ pts: SH.tri, x: 0, y, sx: 68, sy: 68, rot, c: C.yellow }]; } },
    // 5 · predice la trayectoria antes de lanzar (la trayectoria queda tenue: la celda nunca queda vacía)
    { per: 2.6, want: 1.25,
      app(lt) { const u = ((lt % 2.6) + 2.6) % 2.6, pr = eO(clamp(u / 0.6)), tail = u < 1.95 ? 0 : eA(clamp((u - 1.95) / 0.45)), P = (f) => [-132 + 264 * f, 108 - 400 * f * (1 - f)];
        const a0 = ctx.globalAlpha; ctx.globalAlpha = a0 * 0.22; dotted(P, 0, 1); ctx.globalAlpha = a0;
        if (tail < 1) dotted(P, tail, pr); line(-156, 132, 156, 132, 3); },
      blobs(lt) { const u = ((lt % 2.6) + 2.6) % 2.6; let f = 0, sc = 1;
        if (u < 0.5) sc = eO(clamp(u / 0.3)); else if (u < 1.8) f = eA(clamp((u - 0.5) / 1.3)); else { f = 1; sc = 1 - eI(clamp((u - 2.25) / 0.3)); }
        return [{ pts: SH.circle, x: -132 + 264 * f, y: 108 - 400 * f * (1 - f) - 24, sx: 22 * sc, sy: 22 * sc, rot: 0, c: C.red }]; } },
    // 6 · equilibra
    { per: TAU / 1.7, want: 1.0,
      app(lt) { const th = -0.17 * Math.sin(1.7 * lt); ctx.save(); ctx.translate(0, 62); ctx.rotate(th); line(-146, 0, 146, 0, 7); ctx.restore();
        ctx.beginPath(); ctx.moveTo(0, 62); ctx.lineTo(-32, 126); ctx.lineTo(32, 126); ctx.closePath(); ctx.fillStyle = C.ink; ctx.fill(); },
      blobs(lt) { const th = -0.17 * Math.sin(1.7 * lt), s = 92 * Math.sin(1.7 * lt - 0.5), up = -27;
        return [{ pts: SH.circle, x: Math.cos(th) * s - Math.sin(th) * up, y: 62 + Math.sin(th) * s + Math.cos(th) * up, sx: 23, sy: 23, rot: 0, c: C.blue }]; } },
    // 7 · completa el patrón: el centro rojo está dado; las cuatro esquinas se completan
    { per: 3.2, want: 2.15,
      app() { ctx.lineWidth = 2.5; ctx.strokeStyle = C.ink; for (let r = 0; r < 3; r++) for (let q = 0; q < 3; q++) ctx.strokeRect(-108 + q * 78, -108 + r * 78, 60, 60); },
      blobs(lt) { const u = ((lt % 3.2) + 3.2) % 3.2;
        return [4, 0, 8, 2, 6].map((c, k) => { let s = 1;
          if (k) { s = eO(clamp((u - 0.1 - (k - 1) * 0.3) / 0.3)); if (u > 2.6) s *= 1 - eI(clamp((u - 2.6) / 0.35)); }
          return { pts: SH.square, x: -78 + (c % 3) * 78, y: -78 + Math.floor(c / 3) * 78, sx: 25 * s, sy: 25 * s, rot: 0, c: c === 4 ? C.red : C.ink }; }); } },
  ];

  /* ---------- tiempos ---------- */
  const T_ON = 0.55, T_CONN = 3.5, T_APP = 4.45, T1 = 4.65, T2 = 5.05, T_COND = 5.05, T_TRAV = 5.8, T_ONE = 6.8;
  const startOf = (i) => T_ON + i * 0.06;
  const base = (i) => (T1 - startOf(i)) + (T2 - T1) / 2;
  SYS.forEach((s, i) => { s.off = (((s.want - base(i)) % s.per) + s.per) % s.per; });
  const ltOf = (i, t) => { const s0 = startOf(i), D = T2 - T1; let f;
    if (t <= T1) f = Math.max(0, t - s0); else if (t < T2) { const u = (t - T1) / D; f = (T1 - s0) + D * (u - u * u / 2); } else f = base(i);
    return SYS[i].off + f; };

  /* captura: qué formas de color siguen visibles y dentro de su celda al congelarse; por celda, una es la "principal" */
  const pool = [];
  cells.forEach((c, i) => SYS[i].blobs(ltOf(i, T2)).forEach((b, j) => {
    const r = Math.max(b.sx, b.sy); b.keep = b.sx > 2 && Math.abs(b.x) + b.sx < S / 2 - 6 && Math.abs(b.y) + r < S / 2 - 6;
    if (b.keep) pool.push({ ...b, x: c.cx + b.x, y: c.cy + b.y, cell: i, j, rot: b.rot || 0, score: r - 0.25 * Math.hypot(b.x, b.y) });
  }));
  const keepSet = new Set(pool.map((p) => p.cell + ':' + p.j));
  cells.forEach((c, i) => { const mine = pool.filter((p) => p.cell === i); mine.sort((a, b) => b.score - a.score); if (mine[0]) mine[0].main = true; });

  /* cada sistema se reduce a un punto y brota UNA forma (su ficha), a escuadra, en el centro de su celda */
  const TOK = [
    { pts: SH.half, s: 84, c: C.red }, { pts: SH.square, s: 56, c: C.blue }, { pts: SH.circle, s: 62, c: C.yellow }, { pts: SH.circle, s: 58, c: C.ink },
    { pts: SH.tri, s: 82, c: C.yellow }, { pts: SH.circle, s: 60, c: C.red }, { pts: SH.circle, s: 60, c: C.blue }, { pts: SH.square, s: 54, c: C.ink } ];
  const tokOf = (i, s = TOK[i].s) => ({ pts: TOK[i].pts, x: cells[i].cx, y: cells[i].cy, sx: s, sy: s, rot: 0, c: TOK[i].c });
  const R0 = 9, SHRINK = 0.28, BLOOM = 0.34, condT0 = (i) => T_COND + i * 0.015;
  const mixState = (A, B, m, mc = m, ms = m) => ({ pts: lerpPts(A.pts, B.pts, ms), x: lerp(A.x, B.x, m), y: lerp(A.y, B.y, m), sx: lerp(A.sx, B.sx, m), sy: lerp(A.sy, B.sy, m), rot: lerp(A.rot, B.rot, m), c: mc < 0.5 ? A.c : B.c });
  const R1 = 150, one = { r: 0.84 };   // al llegar, las fichas se asientan en un círculo algo más chico y la forma "se infla"
  const travel = (t) => eA(clamp((t - T_TRAV) / (T_ONE - T_TRAV)));
  const fusionState = (t) => {
    if (t >= T_TRAV) { const mp = travel(t), u = clamp((t - T_TRAV) / (T_ONE - T_TRAV)), tgt = { pts: SH.circle, x: CX, y: CY, sx: R1 * one.r, sy: R1 * one.r, rot: 0, c: C.ink };
      return cells.map((c, i) => mixState(tokOf(i), tgt, mp, u >= 0.72 ? 1 : 0, eA(clamp((u - 0.3) / 0.6)))); }
    const out = [];
    pool.forEach((p) => { const u = t - condT0(p.cell);
      if (!p.main) { const k = 1 - eI(clamp(u / 0.25)); out.push({ ...p, sx: p.sx * k, sy: p.sy * k }); return; }
      if (u < SHRINK) { const f = eI(clamp(u / SHRINK)), m = eA(clamp(u / SHRINK)), k = lerp(1, R0 / Math.max(p.sx, p.sy), f);
        out.push({ ...p, x: lerp(p.x, cells[p.cell].cx, m), y: lerp(p.y, cells[p.cell].cy, m), sx: p.sx * k, sy: p.sy * k }); }
      else out.push(tokOf(p.cell, lerp(R0, TOK[p.cell].s, eO(clamp((u - SHRINK) / BLOOM))))); });
    return out; };

  /* ---------- montaje: la forma general visita cada celda y hace SU tarea, con su aparato, cada vez más rápido ---------- */
  const K = 8, T_GO = 7.2;
  const VIS = [0, 1, 2, 3, 7, 6, 5, 4];                       // recorrido en serpiente por la grilla
  const MS = [0.38, 0.26, 0.21, 0.18, 0.16, 0.14, 0.13, 0.12]; // viaje hasta la celda
  const DS = [0.82, 0.72, 0.48, 0.38, 0.28, 0.22, 0.19, 0.17]; // tarea
  const LT = { 0: [-0.25, 1.75], 1: [0, 2.25], 2: [1.2, 3.6], 3: [2.85, 3.7], 4: [0.9, 2.4], 5: [0.35, 2.0], 6: [0.3, 2.15], 7: [0, 1.5] };
  let tc = T_GO;
  const PLAN = VIS.map((i) => { const n = VIS.indexOf(i), o = { i, t0: tc, ta: tc + MS[n], tl: tc + MS[n] + DS[n], lt0: LT[i][0], lt1: LT[i][1] }; tc = o.tl; return o; });
  const lteOf = (o, t) => lerp(o.lt0, o.lt1, clamp((t - o.ta) / (o.tl - o.ta)));
  const expand = (L) => Array.from({ length: K }, (_, k) => L[k % L.length]);
  const taskState = (i, lt) => expand(SYS[i].blobs(lt).map((b) => {   // coordenadas de mundo; lo que sale de la celda se achica (sin recorte)
    const e = clamp((S / 2 - 8 - Math.max(Math.abs(b.x) + b.sx, Math.abs(b.y) + b.sy)) / 14);
    return { ...b, x: cells[i].cx + b.x, y: cells[i].cy + b.y, sx: b.sx * e, sy: b.sy * e, rot: b.rot || 0 }; }));

  // tarea nueva (en el centro): predice la trayectoria y la bola roja cae exacto en su cajón (el izquierdo, como en "clasifica")
  const FIN = { t0: tc, ta: tc + 0.28 }; FIN.arc0 = FIN.ta + 0.02; FIN.arc1 = FIN.arc0 + 0.3; FIN.fly0 = FIN.arc1 + 0.04; FIN.fly1 = FIN.fly0 + 0.46;
  const BIN = 150, BALL = 26, F0 = [CX + 190, CY - 70], F1 = [CX - BIN, CY + 128 - BALL];
  const finP = (f) => [lerp(F0[0], F1[0], f), lerp(F0[1], F1[1], f) - 250 * 4 * f * (1 - f)];
  const finState = (t) => { const f = eA(clamp((t - FIN.fly0) / (FIN.fly1 - FIN.fly0))), [x, y] = finP(f);
    return expand([{ pts: SH.circle, x, y, sx: BALL, sy: BALL, rot: 0, c: C.red }]); };
  const finApp = (t) => { const pr = eO(clamp((t - FIN.arc0) / (FIN.arc1 - FIN.arc0)));
    [-1, 1].forEach((s) => { const x = CX + s * BIN; ctx.beginPath(); ctx.moveTo(x - 46, CY + 70); ctx.lineTo(x - 46, CY + 132); ctx.lineTo(x + 46, CY + 132); ctx.lineTo(x + 46, CY + 70); ctx.lineWidth = 3; ctx.strokeStyle = C.ink; ctx.stroke(); });
    if (pr > 0) dotted(finP, 0, pr); };

  // viaje entre dos estados: todo se reúne en un punto de tinta (la forma general), viaja y vuelve a abrirse
  const PUCK = 34;
  const hop = (A, cA, B, cB, v) => { const a = eA(v), ax = lerp(cA[0], cB[0], a), ay = lerp(cA[1], cB[1], a);
    return A.map((pa, k) => { const pb = B[k];
      if (v < 0.5) { const m = eA(clamp(v / 0.5)); return { pts: lerpPts(pa.pts, SH.circle, m), x: ax + (pa.x - cA[0]) * (1 - m), y: ay + (pa.y - cA[1]) * (1 - m), sx: lerp(pa.sx, PUCK, m), sy: lerp(pa.sy, PUCK, m), rot: pa.rot * (1 - m), c: m < 0.45 ? pa.c : C.ink }; }
      const m = eA(clamp((v - 0.5) / 0.5)); return { pts: lerpPts(SH.circle, pb.pts, m), x: ax + (pb.x - cB[0]) * m, y: ay + (pb.y - cB[1]) * m, sx: lerp(PUCK, pb.sx, m), sy: lerp(PUCK, pb.sy, m), rot: pb.rot * m, c: m < 0.55 ? C.ink : pb.c }; }); };
  const ctrOf = (i) => [cells[i].cx, cells[i].cy];
  const oneState = () => expand([{ pts: SH.circle, x: CX, y: CY, sx: R1 * one.r, sy: R1 * one.r, rot: 0, c: C.ink }]);
  const genAt = (t) => {
    if (t < PLAN[0].t0) return oneState();
    for (let n = 0; n < PLAN.length; n++) { const o = PLAN[n];
      if (t < o.ta) { const A = n ? taskState(PLAN[n - 1].i, PLAN[n - 1].lt1) : oneState(), cA = n ? ctrOf(PLAN[n - 1].i) : [CX, CY];
        return hop(A, cA, taskState(o.i, o.lt0), ctrOf(o.i), (t - o.t0) / (o.ta - o.t0)); }
      if (t < o.tl) return taskState(o.i, lteOf(o, t)); }
    const L = PLAN[PLAN.length - 1];
    if (t < FIN.ta) return hop(taskState(L.i, L.lt1), ctrOf(L.i), finState(FIN.ta), [CX, CY], (t - FIN.t0) / (FIN.ta - FIN.t0));
    return finState(t); };
  // alfa del aparato de cada celda: entra al llegar la forma, queda como huella tenue al irse
  const TRACE = 0.16;
  const appAlpha = (o, t) => { const inn = eO(clamp((t - (o.ta - 0.1)) / 0.12)), out = eA(clamp((t - o.tl) / 0.18)); return inn * lerp(1, TRACE, out); };

  /* ---------- líneas entre vecinos (se tienden desde ambos lados) ---------- */
  const edges = [];
  for (let i = 0; i < 8; i++) { if (i % 4 < 3) edges.push([i, i + 1]); if (i < 4) edges.push([i, i + 4]); }
  const eProg = edges.map(() => ({ v: 0 }));

  /* ---------- timeline ---------- */
  tl.to('#fade', { opacity: 0, duration: 0.45, ease: 'none' }, 0.12);
  const grid = { v: 0 }, app = { v: 1 }, ghost = { v: 0 }, finA = { v: 0 };
  tl.to(grid, { v: 1, duration: 1.2, ease: 'appleOut' }, 0.15);
  cells.forEach((c, i) => { tl.to(c.frame, { v: 1, duration: 0.75, ease: 'appleOut' }, 0.18 + i * 0.05); tl.to(c.on, { v: 1, duration: 0.6, ease: 'appleOut' }, startOf(i)); });
  edges.forEach((e, k) => tl.to(eProg[k], { v: 1, duration: 0.6, ease: 'appleOut' }, T_CONN + k * 0.045));
  // las paredes se abren donde las cruza una línea (lados internos) y un poco después las externas
  cells.forEach((c, i) => { const col = i % 4, row = Math.floor(i / 4);
    const inner = [row === 1, col < 3, row === 0, col > 0];   // arriba, derecha, abajo, izquierda
    c.gap.forEach((g, s) => tl.to(g, { v: 1, duration: 0.6, ease: 'apple' }, (inner[s] ? T_CONN + 0.42 : T_CONN + 0.62) + (i % 4) * 0.03)); });
  tl.to(app, { v: 0, duration: 0.5, ease: 'appleIn' }, T_APP);
  tl.to(one, { r: 1, duration: 0.7, ease: eSp }, T_ONE);
  tl.to(ghost, { v: 1, duration: 0.5, ease: 'appleOut' }, T_ONE + 0.1);          // vuelven las celdas, como fantasmas
  tl.to(finA, { v: 1, duration: 0.2, ease: 'appleOut' }, FIN.ta - 0.12);
  tl.to('#fade', { opacity: 1, duration: 0.4, ease: 'appleIn' }, 13.35);
  tl.set({}, {}, 14);

  /* ---------- sonido: pocos eventos, cada uno con motivo ---------- */
  [0, 2, 4, 7, 9, 11, 12, 14].forEach((d, i) => M.sfx(startOf(i) + 0.02, 'tap', { deg: d, oct: 5, bright: 0.7, gain: -8, pan: -0.5 + (i % 4) / 3 }));   // aparecen los 8 sistemas
  M.sfx(T_CONN, 'scan', { dur: 0.9, from: 400, to: 2400, q: 4, gain: -4 });                 // se tienden las líneas
  M.sfx(T_CONN + 0.45, 'tick', { tone: 'glass', gain: -3 });                                  // se abren las paredes
  M.sfx(T_COND + SHRINK, 'tap', { deg: 4, oct: 4, bright: 0.6, gain: -5 });                   // brotan las fichas
  M.sfx(T_ONE, 'swell', { dur: 1.2, gain: -1 }).sfx(T_ONE, 'impact', { weight: 0.9 });       // se funden en una
  M.sfx((PLAN[0].t0 + PLAN[0].ta) / 2, 'whoosh', { dur: 0.5, peak: 0.5, anchor: 'peak', gain: -9, dir: -1 });   // sale hacia la primera celda
  PLAN.forEach((o, n) => M.sfx(o.ta, 'tap', { deg: [0, 2, 4, 5, 7, 9, 11, 12][n], oct: 4, bright: 0.75, gain: -5 - n * 0.2, pan: -0.55 + (o.i % 4) * 0.37 }));   // una nota por tarea, cada vez más juntas
  M.sfx(FIN.arc0, 'scan', { dur: 0.3, from: 900, to: 2600, q: 5, gain: -8, dir: -1 });        // predice la trayectoria
  M.sfx(FIN.fly1, 'shimmer', { degs: [4, 7, 9], spread: 0.04, gain: -5 });                    // cae en su cajón

  /* ---------- dibujo por cuadro ---------- */
  const sideSeg = (c, s) => { const { x, y } = c; return [[x, y, x + S, y], [x + S, y, x + S, y + S], [x + S, y + S, x, y + S], [x, y + S, x, y]][s]; };
  M.onFrame((t) => {
    ctx.fillStyle = C.paper; ctx.fillRect(0, 0, 1920, 1080);
    // grilla suiza sutil: 12 columnas y 6 líneas base
    ctx.save(); ctx.globalAlpha = 0.075 * grid.v; ctx.strokeStyle = C.ink; ctx.lineWidth = 1;
    for (let k = 0; k <= 12; k++) { const x = X0 + k * (1664 / 12); ctx.beginPath(); ctx.moveTo(x, 60); ctx.lineTo(x, 1020); ctx.stroke(); }
    for (let k = 0; k <= 6; k++) { const y = Y0 + k * (816 / 6); ctx.beginPath(); ctx.moveTo(60, y); ctx.lineTo(1860, y); ctx.stroke(); }
    ctx.restore();

    // paredes de las celdas (se dibujan en orden y se abren desde el centro de cada lado)
    cells.forEach((c) => { for (let s = 0; s < 4; s++) { const vis = clamp(c.frame.v * 4 - s), g = c.gap[s].v; if (vis <= 0 || g >= 1) continue;
      const [x1, y1, x2, y2] = sideSeg(c, s), ex = x1 + (x2 - x1) * vis, ey = y1 + (y2 - y1) * vis, h = 0.5 * (1 - g);
      if (g <= 0) line(x1, y1, ex, ey, 2.5); else { line(x1, y1, x1 + (x2 - x1) * h, y1 + (y2 - y1) * h, 2.5); line(x2, y2, x2 + (x1 - x2) * h, y2 + (y1 - y2) * h, 2.5); } } });

    if (t >= T_ONE) {
      // celdas fantasma + aparatos de tinta (el de la tarea actual, pleno; los ya hechos, como huella)
      if (ghost.v > 0) { ctx.save(); ctx.globalAlpha = 0.09 * ghost.v; ctx.strokeStyle = C.ink; ctx.lineWidth = 2.5; cells.forEach((c) => ctx.strokeRect(c.x, c.y, S, S)); ctx.restore(); }
      PLAN.forEach((o) => { const a = appAlpha(o, t); if (a <= 0.003) return; const lt = lteOf(o, t), sys = SYS[o.i];
        ctx.save(); ctx.translate(cells[o.i].cx, cells[o.i].cy); ctx.globalAlpha = a; sys.app && sys.app(lt); ctx.restore(); });
      if (finA.v > 0) { ctx.save(); ctx.globalAlpha = finA.v; finApp(t); ctx.restore(); }
      genAt(t).forEach(drawBlob);
      PLAN.forEach((o) => { const a = appAlpha(o, t), sys = SYS[o.i]; if (a <= 0.003 || !sys.top) return;
        ctx.save(); ctx.translate(cells[o.i].cx, cells[o.i].cy); ctx.globalAlpha = a; sys.top(lteOf(o, t)); ctx.restore(); });
      return;
    }

    // centros de cada sistema (se mueven con la fusión)
    const fused = t >= T_COND, mT = travel(t);
    const ctr = cells.map((c) => [lerp(c.cx, CX, mT), lerp(c.cy, CY, mT)]);

    // líneas entre vecinos
    edges.forEach(([a, b], k) => { const p = eProg[k].v; if (p <= 0) return; const A = ctr[a], B = ctr[b], h = p / 2;
      const w = 2.5 * (1 - eI(clamp((t - T_TRAV) / (T_ONE - T_TRAV))));
      line(A[0], A[1], A[0] + (B[0] - A[0]) * h, A[1] + (B[1] - A[1]) * h, w); line(B[0], B[1], B[0] + (A[0] - B[0]) * h, B[1] + (A[1] - B[1]) * h, w); });

    if (!fused) {
      cells.forEach((c, i) => { const s = c.on.v; if (s <= 0) return; const lt = ltOf(i, t), sys = SYS[i], sc = 0.86 + 0.14 * s;
        ctx.save(); ctx.beginPath(); ctx.rect(c.x + 2, c.y + 2, S - 4, S - 4); ctx.clip(); ctx.translate(c.cx, c.cy); ctx.scale(sc, sc);
        ctx.globalAlpha = s * app.v; sys.app && sys.app(lt); ctx.globalAlpha = s;
        sys.blobs(lt).forEach((b, j) => { const k = keepSet.has(i + ':' + j) ? 1 : app.v; drawBlob({ ...b, sx: b.sx * k, sy: b.sy * k, rot: b.rot || 0 }); });
        ctx.globalAlpha = s * app.v; sys.top && sys.top(lt);
        ctx.restore(); });
    } else fusionState(t).forEach(drawBlob);
  });
});
</script>
</body>
