<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>01 · Balance calórico</title>
<link rel="stylesheet" href="../lib/theme.css">
<style>
  #kicker1 { top: 318px; }
  #title { top: 360px; left: 0; right: 0; text-align: center; transform-origin: 50% 50%; }
  #title .display { font-size: 250px; display: inline-block; }
  #sub1 { top: 690px; left: 0; right: 0; text-align: center; font-size: 46px; font-weight: 400; color: var(--sky); letter-spacing: -0.01em; }
  #sub1 b { color: var(--white); font-weight: 700; }

  #rig { position: absolute; inset: 0; overflow: visible; }

  .hang { position: absolute; left: 0; top: 0; width: 480px; height: 272px; }
  .hang .card { left: 0; top: 0; width: 480px; height: 272px; padding: 34px 38px; }
  .card .row { display: flex; align-items: center; gap: 20px; }
  .card .ico-badge { width: 84px; height: 84px; border-radius: 22px; }
  .card .ico-badge .ico { width: 50px; height: 50px; }
  .card .lbl { font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 22px; line-height: 1.35; letter-spacing: 0.18em; color: var(--sky); }
  .card .val { margin-top: 20px; display: flex; align-items: baseline; gap: 14px; }
  .card .val .num { font-size: 108px; line-height: 1; }
  .card .val .unit { font-size: 34px; }
  #cardR .ico-badge .ico { color: var(--white); }

  #badgeWrap { position: absolute; left: 960px; top: 300px; }
  #badge { position: relative; transform: translateX(-50%); }
  #badge .k { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 24px; letter-spacing: 0.26em; color: var(--sky); }
  #badge .v { font-size: 52px; font-weight: 800; letter-spacing: -0.02em; color: var(--cyan); }
  #badge .v small { font-size: 28px; font-weight: 500; color: var(--sky); margin-left: 6px; font-family: "JetBrains Mono", monospace; letter-spacing: 0; }
  #badge .sep { width: 1.5px; height: 40px; background: var(--card-border); }
  #badge .ico { width: 44px; height: 44px; }

  #kicker2 { top: 348px; }
  #big { top: 380px; left: 0; right: 0; text-align: center; }
  #big .display { font-size: 230px; display: inline-block; }
  #resWrap { position: absolute; left: 960px; top: 720px; }
  #res { position: relative; transform: translateX(-50%); padding: 22px 44px 22px 26px; gap: 22px; }
  #res .ico-badge { width: 72px; height: 72px; border-radius: 999px; }
  #res .ico-badge .ico { width: 44px; height: 44px; }
  #res .t { font-size: 50px; font-weight: 800; letter-spacing: -0.02em; }
  #res .t span { color: var(--cyan); }
</style>
</head>
<body>
<div id="bg"></div>
<div id="world">

  <!-- Beat 1: título -->
  <div id="kicker1" class="abs center-x kicker"><span class="dot"></span><span class="txt">El principio básico</span></div>
  <div id="title" class="abs"><div class="display reflect">CALORÍAS</div></div>
  <div id="sub1" class="abs">Lo que decide si el peso <b>sube</b> o <b>baja</b></div>

  <!-- Beat 2: balanza -->
  <svg id="rig" viewBox="0 0 1920 1080" width="1920" height="1080">
    <defs>
      <radialGradient id="gFloor" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#20C4EF" stop-opacity="0.45"/>
        <stop offset="45%" stop-color="#087EFF" stop-opacity="0.14"/>
        <stop offset="100%" stop-color="#087EFF" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="postGrad" gradientUnits="userSpaceOnUse" x1="960" y1="866" x2="960" y2="486">
        <stop offset="0%" stop-color="#087EFF"/><stop offset="100%" stop-color="#20C4EF"/>
      </linearGradient>
      <linearGradient id="beamGrad" gradientUnits="userSpaceOnUse" x1="440" y1="0" x2="1480" y2="0">
        <stop offset="0%" stop-color="#087EFF"/><stop offset="50%" stop-color="#20C4EF"/><stop offset="100%" stop-color="#087EFF"/>
      </linearGradient>
    </defs>
    <ellipse id="floorGlow" class="fondo-only" cx="960" cy="872" rx="330" ry="60" fill="url(#gFloor)"/>
    <g class="glow">
      <ellipse id="base1" cx="960" cy="872" rx="170" ry="24" fill="none" class="st-elec" stroke-width="4"/>
      <ellipse id="base2" cx="960" cy="872" rx="92" ry="12" fill="none" class="st-main" stroke-width="3"/>
      <line id="post" x1="960" y1="866" x2="960" y2="486" stroke="url(#postGrad)" stroke-width="6" stroke-linecap="round"/>
      <line id="strL" class="st-soft" stroke-width="2.5" stroke-linecap="round"/>
      <line id="strR" class="st-soft" stroke-width="2.5" stroke-linecap="round"/>
      <line id="beamL" stroke="url(#beamGrad)" stroke-width="7" stroke-linecap="round"/>
      <line id="beamR" stroke="url(#beamGrad)" stroke-width="7" stroke-linecap="round"/>
      <circle id="capL" class="f-cyan" r="9"/>
      <circle id="capR" class="f-cyan" r="9"/>
      <circle id="ring" class="st-faint fondo-only" cx="960" cy="470" r="34" fill="none" stroke-width="2"/>
      <g id="pivot"><circle cx="960" cy="470" r="17" class="f-night st-main" stroke-width="4"/><circle cx="960" cy="470" r="5" class="f-cyan"/></g>
    </g>
  </svg>

  <div class="hang" id="hangL">
    <div class="card" id="cardL"><div class="accent"></div>
      <div class="row"><span class="ico-badge"><i data-icon="fork-knife"></i></span><div class="lbl">CALORÍAS<br>CONSUMIDAS</div></div>
      <div class="val"><span class="num" id="cL">0</span><span class="unit">kcal</span></div>
    </div>
  </div>
  <div class="hang" id="hangR">
    <div class="card" id="cardR"><div class="accent"></div>
      <div class="row"><span class="ico-badge"><i data-icon="person-simple-run"></i></span><div class="lbl">CALORÍAS<br>GASTADAS</div></div>
      <div class="val"><span class="num" id="cR">0</span><span class="unit">kcal</span></div>
    </div>
  </div>

  <div id="badgeWrap"><div id="badge" class="pill">
    <i data-icon="trend-down"></i><span class="k">DÉFICIT</span><span class="sep"></span><span class="v">−500<small>kcal/día</small></span>
  </div></div>

  <!-- Beat 3: conclusión -->
  <div id="kicker2" class="abs center-x kicker"><span class="dot"></span><span class="txt">Consumir menos de lo que se gasta</span></div>
  <div id="big" class="abs"><div class="display glowtext reflect" id="bigTxt">DÉFICIT</div></div>
  <div id="resWrap"><div id="res" class="pill">
    <span class="ico-badge"><i data-icon="arrow-down"></i></span><span class="t">El peso <span>baja</span></span>
  </div></div>

</div>

<script src="../node_modules/gsap/dist/gsap.min.js"></script>
<script src="../node_modules/gsap/dist/SplitText.min.js"></script>
<script src="../node_modules/gsap/dist/DrawSVGPlugin.min.js"></script>
<script src="../node_modules/gsap/dist/CustomEase.min.js"></script>
<script src="../lib/stage.js"></script>
<script>
M.scene({ duration: 13, icons: ['fork-knife', 'person-simple-run', 'trend-down', 'arrow-down'] }, (tl, M) => {
  const $ = (s) => document.querySelector(s);

  /* ---------------- Beat 1 · título (0 – 3.2 s) ---------------- */
  const k1 = M.textIn($('#kicker1 .txt'), 0.15, { type: 'words', dur: 0.8 });
  M.zoomIn($('#kicker1 .dot'), 0.15);
  const title = M.textIn($('#title .display'), 0.35, { dur: 1.15, stagger: 0.045 });
  const sub = M.textIn($('#sub1'), 1.25, { type: 'words', dur: 0.9, stagger: 0.06 });

  M.textOut(k1, 2.85, { type: 'words' });
  M.zoomOut($('#kicker1 .dot'), 2.85);
  M.textOut(sub, 2.85, { type: 'words', stagger: 0.03 });
  tl.to('#title', { y: -300, scale: 0.36, duration: 1.05, ease: 'swift' }, 3.0);

  /* ---------------- Beat 2 · balanza (3.2 – 8.6 s) ---------------- */
  const rig = { beam: 0, drop: 0, ang: 0 };
  M.draw($('#base1'), 3.35, { dur: 0.9 });
  M.draw($('#base2'), 3.5, { dur: 0.8 });
  if (!M.chroma) tl.from('#floorGlow', { opacity: 0, scale: 0.4, transformOrigin: '50% 50%', duration: 1.2 }, 3.35);
  M.draw($('#post'), 3.6, { dur: 0.75 });
  gsap.set(['#pivot', '#ring'], { svgOrigin: '960 470' });
  M.zoomIn($('#pivot'), 4.1, { dur: 0.6 });
  if (!M.chroma) {
    tl.fromTo('#ring', { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.8 }, 4.2);
  }
  tl.to(rig, { beam: 1, duration: 0.85, ease: 'swift' }, 4.25);
  tl.to(rig, { drop: 1, duration: 0.5, ease: 'power2.out' }, 4.85);

  gsap.set('#cardL', { rotationY: 11, transformPerspective: 1400 });
  gsap.set('#cardR', { rotationY: -11, transformPerspective: 1400 });
  M.popIn($('#cardL'), 5.0, { dur: 0.9 });
  M.popIn($('#cardR'), 5.15, { dur: 0.9 });
  M.counter($('#cL'), { to: 2000, at: 5.4, dur: 1.5 });
  M.counter($('#cR'), { to: 2500, at: 5.55, dur: 1.7 });
  // la balanza se inclina hacia lo que más pesa: el gasto
  tl.to(rig, { ang: 7, duration: 1.9, ease: 'settle' }, 5.7);

  M.popIn($('#badge'), 6.95, { dur: 0.85, rotX: 0 });

  // salida del beat 2
  M.popOut($('#badge'), 8.55);
  M.popOut($('#cardL'), 8.65);
  M.popOut($('#cardR'), 8.72);
  tl.to(rig, { drop: 0, duration: 0.45, ease: 'exit' }, 8.85);
  tl.to(rig, { beam: 0, duration: 0.55, ease: 'exit' }, 9.0);
  M.zoomOut($('#pivot'), 9.3);
  M.undraw($('#post'), 9.3, { dur: 0.5, to: '100% 100%' });
  M.undraw($('#base1'), 9.45, { dur: 0.55 });
  M.undraw($('#base2'), 9.45, { dur: 0.5 });
  if (!M.chroma) {
    tl.to('#floorGlow', { opacity: 0, duration: 0.7 }, 9.4);
    tl.to('#ring', { opacity: 0, scale: 0.4, duration: 0.4 }, 9.25);
  }

  /* ---------------- Beat 3 · conclusión (9.5 – 13 s) ---------------- */
  const k2 = M.textIn($('#kicker2 .txt'), 9.55, { type: 'words', dur: 0.8 });
  M.zoomIn($('#kicker2 .dot'), 9.55);
  const big = M.textIn($('#bigTxt'), 9.7, { dur: 1.1, stagger: 0.05, cls: 'hl' });
  M.popIn($('#res'), 10.55, { dur: 0.9, rotX: 0 });
  tl.fromTo('#res .ico', { y: -14 }, { y: 6, duration: 0.7, ease: 'sine.inOut', repeat: 1, yoyo: true }, 11.1);

  // salida final
  M.popOut($('#res'), 12.0);
  M.textOut(big, 12.08);
  M.textOut(k2, 12.1, { type: 'words' });
  M.zoomOut($('#kicker2 .dot'), 12.1);
  M.textOut(title, 12.15);

  /* ---------------- geometría de la balanza por frame ---------------- */
  const P = { x: 960, y: 470 }, HALF = 500, STR = 84;
  const L = (id) => document.getElementById(id);
  const set = (el, a) => { for (const k in a) el.setAttribute(k, a[k]); };
  M.onFrame(() => {
    const a = rig.ang * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
    const eR = { x: P.x + HALF * c, y: P.y + HALF * s }, eL = { x: P.x - HALF * c, y: P.y - HALF * s };
    const b = rig.beam;
    set(L('beamL'), { x1: P.x, y1: P.y, x2: P.x + (eL.x - P.x) * b, y2: P.y + (eL.y - P.y) * b, opacity: b > 0.001 ? 1 : 0 });
    set(L('beamR'), { x1: P.x, y1: P.y, x2: P.x + (eR.x - P.x) * b, y2: P.y + (eR.y - P.y) * b, opacity: b > 0.001 ? 1 : 0 });
    const cap = Math.max(0, (b - 0.85) / 0.15);
    set(L('capL'), { cx: eL.x, cy: eL.y, r: 9 * cap });
    set(L('capR'), { cx: eR.x, cy: eR.y, r: 9 * cap });
    const d = rig.drop * STR;
    set(L('strL'), { x1: eL.x, y1: eL.y, x2: eL.x, y2: eL.y + d, opacity: rig.drop > 0.001 ? 1 : 0 });
    set(L('strR'), { x1: eR.x, y1: eR.y, x2: eR.x, y2: eR.y + d, opacity: rig.drop > 0.001 ? 1 : 0 });
    L('hangL').style.transform = `translate(${(eL.x - 240).toFixed(2)}px, ${(eL.y + STR).toFixed(2)}px)`;
    L('hangR').style.transform = `translate(${(eR.x - 240).toFixed(2)}px, ${(eR.y + STR).toFixed(2)}px)`;
  });
});
</script>
</body>
</html>
