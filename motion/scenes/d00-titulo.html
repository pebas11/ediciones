<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>D00 · El enjambre que escapó</title>
<link rel="stylesheet" href="../lib/theme.css">
<link rel="stylesheet" href="../lib/fonts-spartan.css">
<style>
  body { background: #05070D; }
  #cv { position: absolute; inset: 0; }
  #grain { position: absolute; inset: -20px; opacity: 0.05; mix-blend-mode: overlay; pointer-events: none; }
  #vig { position: absolute; inset: 0; background: radial-gradient(120% 110% at 50% 48%, transparent 50%, rgba(2,3,6,0.7) 100%); pointer-events: none; }
  #fade { position: absolute; inset: 0; background: #05070D; opacity: 1; }
</style>
</head>
<body>
<div id="world">
  <canvas id="cv" width="1920" height="1080"></canvas>
  <div id="vig"></div>
  <canvas id="grain" width="512" height="512" style="width:1960px;height:1120px"></canvas>
  <div id="fade"></div>
</div>
<script src="../node_modules/gsap/dist/gsap.min.js"></script>
<script src="../node_modules/gsap/dist/SplitText.min.js"></script>
<script src="../node_modules/gsap/dist/DrawSVGPlugin.min.js"></script>
<script src="../node_modules/gsap/dist/CustomEase.min.js"></script>
<script src="../lib/stage.js"></script>
<script src="../lib/audio.js"></script>
<script src="../lib/neon.js"></script>
<script>
/* Plantilla de la serie 7 (neón). Título (14 s):
   1 0–4    enjambre de puntos cian dentro de una caja violeta (el entorno de evaluación)
   2 4–7,5  un punto empuja la pared: se abre una grieta roja y el punto sale
   3 7,5–11 el título entra: EL ENJAMBRE / QUE ESCAPÓ
   4 11–14  rótulo "Hugging Face · julio de 2026" y fundido */
M.scene({ duration: 14, push: 0, audio: { key: 'D', mode: 'minor', gain: 3, bed: { cycle: 8, bright: 0.7, sub: 0.25 } } }, async (tl, M) => {
  const $ = (s) => document.querySelector(s);
  const cv = $('#cv'), ctx = cv.getContext('2d');
  { const g = $('#grain').getContext('2d'); const im = g.createImageData(512, 512); const rn = M.rng(5);
    for (let i = 0; i < im.data.length; i += 4) { const v = 128 + (rn() - 0.5) * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
    g.putImageData(im, 0, 0); }
  const F_T = '800 150px "League Spartan"', F_S = '500 30px "DM Mono"';
  await Promise.all([document.fonts.load(F_T, 'EL ENJAMBRE QUE ESCAPÓ'), document.fonts.load(F_S, 'HUGGING FACE · JULIO DE 2026')]);

  const { PAL, rgba, bloom, bg, text } = Neon;
  const TAU = Math.PI * 2;
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, m) => a + (b - a) * m;
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const eA = gsap.parseEase('apple'), eO = gsap.parseEase('appleOut'), eI = gsap.parseEase('appleIn');

  const BOX = { x: 560, y: 300, w: 800, h: 480 };
  const r = M.rng(11), P = [];
  for (let i = 0; i < 90; i++) P.push({ x: BOX.x + 30 + r() * (BOX.w - 60), y: BOX.y + 30 + r() * (BOX.h - 60), ph: r() * TAU, sp: 0.4 + r() * 0.9, s: 2 + r() * 2.4 });
  const HERO = { x: BOX.x + BOX.w - 80, y: BOX.y + 150 };
  const BREACH = 4.2, OUT = 5.4;

  M.sfx(BREACH, 'impact', { weight: 0.8, gain: -3 });
  M.sfx(BREACH - 1.2, 'riser', { dur: 1.2, semis: 7 });
  M.sfx(7.6, 'swell', { dur: 1.2 });
  M.sfx(9.0, 'shimmer', { gain: -6 });
  [[0.3, 4], [4, 5.5], [7.4, 9.5], [11, 12.5]].forEach(([a, b]) => tl.to({ v: 0 }, { v: 1, duration: b - a, ease: 'none' }, a));
  tl.fromTo('#fade', { opacity: 1 }, { opacity: 0, duration: 0.5, ease: 'appleOut' }, 0);
  tl.to('#fade', { opacity: 1, duration: 0.33, ease: 'appleIn' }, 13.6);

  M.onFrame((t) => {
    bg(ctx, t, { grid: 0.045 * eO(seg(t, 0.2, 1.2)) });
    const boxA = eO(seg(t, 0.3, 1.3));
    // caja del entorno (violeta). La pared derecha se rompe en BREACH.
    const crack = eO(seg(t, BREACH, BREACH + 0.5));
    ctx.lineWidth = 3; ctx.strokeStyle = rgba(PAL.VIOLET, 0.9 * boxA); ctx.beginPath();
    ctx.moveTo(BOX.x, BOX.y); ctx.lineTo(BOX.x + BOX.w, BOX.y);
    ctx.moveTo(BOX.x + BOX.w, BOX.y + BOX.h); ctx.lineTo(BOX.x, BOX.y + BOX.h); ctx.lineTo(BOX.x, BOX.y);
    ctx.moveTo(BOX.x + BOX.w, BOX.y); ctx.lineTo(BOX.x + BOX.w, HERO.y - 30 * (0.3 + crack));
    ctx.moveTo(BOX.x + BOX.w, BOX.y + BOX.h); ctx.lineTo(BOX.x + BOX.w, HERO.y + 30 * (0.3 + crack)); ctx.stroke();
    // grieta roja
    if (crack > 0) { ctx.strokeStyle = rgba(PAL.RED, 0.95 * (1 - 0.5 * seg(t, BREACH + 0.6, BREACH + 2))); ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(BOX.x + BOX.w, HERO.y - 30 * (0.3 + crack)); ctx.lineTo(BOX.x + BOX.w + 36 * crack, HERO.y - 62 * crack);
      ctx.moveTo(BOX.x + BOX.w, HERO.y + 30 * (0.3 + crack)); ctx.lineTo(BOX.x + BOX.w + 36 * crack, HERO.y + 62 * crack); ctx.stroke(); }
    // enjambre dentro
    const swA = eO(seg(t, 0.5, 1.6)) * (1 - 0.85 * eA(seg(t, 7.2, 8.4)));
    for (const p of P) {
      const x = p.x + Math.sin(t * p.sp + p.ph) * 14, y = p.y + Math.cos(t * p.sp * 1.3 + p.ph) * 12;
      ctx.fillStyle = rgba(PAL.CYAN, 0.8 * swA); ctx.beginPath(); ctx.arc(x, y, p.s, 0, TAU); ctx.fill();
    }
    // el punto que empuja y sale
    const push = eA(seg(t, 2.6, BREACH)), out = eA(seg(t, BREACH, OUT + 2.4));
    const hx = lerp(HERO.x - 160, HERO.x, push) + out * 640, hy = HERO.y - Math.sin(out * Math.PI) * 60;
    if (t > 1.5) { ctx.fillStyle = rgba(PAL.INK, 1); ctx.beginPath(); ctx.arc(hx, hy, 7, 0, TAU); ctx.fill();
      ctx.strokeStyle = rgba(PAL.CYAN, 0.9); ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(hx, hy, 14 + 4 * Math.sin(t * 5), 0, TAU); ctx.stroke(); }
    // título
    const tw = eO(seg(t, 7.6, 8.8)), tw2 = eO(seg(t, 8.0, 9.2));
    text(ctx, 'EL ENJAMBRE', 960, 500 - 20 * (1 - tw), F_T, PAL.INK, tw, { align: 'center', glow: 8 });
    text(ctx, 'QUE ESCAPÓ', 960, 660 - 20 * (1 - tw2), F_T, PAL.CYAN, tw2, { align: 'center', glow: 10 });
    text(ctx, 'HUGGING FACE · JULIO DE 2026', 960, 770, F_S, PAL.GREEN, eO(seg(t, 10.8, 11.8)) * 0.9, { align: 'center', spacing: '8px', glow: 14 });
    bloom(ctx, cv, { k: 0.7 });
  });
});
</script>
</body>
</html>
