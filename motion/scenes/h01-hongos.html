<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>H01 · Hongos mágicos (3D)</title>
<link rel="stylesheet" href="../lib/theme.css">
<link rel="stylesheet" href="../lib/fonts-spartan.css">
<script type="importmap">{ "imports": { "three": "../node_modules/three/build/three.module.js", "three/addons/": "../node_modules/three/examples/jsm/" } }</script>
<style>
  /* Guion de color: cálido terroso (hongo, tierra) vs. UN acento frío (azul psilocibina: contraluz, azulado, micelio). */
  :root { --bone: #F3EDE2; --caramel: #E3A560; --blue: #8FB0FF; --dim: rgba(243,237,226,0.66); }
  body { background: #060504; }
  #gl { position: absolute; inset: 0; }
  #grain { position: absolute; inset: -20px; opacity: 0.06; mix-blend-mode: overlay; pointer-events: none; }
  #vig { position: absolute; inset: 0; background: radial-gradient(115% 100% at 62% 42%, transparent 50%, rgba(4,3,2,0.6) 100%); }
  .t { position: absolute; left: 140px; font-family: var(--f-display); color: var(--bone); letter-spacing: -0.035em; line-height: 1.16; white-space: nowrap; }
  #title { top: 560px; font-size: 196px; }
  #title .a { font-weight: 800; display: block; }
  #title .b { font-weight: 300; display: block; margin-top: -34px; color: var(--caramel); }
  #l1 { top: 110px; width: 760px; white-space: normal; line-height: 1.2; font-size: 112px; font-weight: 700; }
  #l2 { top: 110px; width: 800px; white-space: normal; line-height: 1.2; font-size: 112px; font-weight: 700; }
  #l2 em { font-style: normal; color: var(--blue); }
  #num { top: 250px; font-size: 330px; font-weight: 900; letter-spacing: -0.055em; line-height: 1.05; }
  #num .p { color: var(--blue); font-weight: 600; }
  #numL { top: 640px; line-height: 1.3; font-family: var(--f-body); font-size: 46px; font-weight: 500; letter-spacing: -0.01em; color: var(--dim); }
  #fade { position: absolute; inset: 0; background: #060504; opacity: 0; }
</style>
</head>
<body>
<div id="world">
  <div id="gl"></div>
  <div id="vig"></div>

  <div class="t" id="title"><span class="a">Hongos</span><span class="b">mágicos</span></div>
  <div class="t" id="l1">Esto es solo<br>el fruto.</div>
  <div class="t" id="l2">El organismo<br>vive <em>abajo</em>.</div>
  <div class="t" id="num"><span class="p">+</span><span id="numV">0</span></div>
  <div class="t" id="numL">especies alucinógenas de <i>Psilocybe</i></div>

  <canvas id="grain" width="512" height="512" style="width:1960px;height:1120px"></canvas>
  <div id="fade"></div>
</div>

<script src="../node_modules/gsap/dist/gsap.min.js"></script>
<script src="../node_modules/gsap/dist/SplitText.min.js"></script>
<script src="../node_modules/gsap/dist/DrawSVGPlugin.min.js"></script>
<script src="../node_modules/gsap/dist/CustomEase.min.js"></script>
<script src="../lib/stage.js"></script>
<script src="../lib/audio.js"></script>
<script type="module">
import { createStage3D, THREE, fbm } from '../lib/three-stage.mjs';
import { buildMushroom, buildGrass } from '../lib/mushroom3d.mjs';

// Dato verificado (FICHA-HONGOS.md): "Más de 140 especies de Psilocybe son alucinógenas" — Guzmán 2005.
const STAT = 140;

M.scene({ duration: 14, push: 0, audio: { key: 'D', mode: 'lydian', bed: { cycle: 9, bright: 0.9 } } }, async (tl, M) => {
  const $ = (s) => document.querySelector(s);
  const r = M.rng(21);

  { const g = $('#grain').getContext('2d'); const im = g.createImageData(512, 512); const rn = M.rng(3);
    for (let i = 0; i < im.data.length; i += 4) { const v = 128 + (rn() - 0.5) * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
    g.putImageData(im, 0, 0); }

  /* ---------------- escena 3D ---------------- */
  const S = createStage3D($('#gl'), { bgTop: '#130f0c', bgBottom: '#050403', bgGlow: '#2c2017', bloom: { strength: 0.25, radius: 0.45, threshold: 0.94 }, exposure: 1.0, env: 0.2 });
  const { scene, camera, renderer } = S;
  renderer.localClippingEnabled = true;
  scene.fog = new THREE.FogExp2('#090706', 0.035);

  // grupo de tres, como crecen: uno maduro, uno intermedio, uno joven
  const m1 = buildMushroom({ seed: 1, age: 0.85 });
  const m2 = buildMushroom({ seed: 2, stemH: 1.3, capScale: 0.8, age: 0.45 });
  const m3 = buildMushroom({ seed: 3, stemH: 0.78, capScale: 0.62, age: 0.0 });
  m1.group.position.set(0.15, 0, 0.75);
  m2.group.position.set(0.95, 0, 0.05); m2.group.rotation.set(0, 1.9, 0.1);
  m3.group.position.set(-0.62, 0, 1.15); m3.group.rotation.set(0, -0.8, -0.14);
  const shrooms = [m1, m2, m3];
  shrooms.forEach((m) => scene.add(m.group));

  // luces: clave cálida lateral, contraluz FRÍO (separa la silueta del fondo), relleno neutro bajo
  const key = new THREE.DirectionalLight('#ffdcae', 2.1); key.position.set(-4, 4.5, 4); key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 5;
  Object.assign(key.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5 }); key.shadow.camera.updateProjectionMatrix(); scene.add(key);
  const rim = new THREE.DirectionalLight('#7fa2ff', 1.5); rim.position.set(3.5, 3, -4); scene.add(rim);
  scene.add(new THREE.HemisphereLight('#3a3440', '#140d08', 0.4));
  const under = new THREE.PointLight('#8fb0ff', 0, 5, 1.8); under.position.set(0.2, -1.0, 3.0); scene.add(under);

  /* ---------------- bloque de tierra (diorama en corte) ---------------- */
  const BW = 7.2, BD = 3.6, BH = 2.3, FZ = BD / 2;      // ancho, profundidad, alto; cara frontal en z = FZ
  const soil = new THREE.Group(); scene.add(soil);
  // superficie superior con relieve (bordes a nivel 0 para que cierre con las caras)
  const top = new THREE.PlaneGeometry(BW, BD, 220, 110); top.rotateX(-Math.PI / 2);
  { const p = top.attributes.position, col = new Float32Array(p.count * 3), a = new THREE.Color('#24170f'), b = new THREE.Color('#40291a'), c2 = new THREE.Color('#110c10'), moss = new THREE.Color('#2f3a1c');
    for (let i = 0; i < p.count; i++) { const x = p.getX(i), z = p.getZ(i);
      const edge = Math.min(1, Math.min(BW / 2 - Math.abs(x), BD / 2 - Math.abs(z)) / 0.18);
      const n = fbm(x * 1.4, 0.5, z * 1.4), n2 = fbm(x * 7, 2.5, z * 7);
      p.setY(i, (0.045 * n + 0.012 * n2) * edge);
      const c = a.clone().lerp(b, 0.5 + 0.5 * n2).lerp(c2, Math.max(0, n) * 0.8);
      if (fbm(x * 2.2, 9, z * 2.2) > 0.25) c.lerp(moss, 0.45);
      col.set([c.r, c.g, c.b], i * 3); }
    top.setAttribute('color', new THREE.BufferAttribute(col, 3)); top.computeVertexNormals(); }
  const topM = new THREE.Mesh(top, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.96 }));
  topM.receiveShadow = true; soil.add(topM);
  // caras del corte con estratos
  const strataFace = (w, h, seed) => {
    const g = new THREE.PlaneGeometry(w, h, Math.round(w * 40), Math.round(h * 40));
    const p = g.attributes.position, col = new Float32Array(p.count * 3);
    const bands = ['#3b2616', '#2a1b12', '#4a2f1c', '#22160f', '#35241a', '#1a120e'].map((h2) => new THREE.Color(h2));
    for (let i = 0; i < p.count; i++) { const x = p.getX(i), y = p.getY(i);
      const yy = (h / 2 - y) + 0.08 * fbm(x * 0.9 + seed, 3.3, 1);
      const k = Math.max(0, Math.min(5, Math.floor(Math.pow(Math.max(0, yy) / h, 0.8) * 6)));
      const c = bands[k].clone().lerp(bands[Math.min(5, k + 1)], 0.5 + 0.5 * fbm(x * 3, y * 3, seed)).multiplyScalar(0.75 + 0.5 * (0.5 + 0.5 * fbm(x * 9, y * 9, seed + 2)));
      col.set([c.r, c.g, c.b], i * 3); p.setZ(i, 0.01 * fbm(x * 12, y * 12, seed)); }
    g.setAttribute('color', new THREE.BufferAttribute(col, 3)); g.computeVertexNormals(); return g; };
  const faceMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1 });
  const front = new THREE.Mesh(strataFace(BW, BH, 1), faceMat); front.position.set(0, -BH / 2, FZ); soil.add(front);
  const left = new THREE.Mesh(strataFace(BD, BH, 5), faceMat); left.rotation.y = -Math.PI / 2; left.position.set(-BW / 2, -BH / 2, 0); soil.add(left);
  const right = new THREE.Mesh(strataFace(BD, BH, 9), faceMat); right.rotation.y = Math.PI / 2; right.position.set(BW / 2, -BH / 2, 0); soil.add(right);
  // piedritas incrustadas en el corte
  const pebGeo = new THREE.IcosahedronGeometry(1, 1);
  const inset = new THREE.InstancedMesh(pebGeo, new THREE.MeshStandardMaterial({ color: '#4f3f35', roughness: 0.9, flatShading: true }), 160);
  { const mm = new THREE.Matrix4(), q = new THREE.Quaternion();
    for (let i = 0; i < 160; i++) { const s = 0.012 + Math.pow(r(), 3) * 0.07; q.setFromEuler(new THREE.Euler(r() * 3, r() * 3, r() * 3));
      mm.compose(new THREE.Vector3((r() - 0.5) * (BW - 0.2), -0.08 - r() * (BH - 0.15), FZ - s * 0.4), q, new THREE.Vector3(s, s * 0.7, s * 0.6)); inset.setMatrixAt(i, mm); } }
  soil.add(inset);
  // pasto (como en las fotos de referencia: crecen en pastizales)
  soil.add(buildGrass({ count: 1500, w: BW, d: BD, avoid: [[0.15, 0.75, 0.32], [0.95, 0.05, 0.28], [-0.62, 1.15, 0.26]] }));
  // piedritas en la superficie
  const peb = new THREE.InstancedMesh(pebGeo, new THREE.MeshStandardMaterial({ color: '#46382f', roughness: 0.9, flatShading: true }), 70);
  { const mm = new THREE.Matrix4(), q = new THREE.Quaternion();
    for (let i = 0; i < 70; i++) { const s = 0.015 + r() * 0.045; q.setFromEuler(new THREE.Euler(r() * 3, r() * 3, r() * 3));
      mm.compose(new THREE.Vector3((r() - 0.5) * (BW - 0.4), s * 0.2, (r() - 0.5) * (BD - 0.4)), q, new THREE.Vector3(s, s * 0.6, s * 0.9)); peb.setMatrixAt(i, mm); } }
  peb.castShadow = true; peb.receiveShadow = true; soil.add(peb);
  // aristas del bloque: líneas finas estilo lámina técnica
  const edgeGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(BW, BH, BD)); edgeGeo.translate(0, -BH / 2, 0);
  const edges = new THREE.LineSegments(edgeGeo, new THREE.LineBasicMaterial({ color: '#f3ede2', transparent: true, opacity: 0.28 })); soil.add(edges);
  // sombra de contacto suave debajo del bloque
  const shadowC = document.createElement('canvas'); shadowC.width = shadowC.height = 128; { const g2 = shadowC.getContext('2d'); const gr = g2.createRadialGradient(64, 64, 4, 64, 64, 64); gr.addColorStop(0, 'rgba(0,0,0,0.75)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g2.fillStyle = gr; g2.fillRect(0, 0, 128, 128); }
  const floorSh = new THREE.Mesh(new THREE.PlaneGeometry(BW * 1.6, BD * 1.9), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(shadowC), transparent: true, depthWrite: false }));
  floorSh.rotation.x = -Math.PI / 2; floorSh.position.y = -BH - 0.25; soil.add(floorSh);

  /* ---------------- micelio: red fina sobre la cara del corte ---------------- */
  const hyphae = [];
  const cols = ['#e9f0ff', '#cfdcff', '#b3c8ff', '#98b3ff', '#86a3f5', '#7a93e0'];
  function branch(p0, dir, len, depth, t0) {
    if (depth > 5 || len < 0.07) return;
    const pts = [p0.clone()]; let p = p0.clone(); const d = dir.clone();
    const steps = 7;
    for (let i = 0; i < steps; i++) {
      d.x += (r() - 0.5) * 0.55; d.y += (r() - 0.58) * 0.4; d.normalize();
      p = p.clone().addScaledVector(d, len / steps);
      p.z = FZ + 0.008 + 0.006 * r();
      if (p.y > -0.035) { p.y = -0.035; d.y = -Math.abs(d.y); }
      if (p.y < -BH + 0.1 || p.x < -1.5 || p.x > BW / 2 - 0.1) { if (pts.length < 3) return; break; }   // corta la rama en el borde
      pts.push(p);
    }
    const curve = new THREE.CatmullRomCurve3(pts);
    const rad = Math.max(0.0035, 0.013 - depth * 0.0017);
    const early = pts.length < steps + 1;
    const geo = new THREE.TubeGeometry(curve, 28, rad, 5, false);
    const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: new THREE.Color(cols[Math.min(depth, cols.length - 1)]).multiplyScalar(0.8) }));
    geo.setDrawRange(0, 0); soil.add(mesh);
    const dur = 0.4 + len * 0.6;
    const h = { mesh, geo, total: geo.index.count, curve, t0, dur, depth, prog: { v: 0 } };
    hyphae.push(h);
    tl.to(h.prog, { v: 1, duration: dur, ease: 'appleOut' }, t0);
    const kids = early ? 0 : depth < 1 ? 3 : r() < 0.62 ? 2 : 1;
    for (let k = 0; k < kids; k++) {
      const nd = new THREE.Vector3(d.x + (r() - 0.5) * 1.8, d.y + (r() - 0.4) * 0.9, 0).normalize();
      branch(p, nd, len * (0.6 + r() * 0.16), depth + 1, t0 + dur * 0.72);
    }
  }
  const T_M = 6.0;
  shrooms.forEach((m, i) => {
    const bx = m.group.position.x;
    [[-1, -0.7], [1, -0.6], [0.15, -1], [-0.3, -1]].forEach(([dx, dy], k) => branch(new THREE.Vector3(bx + (k - 1.5) * 0.03, -0.04, FZ + 0.01), new THREE.Vector3(dx, dy, 0).normalize(), 0.75 + r() * 0.35 - i * 0.1, 0, T_M + i * 0.22 + k * 0.07));
  });
  const tipGeo = new THREE.SphereGeometry(1, 10, 8);
  hyphae.filter((h, i) => h.depth >= 4 && i % 2 === 0).forEach((h) => {
    const s = new THREE.Mesh(tipGeo, new THREE.MeshBasicMaterial({ color: '#f2f6ff' }));
    s.position.copy(h.curve.getPointAt(1)); s.scale.setScalar(0.0001); soil.add(s);
    tl.to(s.scale, { x: 0.011, y: 0.011, z: 0.011, duration: 0.4, ease: M.spring(0.12) }, h.t0 + h.dur);
  });
  const pulses = hyphae.filter((h) => h.depth <= 1).map((h, i) => {
    const s = new THREE.Mesh(tipGeo, new THREE.MeshBasicMaterial({ color: '#ffffff' })); s.scale.setScalar(0.0001); soil.add(s);
    const pr = { u: 0, on: 0 }; const st = 9.9 + h.depth * 0.45 + (i % 6) * 0.13;
    tl.set(pr, { on: 1 }, st); tl.to(pr, { u: 1, duration: 0.6 + h.dur * 0.4, ease: 'none' }, st); tl.set(pr, { on: 0 }, st + 0.6 + h.dur * 0.4);
    return { s, h, pr };
  });

  /* ---------------- escaneo inicial (wireframe → sólido) ---------------- */
  const scan = { y: -0.2 };
  const planeSolid = new THREE.Plane(new THREE.Vector3(0, -1, 0), scan.y);   // conserva y < scan
  const planeWire = new THREE.Plane(new THREE.Vector3(0, 1, 0), -scan.y);    // conserva y > scan
  shrooms.forEach((m) => { m.solids.forEach((s) => (s.material.clippingPlanes = [planeSolid])); m.wireMat.clippingPlanes = [planeWire]; });
  const ringGeo = new THREE.RingGeometry(1.25, 1.265, 128); ringGeo.rotateX(-Math.PI / 2);
  const scanRing = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: '#9db8ff', transparent: true, opacity: 0.9, side: THREE.DoubleSide }));
  scene.add(scanRing);
  tl.to(scan, { y: 3.0, duration: 2.1, ease: 'apple' }, 0.35);

  /* ---------------- cámara ---------------- */
  const cam = { ang: -0.42, rad: 7.0, y: 0.95, lx: 0.3, ly: 1.5, lz: 0.6, shift: -420 };
  tl.to(cam, { ang: -0.2, rad: 6.7, duration: 4.6, ease: 'apple' }, 0);
  // beat 2: se aleja y muestra el suelo en corte
  tl.to(cam, { ang: -0.08, rad: 11.4, y: 1.2, lx: 0.9, ly: -0.25, lz: 0.6, shift: -420, duration: 1.9, ease: 'apple' }, 4.3);
  // beat 3: deja lugar al número
  tl.to(cam, { ang: 0.1, rad: 11.0, y: 1.5, lx: 0.9, ly: 0.05, shift: -640, duration: 1.6, ease: 'apple' }, 9.3);
  tl.to(cam, { ang: 0.22, duration: 3.7, ease: 'none' }, 10.9);
  tl.to(under, { intensity: 2.0, duration: 2.5, ease: 'appleOut' }, 6.2);

  /* ---------------- texto (skill motion-copy: 14 palabras en toda la escena) ---------------- */
  const tA = M.textIn($('#title .a'), 0.9, { dur: 1.0, stagger: 0.04, ease: 'appleOut' });
  const tB = M.textIn($('#title .b'), 1.25, { dur: 1.0, stagger: 0.04, ease: 'appleOut' });
  M.textOut(tA, 3.95, { stagger: 0.015 }); M.textOut(tB, 4.0, { stagger: 0.015 });

  const l1 = M.textIn($('#l1'), 6.0, { type: 'words', dur: 0.8, stagger: 0.06, ease: 'appleOut' });
  M.textOut(l1, 7.55, { type: 'words', stagger: 0.02 });
  const l2 = M.textIn($('#l2'), 7.85, { type: 'words', dur: 0.8, stagger: 0.06, ease: 'appleOut' });
  M.textOut(l2, 9.15, { type: 'words', stagger: 0.02 });

  tl.from('#num', { yPercent: 18, opacity: 0, duration: 0.9, ease: 'appleOut' }, 10.0);
  M.counter($('#numV'), { from: 0, to: STAT, at: 10.05, dur: 1.5, ease: 'expo.out' });
  const nl = M.textIn($('#numL'), 10.6, { type: 'words', dur: 0.7, stagger: 0.05, ease: 'appleOut' });
  tl.to(['#num', '#numL'], { opacity: 0, y: -14, duration: 0.5, ease: 'appleIn' }, 13.0);
  tl.to('#fade', { opacity: 1, duration: 0.55, ease: 'appleIn' }, 13.3);

  /* ---------------- sonido (docs/AUDIO.md): pocos efectos, cada uno con motivo ---------------- */
  M.sfx(0.35, 'scan', { dur: 2.1, from: 300, to: 2600, dir: 1, gain: -2 });
  M.sfx(0.92, 'tick').sfx(1.27, 'tap', { deg: 4, oct: 5, bright: 0.7, gain: -3 });
  M.sfx(4.3, 'whoosh', { dur: 1.9, peak: 0.45, dir: 1, gain: -1 });
  M.sfx(6.0, 'grow', { dur: 3.2, density: 90 }).sfx(6.02, 'tick');
  M.sfx(7.87, 'tick', { tone: 'glass', gain: -2 });
  M.sfx(9.3, 'whoosh', { dur: 1.0, peak: 0.35, dir: -1, gain: -5 });
  M.sfx(10.05, 'swell', { dur: 1.0 }).sfx(10.05, 'impact', { weight: 0.8 });
  M.sfx(10.6, 'shimmer', { degs: [2, 4, 7], gain: -3 });

  /* ---------------- por cuadro ---------------- */
  M.onFrame(() => {
    planeSolid.constant = scan.y; planeWire.constant = -scan.y;
    scanRing.visible = scan.y > -0.1 && scan.y < 2.95; scanRing.position.y = scan.y;
    shrooms.forEach((m) => m.wires.forEach((w) => (w.visible = scan.y < 2.95)));
    hyphae.forEach((h) => h.geo.setDrawRange(0, Math.floor(h.total * h.prog.v / 3) * 3));
    pulses.forEach(({ s, h, pr }) => { if (pr.on && pr.u > 0 && pr.u < 1) { s.position.copy(h.curve.getPointAt(pr.u)); s.scale.setScalar(0.028); } else s.scale.setScalar(0.0001); });
    camera.position.set(Math.sin(cam.ang) * cam.rad, cam.y, Math.cos(cam.ang) * cam.rad);
    camera.lookAt(cam.lx, cam.ly, cam.lz);
    camera.setViewOffset(1920, 1080, cam.shift, 0, 1920, 1080);
    S.render();
  });
});
</script>
</body>
</html>
