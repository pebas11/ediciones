<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>H05 · Ciencia (3D)</title>
<link rel="stylesheet" href="../lib/theme.css">
<link rel="stylesheet" href="../lib/fonts-spartan.css">
<script type="importmap">{ "imports": { "three": "../node_modules/three/build/three.module.js", "three/addons/": "../node_modules/three/examples/jsm/" } }</script>
<style>
  /* Guion de color (v3): base cálida terrosa; el azul psilocibina SOLO para lo activo:
     la señal que recorre la línea de tiempo y enciende cada hito, y la cifra clave (%). */
  :root { --bone: #F3EDE2; --caramel: #E3A560; --blue: #8FB0FF; --dim: rgba(243,237,226,0.66); }
  body { background: #060504; }
  #gl { position: absolute; inset: 0; }
  #grain { position: absolute; inset: -20px; opacity: 0.06; mix-blend-mode: overlay; pointer-events: none; }
  #vig { position: absolute; inset: 0; background: radial-gradient(115% 100% at 62% 42%, transparent 50%, rgba(4,3,2,0.6) 100%); }
  .t { position: absolute; left: 140px; font-family: var(--f-display); color: var(--bone); letter-spacing: -0.035em; line-height: 1.2; white-space: nowrap; }
  #num { top: 250px; font-size: 320px; font-weight: 900; letter-spacing: -0.055em; line-height: 1.05; }
  #num .p { color: var(--blue); font-weight: 600; margin-left: 0.12em; }
  #numL { top: 612px; line-height: 1.3; font-family: var(--f-body); font-size: 50px; font-weight: 500; letter-spacing: -0.01em; color: var(--dim); }
  #c1 { top: 300px; font-size: 116px; line-height: 1.2; }
  #c1 .a { display: block; font-weight: 800; }
  #c1 .b { display: block; font-weight: 300; margin-top: -8px; color: var(--blue); }
  #c2 { top: 640px; line-height: 1.3; font-family: var(--f-body); font-size: 52px; font-weight: 500; letter-spacing: -0.01em; color: var(--dim); }
  #fade { position: absolute; inset: 0; background: #060504; opacity: 1; }
</style>
</head>
<body>
<div id="world">
  <div id="gl"></div>
  <div id="vig"></div>

  <!-- beat 1: los años y su palabra van impresos en los planos 3D (ver hitos) -->
  <div class="t" id="num"><span id="numV">0</span><span class="p">%</span></div>
  <div class="t" id="numL">de respuesta en depresión</div>
  <div class="t" id="c1"><span class="a">Investigación clínica</span><span class="b">controlada.</span></div>
  <div class="t" id="c2">No es una recomendación.</div>

  <canvas id="grain" width="512" height="512" style="width:1960px;height:1120px"></canvas>
  <div id="fade"></div>
</div>

<script src="../node_modules/gsap/dist/gsap.min.js"></script>
<script src="../node_modules/gsap/dist/SplitText.min.js"></script>
<script src="../node_modules/gsap/dist/DrawSVGPlugin.min.js"></script>
<script src="../node_modules/gsap/dist/CustomEase.min.js"></script>
<script src="../lib/stage.js"></script>
<script type="module">
import { createStage3D, THREE, fbm } from '../lib/three-stage.mjs';
import { buildMushroom, buildGrass } from '../lib/mushroom3d.mjs';

/* Datos (FICHA-HONGOS.md, única fuente):
   1958 — Hofmann aísla la psilocibina (Hofmann et al. 1958, PMID 13537892).
   2018 — FDA: designación de "terapia innovadora" (comunicado de Compass, 5-ago-2026).
   2023 — Australia, desde julio de 2023: psiquiatras autorizados, depresión resistente (TGA).
   71 % — respuesta en depresión mayor, 24 pacientes, 4 semanas (Davis 2021, PMID 33146667).
   Cierre responsable: encuadre de la ficha ("investigación en entornos clínicos controlados… no es una recomendación"). */
const MILESTONES = [
  { year: 1958, word: ['Aislada'] },
  { year: 2018, word: ['Terapia', 'innovadora'] },
  { year: 2023, word: ['Australia'] },
];
const RESPONSE = 71;

M.scene({ duration: 15.0, push: 0 }, async (tl, M) => {
  const $ = (s) => document.querySelector(s);
  const r = M.rng(55);

  { const g = $('#grain').getContext('2d'); const im = g.createImageData(512, 512); const rn = M.rng(3);
    for (let i = 0; i < im.data.length; i += 4) { const v = 128 + (rn() - 0.5) * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
    g.putImageData(im, 0, 0); }

  await Promise.all([document.fonts.load('800 200px "League Spartan"'), document.fonts.load('300 200px "League Spartan"')]);

  /* ---------------- escena 3D (misma luz y atmósfera que h01) ---------------- */
  const S = createStage3D($('#gl'), { bgTop: '#130f0c', bgBottom: '#050403', bgGlow: '#2c2017', bloom: { strength: 0.25, radius: 0.45, threshold: 0.94 }, exposure: 1.0, env: 0.2 });
  const { scene, camera, renderer } = S;
  scene.fog = new THREE.FogExp2('#090706', 0.035);
  const maxAniso = renderer.capabilities.getMaxAnisotropy();

  // escala de la línea de tiempo: distancia proporcional a los años (60 años de hueco se sienten)
  const K = 0.5;                                  // unidades por año
  const X = (y) => (y - 1958) * K;
  const RAIL_Z = 0.5, PLATE_Z = -0.5;
  const MX = 39.2, MZ = -1.0;                     // grupo de hongos: "hoy", al final de la línea
  const RAIL_X0 = -14, RAIL_X1 = MX - 1.75;

  // suelo plano, cálido y oscuro (secundario: valor bajo, poco saturado)
  {
    const g = new THREE.PlaneGeometry(150, 44, 300, 88); g.rotateX(-Math.PI / 2); g.translate(18, 0, -8);
    const p = g.attributes.position, col = new Float32Array(p.count * 3);
    const a = new THREE.Color('#110c08'), b = new THREE.Color('#1c140e'), c2 = new THREE.Color('#080605');
    for (let i = 0; i < p.count; i++) { const x = p.getX(i), z = p.getZ(i);
      const n = fbm(x * 0.9, 1.7, z * 0.9), n2 = fbm(x * 5, 3.1, z * 5), n3 = fbm(x * 0.25, 7.3, z * 0.25);
      const c = a.clone().lerp(b, 0.5 + 0.5 * n2).lerp(c2, Math.min(1, Math.max(0, n) * 0.9 + Math.max(0, n3) * 0.8));
      col.set([c.r, c.g, c.b], i * 3); }
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    const gm = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.97 });
    // el suelo es secundario y cálido: la luz que recibe (incluido el contraluz azul) se re-tiñe a tierra
    gm.onBeforeCompile = (sh) => { sh.fragmentShader = sh.fragmentShader.replace('#include <opaque_fragment>',
      'outgoingLight = dot(outgoingLight, vec3(0.299, 0.587, 0.114)) * vec3(1.3, 0.97, 0.7);\n#include <opaque_fragment>'); };
    const ground = new THREE.Mesh(g, gm);
    ground.receiveShadow = true; scene.add(ground);
  }

  // piedritas apoyadas (medio enterradas) para dar escala y textura
  {
    const pebGeo = new THREE.IcosahedronGeometry(1, 1);
    const peb = new THREE.InstancedMesh(pebGeo, new THREE.MeshStandardMaterial({ color: '#3f322a', roughness: 0.92, flatShading: true }), 260);
    const mm = new THREE.Matrix4(), q = new THREE.Quaternion(); let n = 0;
    while (n < 260) {
      const x = RAIL_X0 + r() * (MX + 6 - RAIL_X0), z = -4 + r() * 9, s = 0.015 + Math.pow(r(), 2.5) * 0.06;
      if (Math.abs(z - RAIL_Z) < 0.2) continue;                                            // no sobre el riel
      if (MILESTONES.some((m) => Math.abs(x - X(m.year)) < 1.5 && z > PLATE_Z - 0.45 && z < RAIL_Z + 0.1)) continue; // ni en las bases
      if (Math.hypot(x - MX, z - MZ) < 2.2) continue;                                      // ni entre los hongos
      q.setFromEuler(new THREE.Euler(r() * 3, r() * 3, r() * 3));
      mm.compose(new THREE.Vector3(x, s * 0.25, z), q, new THREE.Vector3(s, s * 0.6, s * 0.85)); peb.setMatrixAt(n++, mm);
    }
    peb.castShadow = true; peb.receiveShadow = true; scene.add(peb);
  }

  /* ---------------- línea de tiempo: riel + marcas por década + señal azul ---------------- */
  const bronze = new THREE.MeshStandardMaterial({ color: '#4a3726', metalness: 0.3, roughness: 0.6 });
  const RAIL_H = 0.05, RAIL_D = 0.09;
  const rail = new THREE.Mesh(new THREE.BoxGeometry(RAIL_X1 - RAIL_X0, RAIL_H, RAIL_D), bronze);
  rail.position.set((RAIL_X0 + RAIL_X1) / 2, RAIL_H / 2, RAIL_Z); rail.castShadow = true; rail.receiveShadow = true; scene.add(rail);
  const cap = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.075, 0.16), bronze);         // tope del riel
  cap.position.set(RAIL_X1, 0.0375, RAIL_Z); cap.castShadow = true; scene.add(cap);
  // marcas por década (1960…2020), delante del riel, al ras del suelo
  const tickMat = new THREE.MeshStandardMaterial({ color: '#6a5847', roughness: 0.7, metalness: 0.2 });
  for (let y = 1960; y <= 2020; y += 10) {
    const t = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.014, 0.34), tickMat);
    t.position.set(X(y), 0.007, RAIL_Z + RAIL_D / 2 + 0.17 - 0.01); t.receiveShadow = true; scene.add(t);
  }
  // señal: filete azul encastrado en la cara superior del riel (crece con la cabeza)
  const sigMat = new THREE.MeshBasicMaterial({ color: new THREE.Color('#7fa2ff').multiplyScalar(1.5) });
  const sigGeo = new THREE.BoxGeometry(1, 0.012, 0.032); sigGeo.translate(0.5, 0, 0);
  const sig = new THREE.Mesh(sigGeo, sigMat); sig.position.set(RAIL_X0, RAIL_H + 0.002, RAIL_Z); scene.add(sig);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.03, 16, 12), new THREE.MeshBasicMaterial({ color: new THREE.Color('#dfe8ff').multiplyScalar(2.2) }));
  head.position.set(0, RAIL_H + 0.012, RAIL_Z); scene.add(head);
  const signal = { x: -6 };

  /* ---------------- hitos: base + plano fino encastrado + brazo al riel ---------------- */
  const PW = 2.3, PH = 2.6, PD = 0.05, BH = 0.16, BD = 0.44, EMB = 0.08;   // el plano entra 8 cm en la ranura de la base
  const PPU = 520;                                                          // px de textura por unidad
  function textCanvas(wU, hU, draw) {
    const c = document.createElement('canvas'); c.width = Math.round(wU * PPU); c.height = Math.round(hU * PPU);
    const g = c.getContext('2d'); draw(g, c); const tx = new THREE.CanvasTexture(c);
    tx.colorSpace = THREE.SRGBColorSpace; tx.anisotropy = maxAniso; return tx;
  }
  // cara: laca cálida con un degradé de luz horneado (valor medio arriba, oscuro abajo) + cepillado fino
  const faceTx = textCanvas(PW, PH, (c, cv) => {
    const gr = c.createLinearGradient(0, 0, cv.width * 0.55, cv.height);
    gr.addColorStop(0, '#684b37'); gr.addColorStop(0.45, '#3a2b20'); gr.addColorStop(1, '#17110d');
    c.fillStyle = gr; c.fillRect(0, 0, cv.width, cv.height);
    const rn = M.rng(9); c.globalAlpha = 0.018;
    for (let i = 0; i < 500; i++) { c.fillStyle = rn() < 0.5 ? '#000' : '#fff'; c.fillRect(0, rn() * cv.height, cv.width, 1); }
    c.globalAlpha = 1; });
  // tamaño del año: el más ancho ocupa el plano de margen a margen (mismo cuerpo para los tres)
  const YEAR_F = (() => { const c = document.createElement('canvas').getContext('2d'); c.font = '800 100px "League Spartan"'; c.letterSpacing = '-4.5px';
    const w = Math.max(...MILESTONES.map((m) => c.measureText(String(m.year)).width)) / 100; return (PW - 0.34) / w; })();
  const faceMat = new THREE.MeshPhysicalMaterial({ map: faceTx, roughness: 0.38, clearcoat: 0.55, clearcoatRoughness: 0.3 });
  const edgeMat = new THREE.MeshStandardMaterial({ color: '#9a7250', metalness: 0.6, roughness: 0.34 });
  const baseMat = new THREE.MeshStandardMaterial({ color: '#35281e', roughness: 0.78 });
  const plates = MILESTONES.map((m, i) => {
    const px = X(m.year);
    const g = new THREE.Group(); g.position.set(px, 0, PLATE_Z); scene.add(g);
    // base apoyada en el suelo (y 0 → BH) con ranura: el plano queda encastrado, nada flota
    const base = new THREE.Mesh(new THREE.BoxGeometry(PW + 0.2, BH, BD), baseMat);
    base.position.y = BH / 2; base.castShadow = true; base.receiveShadow = true; g.add(base);
    // filete frontal de la base: se enciende en azul cuando la señal llega al hito
    const liteMat = new THREE.MeshBasicMaterial({ color: '#2a2019' });
    const lite = new THREE.Mesh(new THREE.BoxGeometry(PW - 0.1, 0.014, 0.01), liteMat);
    lite.position.set(0, BH - 0.035, BD / 2 + 0.004); g.add(lite);
    // plano fino: caras laterales en bronce (capturan la clave cálida y el contraluz frío)
    const plate = new THREE.Mesh(new THREE.BoxGeometry(PW, PH, PD), [edgeMat, edgeMat, edgeMat, edgeMat, faceMat, faceMat]);
    plate.position.y = BH - EMB + PH / 2; plate.castShadow = true; plate.receiveShadow = true; g.add(plate);
    // brazo: une la base con el riel (una sola pieza visual con ambos)
    const arm = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.022, RAIL_Z - PLATE_Z - BD / 2 - RAIL_D / 2 + 0.04), new THREE.MeshBasicMaterial({ color: '#3a2c20' }));
    arm.position.set(0, 0.011, (BD / 2 + (RAIL_Z - PLATE_Z - RAIL_D / 2)) / 2); g.add(arm);
    // texto impreso en la cara (luminoso: se lee bajo cualquier luz)
    const yearTx = textCanvas(PW, 1.2, (c) => {
      c.font = '800 ' + Math.round(YEAR_F * PPU) + 'px "League Spartan"'; c.letterSpacing = Math.round(-0.045 * YEAR_F * PPU) + 'px';
      c.fillStyle = '#F3EDE2'; c.textBaseline = 'alphabetic'; c.fillText(String(m.year), 0.17 * PPU, 1.02 * PPU); });
    const wordTx = textCanvas(PW, 0.8, (c) => {
      c.font = '300 ' + Math.round(0.29 * PPU) + 'px "League Spartan"'; c.letterSpacing = Math.round(-0.02 * 0.29 * PPU) + 'px';
      c.fillStyle = '#E3A560'; m.word.forEach((w, k) => c.fillText(w, 0.2 * PPU, (0.3 + k * 0.34) * PPU)); });
    const mk = (tx, h, y) => { const mat = new THREE.MeshBasicMaterial({ map: tx, transparent: true, opacity: 0, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2 });
      const me = new THREE.Mesh(new THREE.PlaneGeometry(PW, h), mat); me.position.set(0, plate.position.y + y, PD / 2 + 0.0015); g.add(me); return me; };
    const year = mk(yearTx, 1.2, 0.7), word = mk(wordTx, 0.8, -0.2);
    return { px, g, lite, liteMat, arm, year, word, on: { v: 0 } };
  });

  /* ---------------- hongos de h01 ("hoy", al final de la línea) ---------------- */
  const m1 = buildMushroom({ seed: 1, age: 0.85 });
  const m2 = buildMushroom({ seed: 2, stemH: 1.3, capScale: 0.8, age: 0.45 });
  const m3 = buildMushroom({ seed: 3, stemH: 0.78, capScale: 0.62, age: 0.0 });
  m1.group.position.set(MX + 0.15, 0, MZ + 0.75);
  m2.group.position.set(MX + 0.95, 0, MZ + 0.05); m2.group.rotation.set(0, 1.9, 0.1);
  m3.group.position.set(MX - 0.62, 0, MZ + 1.15); m3.group.rotation.set(0, -0.8, -0.14);
  [m1, m2, m3].forEach((m) => { m.wires.forEach((w) => (w.visible = false)); scene.add(m.group); });
  const grass = buildGrass({ count: 700, w: 3.6, d: 2.6, avoid: [[0.15, 0.75, 0.32], [0.95, 0.05, 0.28], [-0.62, 1.15, 0.26]] });
  grass.position.set(MX, 0, MZ); scene.add(grass);
  // borde ralo alrededor del mechón denso: el pasto se desvanece en vez de cortar en rectángulo
  const grass2 = buildGrass({ count: 260, w: 7.5, d: 5.2, seed: 11, avoid: [[-0.3, 0.4, 1.25], [-3.6, 1.9, 0.35], [-3.0, 1.9, 0.35], [-2.4, 1.9, 0.35], [-1.9, 1.9, 0.3]] });
  grass2.position.set(MX + 0.3, 0, MZ - 0.4); scene.add(grass2);

  /* ---------------- luces (h01): clave cálida lateral, contraluz frío, hemisférica tenue ---------------- */
  const key = new THREE.DirectionalLight('#ffdcae', 2.1); key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 5;
  Object.assign(key.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 0.5, far: 30 }); key.shadow.camera.updateProjectionMatrix();
  key.shadow.bias = -0.0004; scene.add(key, key.target);
  const rim = new THREE.DirectionalLight('#7fa2ff', 1.5); scene.add(rim, rim.target);
  const hemi = new THREE.HemisphereLight('#3a3440', '#140d08', 0.4); scene.add(hemi);
  const lights = { fx: 0, key: 2.1, rimY: 0.9 };   // contraluz bajo en el beat 1 (no baña el suelo de azul), alto en los hongos como en h01

  /* ---------------- cámara: dolly lateral por la línea de tiempo ---------------- */
  const stop = (px) => ({ x: px - 2.7, y: 1.66, z: 7.0, lx: px + 0.3, ly: 1.34, lz: PLATE_Z });
  const cam = { x: -4.1, y: 1.45, z: 9.2, lx: 0.2, ly: 1.35, lz: PLATE_Z, shift: 0 };
  const P = plates.map((p) => stop(p.px));
  // hito 1 (1958): la cámara se acerca
  tl.to(cam, { ...P[0], duration: 2.4, ease: 'apple' }, 0);
  // 60 años de hueco: viaje largo, con un arco suave de altura
  tl.to(cam, { x: P[1].x, lx: P[1].lx, duration: 1.2, ease: 'apple' }, 2.2);
  tl.to(cam, { z: 9.0, y: 2.05, duration: 0.6, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 2.2);
  tl.to(lights, { fx: plates[1].px, duration: 1.2, ease: 'apple' }, 2.2);
  tl.to(cam, { x: '+=0.25', lx: '+=0.12', duration: 2.05, ease: 'none' }, 3.4);
  // 5 años: salto corto
  tl.to(cam, { x: P[2].x, lx: P[2].lx, duration: 0.7, ease: 'apple' }, 5.45);
  tl.to(lights, { fx: plates[2].px, duration: 0.7, ease: 'apple' }, 5.45);
  tl.to(cam, { x: '+=0.22', lx: '+=0.1', duration: 1.3, ease: 'none' }, 6.15);
  // beat 2: llega a los hongos (encuadre de h01) y deja espacio al número a la izquierda
  const CB = { x: MX - 1.33, y: 1.0, z: MZ + 6.57, lx: MX + 0.3, ly: 1.45, lz: MZ + 0.6, shift: -440 };
  // primero gira hacia los hongos (el hito 2023 sale por la izquierda), después se acerca
  tl.to(cam, { lx: CB.lx, ly: CB.ly, lz: CB.lz, duration: 0.9, ease: 'apple' }, 7.45);
  tl.to(cam, { x: CB.x, y: CB.y, duration: 1.4, ease: 'apple' }, 7.6);
  tl.to(cam, { z: CB.z, duration: 1.2, ease: 'apple' }, 7.8);
  tl.to(cam, { shift: CB.shift, duration: 0.9, ease: 'apple' }, 8.1);
  tl.to(lights, { fx: MX, rimY: 2.6, duration: 1.4, ease: 'apple' }, 7.5);
  tl.to(cam, { x: '+=0.18', z: '-=0.2', duration: 1.8, ease: 'none' }, 9.0);
  // beat 3: se aleja y se atenúa
  tl.to(cam, { x: MX - 1.9, y: 1.55, z: MZ + 8.6, ly: 1.2, shift: -560, duration: 3.6, ease: 'apple' }, 10.8);
  tl.to(lights, { key: 1.25, duration: 3.0, ease: 'apple' }, 10.95);

  /* ---------------- señal azul y encendido de cada hito ---------------- */
  tl.to(signal, { x: plates[0].px, duration: 0.7, ease: 'appleOut' }, 0.15);
  tl.to(signal, { x: plates[1].px, duration: 1.15, ease: 'apple' }, 2.2);
  tl.to(signal, { x: plates[2].px, duration: 0.65, ease: 'apple' }, 5.45);
  tl.to(signal, { x: RAIL_X1, duration: 1.3, ease: 'apple' }, 7.55);
  const BLUE = new THREE.Color('#8fb0ff').multiplyScalar(1.4), DARK = new THREE.Color('#2a2019'), ARM = new THREE.Color('#3a2c20');
  const tIn = [0.7, 3.25, 5.95], tOut = [2.2, 5.45, 7.45];
  plates.forEach((p, i) => {
    // (los colores se aplican en onFrame: M.seek suprime los onUpdate)
    tl.to(p.on, { v: 1, duration: 0.35, ease: 'appleOut' }, tIn[i] - 0.15);
    // el año sube y aparece; la palabra lo sigue (0,15 s)
    const yy = p.year.position.y, wy = p.word.position.y;
    tl.fromTo(p.year.position, { y: yy - 0.12 }, { y: yy, duration: 0.8, ease: 'appleOut' }, tIn[i]);
    tl.to(p.year.material, { opacity: 1, duration: 0.6, ease: 'appleOut' }, tIn[i]);
    tl.fromTo(p.word.position, { y: wy - 0.1 }, { y: wy, duration: 0.8, ease: 'appleOut' }, tIn[i] + 0.15);
    tl.to(p.word.material, { opacity: 1, duration: 0.6, ease: 'appleOut' }, tIn[i] + 0.15);
    // al pasar al siguiente hito, el anterior queda en segundo plano (texto casi apagado)
    tl.to([p.year.material, p.word.material], { opacity: 0, duration: 0.45, ease: 'appleIn' }, tOut[i]);
  });

  /* ---------------- desenfoque de fondo para el dato (beat 2) ---------------- */
  tl.fromTo('#gl', { filter: 'blur(0px) brightness(1)' }, { filter: 'blur(5px) brightness(0.9)', duration: 1.2, ease: 'apple' }, 8.1);
  tl.to('#gl', { filter: 'blur(8px) brightness(0.72)', duration: 2.2, ease: 'apple' }, 10.85);

  /* ---------------- texto HTML (skill motion-copy) ---------------- */
  tl.to('#fade', { opacity: 0, duration: 0.7, ease: 'appleOut' }, 0.12);

  tl.from('#num', { yPercent: 18, opacity: 0, duration: 0.9, ease: 'appleOut' }, 8.15);
  M.counter($('#numV'), { from: 0, to: RESPONSE, at: 8.2, dur: 1.4, ease: 'expo.out' });
  M.textIn($('#numL'), 8.65, { type: 'words', dur: 0.7, stagger: 0.05, ease: 'appleOut' });
  tl.to(['#num', '#numL'], { opacity: 0, y: -14, duration: 0.5, ease: 'appleIn' }, 10.85);

  const cA = M.textIn($('#c1 .a'), 11.2, { dur: 1.0, stagger: 0.03, ease: 'appleOut' });
  const cB = M.textIn($('#c1 .b'), 11.5, { dur: 1.0, stagger: 0.03, ease: 'appleOut' });
  M.textIn($('#c2'), 12.1, { type: 'words', dur: 0.8, stagger: 0.06, ease: 'appleOut' });
  tl.to(['#c1', '#c2'], { opacity: 0, y: -14, duration: 0.5, ease: 'appleIn' }, 14.1);
  tl.to('#fade', { opacity: 1, duration: 0.5, ease: 'appleIn' }, 14.2);

  /* ---------------- por cuadro ---------------- */
  M.onFrame(() => {
    const fx = lights.fx;
    key.position.set(fx - 4, 4.5, 4); key.target.position.set(fx, 0.8, -0.3); key.intensity = lights.key;
    rim.position.set(fx + 3.5, lights.rimY, -4.5); rim.target.position.set(fx, 0.9, 0);
    plates.forEach((p) => { p.liteMat.color.copy(DARK).lerp(BLUE, p.on.v); p.arm.material.color.copy(ARM).lerp(BLUE, p.on.v * 0.85); });
    sig.scale.x = Math.max(0.001, signal.x - RAIL_X0); head.position.x = signal.x; head.visible = signal.x < RAIL_X1 - 0.02;
    camera.position.set(cam.x, cam.y, cam.z);
    camera.lookAt(cam.lx, cam.ly, cam.lz);
    camera.setViewOffset(1920, 1080, cam.shift, 0, 1920, 1080);
    S.render();
  });
});
</script>
