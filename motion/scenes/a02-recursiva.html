<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>A02 · Inteligencia recursiva</title>
<link rel="stylesheet" href="../lib/theme.css">
<link rel="stylesheet" href="../lib/fonts-spartan.css">
<style>
  /* Tinta sobre papel: fondo hueso, plumín negro fino y UN acento rojo (tinta fresca = lo que se está creando). */
  body, html.verde body { background: #EFEDE8; }
  #cv { position: absolute; inset: 0; }
  #grain { position: absolute; inset: 0; width: 1920px; height: 1080px; mix-blend-mode: multiply; opacity: 0.55; pointer-events: none; }
  #vig { position: absolute; inset: 0; background: radial-gradient(120% 110% at 50% 46%, transparent 58%, rgba(92,78,58,0.13) 100%); mix-blend-mode: multiply; }
  #fade { position: absolute; inset: 0; background: #EFEDE8; opacity: 0; }
</style>
</head>
<body>
<div id="world">
  <canvas id="cv" width="1920" height="1080"></canvas>
  <canvas id="grain" width="960" height="540"></canvas>
  <div id="vig"></div>
  <div id="fade"></div>
</div>

<script src="../node_modules/gsap/dist/gsap.min.js"></script>
<script src="../node_modules/gsap/dist/SplitText.min.js"></script>
<script src="../node_modules/gsap/dist/DrawSVGPlugin.min.js"></script>
<script src="../node_modules/gsap/dist/CustomEase.min.js"></script>
<script src="../lib/stage.js"></script>
<script src="../lib/audio.js"></script>
<script>
/* ============================================================================
   A02 · Inteligencia recursiva (sin texto)
   Un tecnígrafo (tablero con brazos articulados) dibuja en el centro de su hoja
   una copia MEJOR de sí mismo. Cada generación suma algo visible, que la copia
   dibuja en rojo: un brazo más (1 → 2 → 4), punta cónica en la pluma, escuadra
   en L en el cabezal y una barra más en el cajetín (la escalera de versiones).
   La hoja tiene marcas de corte (+) alrededor de la copia: al hacer zoom, esas
   marcas y el marco del padre salen del cuadro de forma continua (Droste real)
   hasta que el marco de la copia coincide con el del padre y se cambia de
   generación sin ningún salto. Ciclos 3 → 1,8 → 1,08 → 0,65 s … (razón 0,6):
   convergen en un instante finito, donde todo se lava a un punto rojo que baja
   al origen y dibuja la curva; cada ciclo es una miniatura sobre ella.
   ========================================================================== */
M.scene({ duration: 14, push: 0, audio: { key: 'D', mode: 'lydian', bed: { cycle: 8, bright: 0.85, sub: 0.15 } } }, (tl, M) => {
  const $ = (s) => document.querySelector(s);
  const cv = $('#cv'), g0 = cv.getContext('2d');
  const buf = document.createElement('canvas'); buf.width = 1920; buf.height = 1080;
  const gb = buf.getContext('2d');
  let g = g0;
  let ALPHA = 1;                    // multiplicador de opacidad de los trazos (brazos que se desvanecen)

  const PAPER = '#EFEDE8', INK = '#1B1A18', RED = '#C8372D', GREY = '#9A958C';
  const C = [960, 540];            // punto fijo del zoom (centro)
  const S = 0.4;                   // escala de la copia dentro del tablero
  const L1 = 830, L2 = 500;        // brazo: tramo largo y tramo corto
  const BO = [150, 84, 1770, 996], BI = [184, 118, 1736, 962];   // tablero (16:9) y hoja
  const EASE = { apple: gsap.parseEase('apple'), appleOut: gsap.parseEase('appleOut'), appleIn: gsap.parseEase('appleIn'), sineIn: gsap.parseEase('sine.in') };
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, u) => a + (b - a) * u;
  const mixRed = (u) => { // INK → RED
    const a = [0x1B, 0x1A, 0x18], b = [0xC8, 0x37, 0x2D];
    return `rgb(${a.map((v, i) => Math.round(lerp(v, b[i], u))).join(',')})`;
  };

  /* ---------------- papel ---------------- */
  { const gg = $('#grain').getContext('2d'); const im = gg.createImageData(960, 540); const rn = M.rng(5);
    for (let i = 0; i < im.data.length; i += 4) { const v = 255 - Math.floor(rn() * rn() * 34); im.data[i] = v; im.data[i + 1] = v - 1; im.data[i + 2] = v - 3; im.data[i + 3] = 255; }
    gg.putImageData(im, 0, 0); }

  /* ---------------- geometría del tablero (coordenadas locales = pantalla cuando esa generación llena el cuadro) ---------------- */
  // Anclas en las esquinas del marco. En reposo cada brazo se pliega a lo largo de su lado, con el codo
  // un poco hacia adentro de la hoja (δ) y el antebrazo volviendo hacia adentro (γ).
  const AN = [
    { a: [167, 101], f: [0, 1], n: [1, 0] },     // arriba-izq: baja por la izquierda
    { a: [1753, 979], f: [0, -1], n: [-1, 0] },  // abajo-der: sube por la derecha
    { a: [1753, 101], f: [-1, 0], n: [0, 1] },   // arriba-der: va hacia la izquierda por arriba
    { a: [167, 979], f: [1, 0], n: [0, -1] },    // abajo-izq: va hacia la derecha por abajo
  ];
  function ik2(a, p) {
    const dx = p[0] - a[0], dy = p[1] - a[1];
    const d = clamp(Math.hypot(dx, dy), Math.abs(L1 - L2) + 1, L1 + L2 - 0.01);
    const th = Math.atan2(dy, dx), al = Math.acos(clamp((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d), -1, 1));
    return [[a[0] + L1 * Math.cos(th + al), a[1] + L1 * Math.sin(th + al)], [a[0] + L1 * Math.cos(th - al), a[1] + L1 * Math.sin(th - al)]];
  }
  // Codo: se elige la solución que queda dentro de la hoja; si ambas lo están, la del lado de diseño del brazo.
  const inset = (e) => Math.min(e[0] - BI[0], BI[2] - e[0], e[1] - BI[1], BI[3] - e[1]);
  function ik(A, p) {
    const s = ik2(A.a, p), e0 = s[A.side], e1 = s[1 - A.side];
    return inset(e0) >= 12 || inset(e0) >= inset(e1) ? e0 : e1;
  }
  const DELTA = 7 * Math.PI / 180, GAMMA = 12 * Math.PI / 180;
  AN.forEach((A) => {
    const E = [A.a[0] + L1 * (A.f[0] * Math.cos(DELTA) + A.n[0] * Math.sin(DELTA)), A.a[1] + L1 * (A.f[1] * Math.cos(DELTA) + A.n[1] * Math.sin(DELTA))];
    A.rest = [E[0] + L2 * (-A.f[0] * Math.cos(GAMMA) + A.n[0] * Math.sin(GAMMA)), E[1] + L2 * (-A.f[1] * Math.cos(GAMMA) + A.n[1] * Math.sin(GAMMA))];
    const s = ik2(A.a, A.rest);
    A.side = Math.hypot(s[0][0] - E[0], s[0][1] - E[1]) < Math.hypot(s[1][0] - E[0], s[1][1] - E[1]) ? 0 : 1;
    A.sx = Math.sign(C[0] - A.a[0]); A.sy = Math.sign(C[1] - A.a[1]);
  });
  // Mejora visible por generación: brazos 1 → 2 → 4 · punta cónica (k ≥ 1) · escuadra en L (k ≥ 2) · barras del cajetín = k + 1
  const armsOf = (k) => (k <= 0 ? 1 : k === 1 ? 2 : 4);
  const NBARS = 8;

  const circ = (c, r, n) => { const p = []; for (let i = 0; i <= n; i++) { const a = -Math.PI / 2 + i / n * Math.PI * 2; p.push([c[0] + r * Math.cos(a), c[1] + r * Math.sin(a)]); } return p; };
  const rect = (x0, y0, x1, y1) => [[x0, y0], [x1, y0], [x1, y1], [x0, y1], [x0, y0]];
  function seg(p, q, off, t0, t1) {
    const dx = q[0] - p[0], dy = q[1] - p[1], L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L, nx = -uy, ny = ux;
    return [[p[0] + ux * t0 + nx * off, p[1] + uy * t0 + ny * off], [q[0] - ux * t1 + nx * off, q[1] - uy * t1 + ny * off]];
  }
  // Piezas del cabezal según la generación
  function coneOf(E, pen) {   // punta cónica: triángulo con vértice en la pluma, base 34 px hacia el codo
    const dx = E[0] - pen[0], dy = E[1] - pen[1], L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;
    const b = [pen[0] + ux * 34, pen[1] + uy * 34], h = 8;
    return [[b[0] - uy * h, b[1] + ux * h], [pen[0], pen[1]], [b[0] + uy * h, b[1] - ux * h], [b[0] - uy * h, b[1] + ux * h]];
  }
  function squareOf(A, pen) { // escuadra en L (reglas del tecnígrafo), paralela a los bordes, hacia adentro
    const c = [pen[0] + A.sx * 18, pen[1] + A.sy * 18], Lr = 92, wd = 10;
    return {
      outer: [[c[0] + A.sx * Lr, c[1]], c, [c[0], c[1] + A.sy * Lr]],
      inner: [[c[0] + A.sx * Lr, c[1] + A.sy * wd], [c[0] + A.sx * wd, c[1] + A.sy * wd], [c[0] + A.sx * wd, c[1] + A.sy * Lr]],
      ends: [[[c[0] + A.sx * Lr, c[1]], [c[0] + A.sx * Lr, c[1] + A.sy * wd]], [[c[0], c[1] + A.sy * Lr], [c[0] + A.sx * wd, c[1] + A.sy * Lr]]],
      polys: [[c, [c[0] + A.sx * Lr, c[1]], [c[0] + A.sx * Lr, c[1] + A.sy * wd], [c[0], c[1] + A.sy * wd]], [c, [c[0] + A.sx * wd, c[1]], [c[0] + A.sx * wd, c[1] + A.sy * Lr], [c[0], c[1] + A.sy * Lr]]],
    };
  }
  function armStrokes(A, pen, k) {
    const E = ik(A, pen);
    const s = [
      { pts: seg(A.a, E, 6.5, 17, 12), w: 1.5, arm: 1 }, { pts: seg(A.a, E, -6.5, 17, 12), w: 1.5, arm: 1 },
      { pts: circ(E, 11, 26), w: 1.5, arm: 1 }, { pts: circ(E, 2.4, 8), w: 2.6, arm: 1 },
      { pts: seg(E, pen, 4.2, 12, 14), w: 1.5, arm: 1 }, { pts: seg(E, pen, -4.2, 12, 14), w: 1.5, arm: 1 },
      { pts: circ(pen, 13, 28), w: 1.5, arm: 1 }, { pts: circ(pen, 3, 8), w: 3, arm: 1, nib: 1 },
    ];
    if (k >= 1) s.push({ pts: coneOf(E, pen), w: 1.5, arm: 1, feat: 1 });
    if (k >= 2) { const q = squareOf(A, pen); s.push({ pts: q.outer, w: 1.5, arm: 1, feat: 2 }, { pts: q.inner, w: 1.1, arm: 1, feat: 2 }, ...q.ends.map((e) => ({ pts: e, w: 1.1, arm: 1, feat: 2 }))); }
    return s;
  }
  // Cuerpo opaco del brazo vivo (tapa lo que está debajo: es un objeto sobre el papel)
  function armBody(A, pen, k) {
    const E = ik(A, pen);
    const q = (p, r, o) => { const a = seg(p, r, o, 0, 0), b = seg(p, r, -o, 0, 0); return [a[0], a[1], b[1], b[0]]; };
    const polys = [q(A.a, E, 6.5), q(E, pen, 4.2)];
    if (k >= 1) polys.push(coneOf(E, pen));
    if (k >= 2) polys.push(...squareOf(A, pen).polys);
    return { polys, circles: [[A.a, 15], [E, 11], [pen, 13]] };
  }
  // Cajetín (abajo a la derecha de la hoja) con la escalera de versiones
  const CJ = [1486, 866, 1714, 942];
  const barRect = (i) => { const w = 14, x = CJ[0] + 14 + i * 26, h = 10 + i * 7; return rect(x, CJ[3] - 8 - h, x + w, CJ[3] - 8); };
  function boardStrokes(k) {
    const [a, b, c, d] = BO, [e, f, h, i] = BI, s = [];
    s.push({ pts: [[a, b], [c, b]], w: 2.6 }, { pts: [[c, b], [c, d]], w: 2.6 }, { pts: [[c, d], [a, d]], w: 2.6 }, { pts: [[a, d], [a, b]], w: 2.6 });
    s.push({ pts: [[e, f], [h, f]], w: 1.2 }, { pts: [[h, f], [h, i]], w: 1.2 }, { pts: [[h, i], [e, i]], w: 1.2 }, { pts: [[e, i], [e, f]], w: 1.2 });
    // sombra rayada a 45° fuera del tablero, a la derecha y abajo (luz de arriba a la izquierda)
    const sp = 10, sw = 20;
    for (let y = b + sw + 18; y <= d; y += sp) s.push({ pts: [[c + 2, y], [c + sw, y - 18]], w: 0.9, hatch: 1 });
    for (let x = a + sw; x <= c + 2; x += sp) s.push({ pts: [[x, d + sw], [x + 18, d + 2]], w: 0.9, hatch: 1 });
    AN.slice(0, armsOf(k)).forEach((A, j) => { const nu = k >= 1 && j >= armsOf(k - 1) ? 1 : 0; s.push({ pts: circ(A.a, 15, 30), w: 1.5, nu }, { pts: circ(A.a, 6, 14), w: 1.5, nu }); });
    s.push({ pts: rect(CJ[0], CJ[1], CJ[2], CJ[3]), w: 1.2 });
    for (let j = 0; j <= Math.min(k, NBARS - 1); j++) s.push({ pts: barRect(j), w: 1.3, nu: j === k && k >= 1 ? 1 : 0 });
    return s;
  }
  function genStrokes(k) {
    const out = boardStrokes(k);
    AN.slice(0, armsOf(k)).forEach((A, j) => {
      const newArm = k >= 1 && j >= armsOf(k - 1);
      armStrokes(A, A.rest, k).forEach((s) => out.push({ ...s, nu: newArm || (s.feat && s.feat === k) ? 1 : 0 }));
    });
    return out;
  }
  const lenOf = (pts) => { let L = 0; for (let i = 1; i < pts.length; i++) L += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); return L; };

  // Marcas de corte (+) de la hoja: grilla de 96 px alrededor de la copia (no dentro de ella ni del cajetín)
  const CROSS = [];
  for (let i = -7; i <= 7; i++) for (let j = -4; j <= 4; j++) {
    const x = C[0] + i * 96, y = C[1] + j * 96;
    if (Math.abs(x - C[0]) <= 0.4 * 810 + 36 && Math.abs(y - C[1]) <= 0.4 * 456 + 36) continue;
    if (x > CJ[0] - 24 && y > CJ[1] - 24) continue;
    CROSS.push({ p: [x, y], r: Math.hypot((x - C[0]) / 672, (y - C[1]) / 384) / Math.SQRT2 });
  }

  /* ---------------- plan de dibujo: la generación k-1 dibuja a la k ---------------- */
  const TRAVEL_W = 0.42, HATCH_W = 0.3;
  const plans = {};
  function planFor(k) {
    const key = Math.min(k, NBARS);
    if (plans[key]) return plans[key];
    const strokes = genStrokes(key).map((s, i) => {
      const pp = s.pts.map((p) => [C[0] + S * (p[0] - C[0]), C[1] + S * (p[1] - C[1])]);
      return { ...s, i, pp, len: lenOf(pp) };
    });
    const parents = AN.slice(0, armsOf(key - 1));
    const lists = parents.map(() => []);
    strokes.forEach((s) => {
      const m = s.pp[Math.floor(s.pp.length / 2)];
      let best = 0, bd = 1e9;
      parents.forEach((A, j) => { const d = Math.hypot(m[0] - A.a[0], m[1] - A.a[1]); if (d < bd) { bd = d; best = j; } });
      lists[best].push(s);
    });
    const arms = parents.map((A, j) => {
      const segs = []; let cur = A.rest, D = 0; const todo = lists[j].slice();
      while (todo.length) {
        let bi = 0, bd = 1e9, rev = false;
        todo.forEach((s, i) => {
          const d0 = Math.hypot(s.pp[0][0] - cur[0], s.pp[0][1] - cur[1]), d1 = Math.hypot(s.pp[s.pp.length - 1][0] - cur[0], s.pp[s.pp.length - 1][1] - cur[1]);
          if (d0 < bd) { bd = d0; bi = i; rev = false; } if (d1 < bd) { bd = d1; bi = i; rev = true; }
        });
        const s = todo.splice(bi, 1)[0]; const pts = rev ? s.pp.slice().reverse() : s.pp;
        const tl = Math.hypot(pts[0][0] - cur[0], pts[0][1] - cur[1]);
        segs.push({ travel: 1, a: cur, b: pts[0], d0: D, d1: D + tl * TRAVEL_W }); D += tl * TRAVEL_W;
        const w = s.hatch ? HATCH_W : 1;
        segs.push({ s, pts, rev, d0: D, d1: D + s.len * w }); s.d0 = D; s.d1 = D + s.len * w; s.rev = rev; D += s.len * w;
        cur = pts[pts.length - 1];
      }
      const tl = Math.hypot(A.rest[0] - cur[0], A.rest[1] - cur[1]);
      segs.push({ travel: 1, a: cur, b: A.rest, d0: D, d1: D + tl * TRAVEL_W }); D += tl * TRAVEL_W;
      return { A, segs, D };
    });
    const Dmax = Math.max(...arms.map((a) => a.D));
    return (plans[key] = { strokes, arms, Dmax });
  }
  function penAt(arm, D) {
    if (D <= 0) return { p: arm.A.rest, drawing: false };
    for (const sg of arm.segs) {
      if (D <= sg.d1) {
        const u = (D - sg.d0) / Math.max(1e-6, sg.d1 - sg.d0);
        if (sg.travel) return { p: [lerp(sg.a[0], sg.b[0], u), lerp(sg.a[1], sg.b[1], u)], drawing: true, up: true };
        return { p: pointAt(sg.pts, u), drawing: true };
      }
    }
    return { p: arm.A.rest, drawing: false };
  }
  function pointAt(pts, u) {
    let rem = lenOf(pts) * u;
    for (let i = 1; i < pts.length; i++) {
      const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
      if (rem <= l) { const v = rem / (l || 1); return [lerp(pts[i - 1][0], pts[i][0], v), lerp(pts[i - 1][1], pts[i][1], v)]; }
      rem -= l;
    }
    return pts[pts.length - 1];
  }

  /* ---------------- ritmo: ciclos que se aceleran (3 s × 0,6ⁿ) ---------------- */
  const T0 = 1.45, C0 = 3.0, R = 0.6;
  const TINF = T0 + C0 / (1 - R);                  // 8,95 s: el límite
  const cyc = (n) => C0 * R ** n;
  const Tn = (n) => T0 + C0 * (1 - R ** n) / (1 - R);
  const wOf = (n) => clamp((n - 1) / 5);            // 0 = ciclos lentos (con pausas) · 1 = continuo
  const zStart = (n) => lerp(0.66, 0.0, wOf(n));
  const dWin = (n) => [lerp(0.04, 0.0, wOf(n)), lerp(0.68, 0.86, wOf(n))];
  function cycleAt(t) { if (t < T0) return { n: -1, tau: 0 }; let n = 0; while (n < 40 && t >= Tn(n + 1)) n++; return { n, tau: (t - Tn(n)) / cyc(n) }; }
  function zAt(t) {
    const { n, tau } = cycleAt(t); if (n < 0) return 0;
    const zs = zStart(n), u = clamp((tau - zs) / (1 - zs)), w = wOf(n);
    return n + (1 - w) * EASE.apple(u) + w * u;
  }
  // Avance de pluma de la generación n (dibuja a la n+1) en el instante t
  function DAt(n, t) {
    if (n < 0 || t < Tn(n)) return 0;
    const tau = (t - Tn(n)) / cyc(n), [a, b] = dWin(n), u = clamp((tau - a) / (b - a)), w = wOf(n);
    return planFor(n + 1).Dmax * ((1 - w) * EASE.apple(u) + w * u);
  }
  // Tinta fresca (roja) detrás de la pluma: lo que se dibujó en los últimos 0,4 s (mín. 180 px)
  const wetOf = (n) => { const [a, b] = dWin(n); return Math.max(180, planFor(n + 1).Dmax / ((b - a) * cyc(n)) * 0.4); };

  /* ---------------- dibujo ---------------- */
  function stroke(pts, lw, color, from = 0, to = 1) {
    if (to <= from || lw <= 0.05) return;
    g.strokeStyle = color; g.lineWidth = Math.max(0.35, lw);
    g.globalAlpha = (lw < 0.35 ? lw / 0.35 : 1) * ALPHA;
    g.beginPath();
    if (from <= 0 && to >= 1) { g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); }
    else {
      const tot = lenOf(pts), a = tot * from, b = tot * to; let acc = 0, started = false;
      for (let i = 1; i < pts.length; i++) {
        const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
        if (acc + l >= a && acc <= b) {
          const u0 = clamp((a - acc) / (l || 1)), u1 = clamp((b - acc) / (l || 1));
          const p0 = [lerp(pts[i - 1][0], pts[i][0], u0), lerp(pts[i - 1][1], pts[i][1], u0)], p1 = [lerp(pts[i - 1][0], pts[i][0], u1), lerp(pts[i - 1][1], pts[i][1], u1)];
          if (!started) { g.moveTo(p0[0], p0[1]); started = true; }
          g.lineTo(p1[0], p1[1]);
        }
        acc += l; if (acc > b) break;
      }
    }
    g.stroke(); g.globalAlpha = 1;
  }
  const scr = (F, p) => [C[0] + F * (p[0] - C[0]), C[1] + F * (p[1] - C[1])];
  const scrAll = (F, pts) => pts.map((p) => scr(F, p));
  // Grosor en pantalla: escala con F^0,8 y con piso de ~0,9 px mientras la generación es legible (continuo en F)
  const lwOf = (w, F, hatch) => hatch ? w * F ** 0.8 : Math.max(w * F ** 0.8, Math.min(w, 0.95) * clamp(F / 0.3));
  const redLw = (lw, F) => Math.max(lw * 1.5, 2 * clamp(F / 0.3));

  function renderCrosses(F, alphaOf) {
    const fa = clamp((F - 0.1) / 0.18);
    if (fa <= 0) return;
    const h = 7 * F;
    g.strokeStyle = GREY; g.lineWidth = Math.max(0.6, 1.1 * F ** 0.8);
    for (const c of CROSS) {
      const a = alphaOf(c) * fa; if (a <= 0.01) continue;
      const p = scr(F, c.p); if (p[0] < -10 || p[0] > 1930 || p[1] < -10 || p[1] > 1090) continue;
      g.globalAlpha = a * 0.9; g.beginPath(); g.moveTo(p[0] - h, p[1]); g.lineTo(p[0] + h, p[1]); g.moveTo(p[0], p[1] - h); g.lineTo(p[0], p[1] + h); g.stroke();
    }
    g.globalAlpha = 1;
  }

  // Revelado de la generación 0 (se dibuja sola al empezar)
  const G0 = genStrokes(0);
  function introFrac(s, idx, t) {
    let a, d;
    if (s.arm) { a = 0.72; d = 0.55; } else if (s.hatch) { a = 0.5 + 0.35 * (idx % 60) / 60; d = 0.3; } else if (s.w > 2) { a = 0.2; d = 0.75; } else if (s.w < 1.3) { a = 0.34; d = 0.7; } else { a = 0.62; d = 0.4; }
    return EASE.appleOut(clamp((t - a) / d));
  }

  function renderGen(k, t, z) {                   // tinta fija (tablero y lo ya dibujado)
    const F = S ** (k - z);
    if (F > 7 || F < 0.012) return;
    const active = t >= Tn(k);                      // sus brazos ya se mueven (se dibujan en renderArms)
    if (k === 0) {
      renderCrosses(F, (c) => EASE.appleOut(clamp((t - 0.45 - 0.5 * c.r) / 0.35)));
      G0.forEach((s, i) => { if (s.arm && active) return; stroke(scrAll(F, s.pts), lwOf(s.w, F, s.hatch), INK, 0, introFrac(s, i, t)); });
      return;
    }
    const P = planFor(k), Dp = DAt(k - 1, t);
    if (Dp <= 0) return;
    const pr = Dp / P.Dmax;
    renderCrosses(F, (c) => clamp((pr - 0.08 - 0.55 * c.r) / 0.14));
    const drawingNow = Dp < P.Dmax, WET = wetOf(k - 1);
    const rn = 1 - clamp((z - (k - 1) - 0.35) / 0.45);   // lo nuevo sigue rojo hasta mitad del zoom
    const newCol = mixRed(rn);
    P.strokes.forEach((s) => {
      if (s.arm && active) return;
      if (s.d0 === undefined || Dp <= s.d0) return;
      const f = clamp((Dp - s.d0) / (s.d1 - s.d0));
      const wf = drawingNow ? clamp((Dp - WET - s.d0) / (s.d1 - s.d0)) : f;
      const pts = scrAll(F, s.pts), lw = lwOf(s.w, F, s.hatch);
      const col = s.nu ? newCol : INK, lwc = s.nu ? lerp(lw, redLw(lw, F), rn) : lw;
      const rl = redLw(lw, F);
      if (s.rev) { stroke(pts, lwc, col, 1 - wf, 1); if (wf < f) stroke(pts, rl, RED, 1 - f, 1 - wf); }
      else { stroke(pts, lwc, col, 0, wf); if (wf < f) stroke(pts, rl, RED, wf, f); }
    });
  }
  const armsAlpha = (z) => 1 - clamp((z - 3.2) / 0.6);   // en los ciclos ≤ 0,39 s solo queda la tinta que corre
  function renderArms(k, t, z) {                  // brazos vivos de la generación k
    if (t < Tn(k)) return;
    const F = S ** (k - z);
    if (F > 7 || F < 0.012) return;
    const P = planFor(k + 1), D = DAt(k, t), AA = armsAlpha(z);
    P.arms.forEach((arm) => {
      const { p, drawing, up } = penAt(arm, D);
      if (AA > 0.01) {
        const B = armBody(arm.A, p, k);
        g.fillStyle = PAPER; g.globalAlpha = AA;
        B.polys.forEach((q) => { g.beginPath(); q.forEach((v, i) => { const w = scr(F, v); i ? g.lineTo(w[0], w[1]) : g.moveTo(w[0], w[1]); }); g.closePath(); g.fill(); });
        B.circles.forEach(([c, r]) => { const w = scr(F, c); g.beginPath(); g.arc(w[0], w[1], r * F, 0, 6.2832); g.fill(); });
        g.globalAlpha = 1; ALPHA = AA;
        armStrokes(arm.A, p, k).forEach((s) => { if (!(s.nib && drawing)) stroke(scrAll(F, s.pts), lwOf(s.w, F), INK); });
        ALPHA = 1;
      }
      if (drawing && !(up && AA <= 0.01)) { const w = scr(F, p); g.fillStyle = RED; g.beginPath(); g.arc(w[0], w[1], Math.max(2.5, 4.6 * F), 0, 6.2832); g.fill(); }
    });
  }

  function renderRush(t) {
    g.fillStyle = PAPER; g.fillRect(0, 0, 1920, 1080);
    g.lineCap = 'round'; g.lineJoin = 'round';
    const z = zAt(t), zf = Math.floor(z);
    let kmax = 0; while (kmax < 60 && t >= Tn(kmax)) kmax++;   // la k existe si su padre ya empezó
    const k0 = Math.max(0, zf - 2), k1 = Math.min(kmax, zf + 6);
    for (let k = k0; k <= k1; k++) renderGen(k, t, z);
    for (let k = k1; k >= k0; k--) renderArms(k, t, z);       // el brazo del padre pasa por encima de la copia
  }

  /* ---------------- final: la curva hecha de ciclos ---------------- */
  const O = [230, 842], XI = 1600, KC = 72500;
  const yC = (x) => O[1] - KC * (1 / (XI - x) - 1 / (XI - O[0]));
  const xEnd = XI - 1 / ((O[1] + 70) / KC + 1 / (XI - O[0]));
  const markX = (n) => XI - (XI - O[0]) * R ** n;
  const TC0 = 10.05, TC1 = 11.75;                  // la pluma recorre la curva
  const penX = (t) => O[0] + (xEnd - O[0]) * EASE.sineIn(clamp((t - TC0) / (TC1 - TC0)));
  const tMark = (n) => { // instante en que la pluma pasa por el ciclo n
    const target = (markX(n) - O[0]) / (xEnd - O[0]); let lo = 0, hi = 1;
    for (let i = 0; i < 40; i++) { const m = (lo + hi) / 2; if (EASE.sineIn(m) < target) lo = m; else hi = m; }
    return TC0 + lo * (TC1 - TC0);
  };
  const tMk = (n) => (n === 0 ? TC0 - 0.05 : tMark(n));
  const DOT_IN = TINF - 0.06, GLIDE0 = 9.25, GLIDE1 = 10.0;
  const CORN = [[-1, -1], [1, 1], [1, -1], [-1, 1]];   // esquinas de los brazos (TL, BR, TR, BL)
  function thumb(n, x, y, sc) {
    const w = 34 * sc, h = 20 * sc;
    g.fillStyle = PAPER; g.fillRect(x - w / 2, y - h / 2, w, h);
    g.strokeStyle = INK; g.lineWidth = 1.6; g.strokeRect(x - w / 2, y - h / 2, w, h);
    g.lineWidth = 0.8; g.strokeRect(x - w / 2 + 2.5 * sc, y - h / 2 + 2.5 * sc, w - 5 * sc, h - 5 * sc);
    for (let j = 0; j < armsOf(n); j++) {           // el diminuto: un trazo por brazo (los nuevos, en rojo)
      const [cx, cy] = CORN[j], x0 = x + cx * (w / 2 - 3.5 * sc), y0 = y + cy * (h / 2 - 3.5 * sc);
      g.strokeStyle = n >= 1 && j >= armsOf(n - 1) ? RED : INK; g.lineWidth = 1.6;
      g.beginPath(); g.moveTo(x0, y0); g.lineTo(x0 - cx * 10 * sc, y0 - cy * 5.5 * sc); g.stroke();
    }
  }
  function renderEnd(t) {
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.fillStyle = PAPER; g.fillRect(0, 0, 1920, 1080);
    // empuje de cámara leve mientras la curva se asienta
    const pu = 1 + 0.03 * EASE.appleOut(clamp((t - TC1) / 1.5)), P0 = [900, 560];
    g.setTransform(pu, 0, 0, pu, P0[0] * (1 - pu), P0[1] * (1 - pu));
    g.lineCap = 'round'; g.lineJoin = 'round';
    // base (tiempo) y la pared (límite)
    const bl = EASE.appleOut(clamp((t - 9.45) / 0.9));
    if (bl > 0) stroke([[O[0] - 60, O[1]], [1760, O[1]]], 1.4, INK, 0, bl);
    const wl = EASE.appleOut(clamp((t - 10.35) / 1.0));
    if (wl > 0) {
      g.save(); g.setLineDash([6, 6]); ALPHA = 0.55; stroke([[XI, O[1] - 4], [XI, 70]], 1.4, INK, 0, wl); ALPHA = 1; g.restore();
    }
    // curva roja
    const px = penX(t);
    if (t >= TC0) {
      const pts = []; const lam1 = Math.log((XI - O[0]) / Math.max(1e-3, XI - px));
      for (let i = 0; i <= 260; i++) { const lam = lam1 * i / 260; const x = XI - (XI - O[0]) * Math.exp(-lam); pts.push([x, yC(x)]); }
      stroke(pts, 3.4, RED);
    }
    // una miniatura del tablero por ciclo: aparece cuando la pluma pasa
    for (let n = 0; n <= 5; n++) {
      const u = clamp((t - tMk(n)) / 0.32);
      if (u <= 0) continue;
      const x = markX(n); thumb(n, x, yC(x), M.spring(0.15)(u));
    }
    // la pluma: punto rojo que nace en el centro, baja al origen y recorre la curva
    let pp, r = 7;
    if (t < GLIDE0) { pp = C; r = 7 * M.spring(0.15)(clamp((t - DOT_IN) / 0.35)); }
    else if (t < TC0) { const u = EASE.apple(clamp((t - GLIDE0) / (GLIDE1 - GLIDE0))); pp = [lerp(C[0], O[0], u), lerp(C[1], O[1], u)]; }
    else pp = [px, yC(px)];
    if (r > 0.1 && pp[1] > -20) { g.fillStyle = RED; g.beginPath(); g.arc(pp[0], pp[1], r, 0, 6.2832); g.fill(); }
    g.setTransform(1, 0, 0, 1, 0, 0);
  }

  /* ---------------- cuadro: desenfoque de movimiento cuando el zoom corre ---------------- */
  const WASH0 = TINF - 0.34;
  M.onFrame((t) => {
    if (t >= TINF - 0.004) { g = g0; renderEnd(t); return; }
    // desplazamiento en px durante el obturador (0,35 cuadro): zoom y pluma de la generación activa
    const SH = 0.35 / 60, t1 = Math.max(0, t - SH);
    const zoomPx = (zAt(t) - zAt(t1)) * 0.916 * 1100;
    const { n } = cycleAt(t);
    const penPx = n >= 0 ? (DAt(n, t) - DAt(n, t1)) / 0.42 * S ** (n - zAt(t)) : 0;
    const N = clamp(Math.ceil(Math.max(zoomPx, penPx) / 9), 1, 5);
    if (N === 1) { g = g0; renderRush(t); }
    else {
      // muestras con peso decreciente hacia atrás (0,55ⁱ): la más reciente domina
      const w = []; for (let i = 0; i < N; i++) w.push(0.55 ** i);
      for (let i = N - 1; i >= 0; i--) {
        let tail = 0; for (let j = i; j < N; j++) tail += w[j];
        g = gb; renderRush(t - (i / N) * SH);
        g0.globalAlpha = w[i] / tail; g0.drawImage(buf, 0, 0); g0.globalAlpha = 1;
      }
      g = g0;
    }
    // el límite: todo se lava hacia el papel y queda la pluma
    const wa = EASE.appleIn(clamp((t - WASH0) / (TINF - WASH0)));
    if (wa > 0) { g0.globalAlpha = wa; g0.fillStyle = PAPER; g0.fillRect(0, 0, 1920, 1080); g0.globalAlpha = 1; }
    if (t > DOT_IN) { g0.fillStyle = RED; g0.beginPath(); g0.arc(C[0], C[1], 7 * M.spring(0.15)(clamp((t - DOT_IN) / 0.35)), 0, 6.2832); g0.fill(); }
  });

  // chequeo geométrico (para depurar): codos fuera de la hoja
  window.__a02 = () => {
    const bad = [];
    for (let k = 1; k <= 4; k++) {
      const P = planFor(k);
      P.arms.forEach((arm, j) => { for (let D = 0; D <= arm.D; D += 6) { const { p } = penAt(arm, D); const e = ik(arm.A, p); if (inset(e) < 12) bad.push([k, j, Math.round(D), Math.round(inset(e)), p.map(Math.round), e.map(Math.round)]); } });
    }
    return { bad: bad.length, sample: bad.filter((b, i) => i % 25 === 0), Dmax: [1, 2, 3, 4].map((k) => Math.round(planFor(k).Dmax)) };
  };

  // fundido final al papel
  tl.to('#fade', { opacity: 1, duration: 0.55, ease: 'appleIn' }, 13.35);
  tl.set({}, {}, 14);

  /* ---------------- sonido ---------------- */
  M.sfx(0.22, 'grow', { dur: 1.0, density: 70, bright: 0.8, gain: -8 });            // el tablero se dibuja
  // ciclos: pluma que baja (tick) + trazo (grow) + copia terminada (tap que sube por la escala)
  M.sfx(T0 + 0.1, 'tick', { gain: -2 });
  M.sfx(T0 + 0.2, 'grow', { dur: 1.6, density: 60, bright: 0.75, gain: -6 });
  M.sfx(Tn(1) + 0.02, 'tick', { gain: -3 });
  M.sfx(Tn(1) + 0.1, 'grow', { dur: 0.9, density: 80, bright: 0.8, gain: -8 });
  for (let n = 0; n < 13; n++) {
    const tDone = Tn(n) + dWin(n)[1] * cyc(n);
    if (tDone > TINF - 0.012) break;
    if (n <= 6) M.sfx(tDone, 'tap', { deg: n, oct: 5, bright: 0.75, gain: n < 2 ? -2 : -4, vary: 0.4 });
    else M.sfx(tDone, 'tick', { tone: 'glass', gain: -5 - (n - 7) });
  }
  M.sfx(Tn(0) + zStart(0) * cyc(0), 'whoosh', { dur: (1 - zStart(0)) * cyc(0), peak: 0.5, dir: 1, gain: -4 });
  M.sfx(Tn(1) + zStart(1) * cyc(1), 'whoosh', { dur: (1 - zStart(1)) * cyc(1), peak: 0.5, dir: -1, gain: -7 });
  M.sfx(TINF, 'riser', { dur: 3.0, semis: 12, gain: -2 });                            // corta en el límite…
  M.sfx(TINF, 'tap', { deg: 4, oct: 6, bright: 0.6, gain: -10 });                     // …con el punto rojo
  M.sfx(GLIDE0, 'whoosh', { dur: GLIDE1 - GLIDE0, peak: 0.5, dir: -1, gain: -9 });
  [0, 1, 2, 4, 5, 6].forEach((deg, n) => M.sfx(tMk(n), 'tap', { deg, oct: 5, bright: 0.7, gain: -5 - n, vary: 0.3 }));
  M.sfx(TC1, 'swell', { dur: 1.1, gain: -2 }).sfx(TC1, 'impact', { weight: 0.85 });
});
</script>
