<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>H02 · Psilocibina → psilocina (3D)</title>
<link rel="stylesheet" href="../lib/theme.css">
<link rel="stylesheet" href="../lib/fonts-spartan.css">
<script type="importmap">{ "imports": { "three": "../node_modules/three/build/three.module.js", "three/addons/": "../node_modules/three/examples/jsm/" } }</script>
<style>
  /* Guion de color (v3): base cálida terrosa; UN acento frío = azul psilocibina, solo para lo activo (psilocina) y el núcleo común. */
  :root { --bone: #F3EDE2; --caramel: #E3A560; --blue: #8FB0FF; }
  body { background: #060504; }
  #gl { position: absolute; inset: 0; }
  #grain { position: absolute; inset: -20px; opacity: 0.06; mix-blend-mode: overlay; pointer-events: none; }
  #vig { position: absolute; inset: 0; background: radial-gradient(115% 100% at 62% 42%, transparent 50%, rgba(4,3,2,0.6) 100%); }
  .t { position: absolute; left: 140px; font-family: var(--f-display); color: var(--bone); letter-spacing: -0.035em; line-height: 1.25; white-space: nowrap; }
  #name { top: 540px; font-size: 168px; font-weight: 800; }
  #name span { display: inline-block; }
  #prima { top: 372px; font-size: 150px; }
  #prima .a { display: block; font-weight: 300; }
  #prima .b { display: block; font-weight: 800; margin-top: -30px; }
  #fade { position: absolute; inset: 0; background: #060504; opacity: 0; }
</style>
</head>
<body>
<div id="world">
  <div id="gl"></div>
  <div id="vig"></div>

  <!-- skill motion-copy: 6 palabras en toda la escena -->
  <div class="t" id="name"><span id="nA">Psiloci</span><span id="nB">bi</span><span id="nC">na</span></div>
  <div class="t" id="prima"><span class="a">Prima de la</span><span class="b">serotonina</span></div>

  <canvas id="grain" width="512" height="512" style="width:1960px;height:1120px"></canvas>
  <div id="fade"></div>
</div>

<script src="../node_modules/gsap/dist/gsap.min.js"></script>
<script src="../node_modules/gsap/dist/SplitText.min.js"></script>
<script src="../node_modules/gsap/dist/DrawSVGPlugin.min.js"></script>
<script src="../node_modules/gsap/dist/CustomEase.min.js"></script>
<script src="../lib/stage.js"></script>
<script type="module">
import { createStage3D, THREE } from '../lib/three-stage.mjs';

/* Datos (FICHA-HONGOS.md, §3 Química):
   - Psilocibina (C12H17N2O4P) → pierde el fosfato → psilocina (C12H16N2O), la molécula activa. PubChem CID 10624 y 4980; Dinis-Oliveira 2017.
   - Prima química de la serotonina: OH en la posición 4 (no en la 5) y dos metilos en el nitrógeno. PubChem CID 5202 y 4980.
   Estructuras: indol (benceno + pirrol) · psilocina 4-OH + CH2CH2N(CH3)2 en C3 · psilocibina 4-O-PO3H2 · serotonina 5-OH + CH2CH2NH2 en C3.
   Hidrógenos implícitos (modelo de bolas y varillas de átomos pesados). */

M.scene({ duration: 14, push: 0 }, async (tl, M) => {
  const $ = (s) => document.querySelector(s);

  { const g = $('#grain').getContext('2d'); const im = g.createImageData(512, 512); const rn = M.rng(3);
    for (let i = 0; i < im.data.length; i += 4) { const v = 128 + (rn() - 0.5) * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
    g.putImageData(im, 0, 0); }

  /* ---------------- escena 3D (misma luz que h01) ---------------- */
  const S = createStage3D($('#gl'), { bgTop: '#130f0c', bgBottom: '#050403', bgGlow: '#2c2017', bloom: { strength: 0.25, radius: 0.45, threshold: 0.94 }, exposure: 1.0, env: 0.2 });
  const { scene, camera } = S;
  scene.fog = new THREE.FogExp2('#090706', 0.012);

  const key = new THREE.DirectionalLight('#ffdcae', 2.1); key.position.set(-12, 13.5, 12); key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 5; key.shadow.bias = -0.0005; key.shadow.normalBias = 0.03;
  Object.assign(key.shadow.camera, { left: -12, right: 12, top: 12, bottom: -14, near: 1, far: 60 }); key.shadow.camera.updateProjectionMatrix();
  scene.add(key); scene.add(key.target);
  const rim = new THREE.DirectionalLight('#7fa2ff', 2.0); rim.position.set(13, 7, -9); scene.add(rim);
  scene.add(new THREE.HemisphereLight('#3a3440', '#140d08', 0.4));
  const act = new THREE.PointLight('#7fa2ff', 0, 16, 2); act.position.set(0.5, 1.0, -5.5); scene.add(act);

  /* ---------------- geometría molecular (Å, coordenadas 2D estándar + leve Z) ---------------- */
  const V = (x, y, z = 0) => new THREE.Vector3(x, y, z);
  const dir = (deg, len, z = 0) => { const a = deg * Math.PI / 180, l = Math.sqrt(Math.max(0, len * len - z * z)); return V(Math.cos(a) * l, Math.sin(a) * l, z); };
  // indol: hexágono (benceno) y pentágono (pirrol) regulares que comparten el enlace C3a–C7a
  const b = 1.40, hh = b * Math.sqrt(3) / 2, Rp = b / (2 * Math.sin(Math.PI / 5)), ap = Rp * Math.cos(Math.PI / 5);
  const HEXC = V(-hh, 0), PENC = V(ap, 0);
  const pen = (deg) => V(ap + Rp * Math.cos(deg * Math.PI / 180), Rp * Math.sin(deg * Math.PI / 180));
  const RING = { C3a: V(0, b / 2), C4: V(-hh, b), C5: V(-2 * hh, b / 2), C6: V(-2 * hh, -b / 2), C7: V(-hh, -b), C7a: V(0, -b / 2), N1: pen(-72), C2: pen(0), C3: pen(72) };
  // Kekulé: C2=C3, C3a=C7a, C4=C5, C6=C7
  const RING_BONDS = [['C3a', 'C4', 1], ['C4', 'C5', 2], ['C5', 'C6', 1], ['C6', 'C7', 2], ['C7', 'C7a', 1], ['C7a', 'C3a', 2], ['C7a', 'N1', 1], ['N1', 'C2', 1], ['C2', 'C3', 2], ['C3', 'C3a', 1]];
  const PERIM = ['C4', 'C5', 'C6', 'C7', 'C7a', 'N1', 'C2', 'C3', 'C3a'];

  function tryptamine({ phos = false, oh4 = false, oh5 = false, nMe = true }) {
    const A = [], B = [], ix = {};
    const add = (id, el, p, extra = {}) => { ix[id] = A.length; A.push({ id, el, p, ...extra }); };
    const bond = (a, c, o = 1, extra = {}) => B.push({ a: ix[a], b: ix[c], o, ...extra });
    for (const [k, p] of Object.entries(RING)) add(k, k === 'N1' ? 'N' : 'C', p.clone(), { ring: true });
    RING_BONDS.forEach(([a, c, o]) => bond(a, c, o, { ring: true }));
    // cadena etilamina en C3: CH2–CH2–N (zigzag)
    const Cb = RING.C3.clone().add(dir(72, 1.51));
    const Ca = Cb.clone().add(dir(12, 1.53, 0.3));
    const Nm = Ca.clone().add(dir(72, 1.47, -0.3));
    add('Cb', 'C', Cb); add('Ca', 'C', Ca); add('Nam', 'N', Nm);
    bond('C3', 'Cb'); bond('Cb', 'Ca'); bond('Ca', 'Nam');
    if (nMe) { add('Me1', 'C', Nm.clone().add(dir(12, 1.47, 0.55))); add('Me2', 'C', Nm.clone().add(dir(132, 1.47, -0.55))); bond('Nam', 'Me1'); bond('Nam', 'Me2'); }
    if (phos || oh4) { add('O4', 'O', RING.C4.clone().add(dir(90, 1.37))); bond('C4', 'O4'); }
    if (phos) {
      const O4 = A[ix.O4].p, P = O4.clone().add(dir(150, 1.6));
      add('P', 'P', P, { grp: 'phos' }); bond('O4', 'P', 1, { cut: true });
      // fosfato tetraédrico real: un O en el plano (P=O) y dos por delante y por detrás (P–OH)
      const u = O4.clone().sub(P).normalize(), w1 = V(-u.y, u.x, 0), w2 = V(0, 0, 1), c = -1 / 3, s = Math.sqrt(8 / 9);
      const tet = (k) => { const a = k * 2 * Math.PI / 3; return u.clone().multiplyScalar(c).addScaledVector(w1, s * Math.cos(a)).addScaledVector(w2, s * Math.sin(a)); };
      add('Pd', 'O', P.clone().addScaledVector(tet(0), 1.49), { grp: 'phos' }); bond('P', 'Pd', 2, { grp: 'phos' });
      add('Pa', 'O', P.clone().addScaledVector(tet(1), 1.57), { grp: 'phos' }); bond('P', 'Pa', 1, { grp: 'phos' });
      add('Pb', 'O', P.clone().addScaledVector(tet(2), 1.57), { grp: 'phos' }); bond('P', 'Pb', 1, { grp: 'phos' });
    }
    if (oh5) { add('O5', 'O', RING.C5.clone().add(dir(150, 1.37))); bond('C5', 'O5'); }
    return { A, B, ix };
  }

  // origen de cada molécula = centroide de la psilocina (así el núcleo indol queda alineado entre moléculas)
  const ORIGIN = V(); { const m = tryptamine({ oh4: true }); m.A.forEach((a) => ORIGIN.add(a.p)); ORIGIN.divideScalar(m.A.length); }

  // contorno del indol: polígono de 9 átomos desplazado hacia afuera (esquinas convexas redondeadas)
  function outline(pts, d) {
    const n = pts.length, out = [];
    const nrm = (a, c) => { const e = c.clone().sub(a).normalize(); return new THREE.Vector2(e.y, -e.x); };
    for (let i = 0; i < n; i++) {
      const p0 = pts[(i - 1 + n) % n], p = pts[i], p1 = pts[(i + 1) % n];
      const n0 = nrm(p0, p), n1 = nrm(p, p1);
      const cr = (p.x - p0.x) * (p1.y - p.y) - (p.y - p0.y) * (p1.x - p.x);
      if (cr > 0) { let a0 = Math.atan2(n0.y, n0.x), a1 = Math.atan2(n1.y, n1.x); if (a1 < a0) a1 += Math.PI * 2;
        for (let k = 0; k <= 6; k++) { const a = a0 + (a1 - a0) * k / 6; out.push(new THREE.Vector2(p.x + d * Math.cos(a), p.y + d * Math.sin(a))); } }
      else { const m = n0.clone().add(n1).multiplyScalar(d / (1 + n0.dot(n1))); out.push(new THREE.Vector2(p.x + m.x, p.y + m.y)); }
    }
    return out;
  }

  /* ---------------- materiales ---------------- */
  const EL = { C: { r: 0.38, c: '#b3a79a' }, N: { r: 0.39, c: '#b9c7e3' }, O: { r: 0.39, c: '#E3A560' }, P: { r: 0.5, c: '#d98a2e' } };
  const STICK = '#d6ccbf';
  const phys = (c, o = {}) => new THREE.MeshPhysicalMaterial({ color: c, roughness: 0.34, metalness: 0, clearcoat: 0.6, clearcoatRoughness: 0.25, ...o });
  // contraluz azul por material (Fresnel): la molécula "se enciende" sin teñir su color base
  const RIM_SRC = { value: new THREE.Color('#7fa2ff') };
  function withRim(mat) {
    mat.userData.rim = { value: 0 };
    mat.onBeforeCompile = (sh) => {
      sh.uniforms.uRim = mat.userData.rim; sh.uniforms.uRimCol = RIM_SRC;
      sh.fragmentShader = 'uniform float uRim;\nuniform vec3 uRimCol;\n' + sh.fragmentShader.replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
        float frz = 1.0 - clamp(dot(normalize(normal), normalize(vViewPosition)), 0.0, 1.0);
        totalEmissiveRadiance += uRimCol * uRim * pow(frz, 2.6);`);
    };
    return mat;
  }
  const sphGeo = new THREE.SphereGeometry(1, 48, 32);
  const cylGeo = new THREE.CylinderGeometry(1, 1, 1, 22, 1, false);
  const UP = V(0, 1, 0), ZL = V(0, 0, 1);
  const BLUE = new THREE.Color('#7fa2ff'), STICK_C = new THREE.Color(STICK), STICK_B = new THREE.Color('#7fa0ea');

  function buildMolecule(spec, pos) {
    const { A, B, ix } = tryptamine(spec);
    const g = new THREE.Group(); g.position.copy(pos); scene.add(g);
    const phosG = new THREE.Group(); g.add(phosG);                  // el fosfato se mueve como un bloque
    A.forEach((a) => {
      a.p.sub(ORIGIN);
      a.mat = withRim(phys(EL[a.el].c, a.el === 'P' ? { roughness: 0.3, metalness: 0.15 } : {}));
      if (a.grp === 'phos') a.mat.transparent = true;
      a.mesh = new THREE.Mesh(sphGeo, a.mat); a.mesh.position.copy(a.p); a.mesh.castShadow = a.mesh.receiveShadow = true;
      (a.grp === 'phos' ? phosG : g).add(a.mesh);
      a.show = { v: 0 };
    });
    B.forEach((bd) => {
      bd.mat = phys(STICK, { roughness: 0.4, clearcoat: 0.4 });
      if (bd.grp === 'phos' || bd.cut) bd.mat.transparent = true;
      const mk = (parent) => { const c = new THREE.Mesh(cylGeo, bd.mat); c.castShadow = c.receiveShadow = true; parent.add(c); return c; };
      bd.sticks = Array.from({ length: bd.o === 2 ? 2 : 1 }, () => mk(bd.grp === 'phos' ? phosG : g));
      if (bd.cut) bd.half = mk(phosG);                              // mitad del enlace O–P que se va con el fosfato
      bd.g = { v: 0 };
    });
    // contorno azul del núcleo indol (detrás del plano de los anillos: no toca ninguna pieza)
    const ringPts = PERIM.map((k) => { const p = A[ix[k]].p; return new THREE.Vector2(p.x, p.y); });
    const ol = outline(ringPts, 0.8);
    const curve = new THREE.CatmullRomCurve3(ol.map((p) => V(p.x, p.y, -0.55)), true, 'centripetal');
    const tubeGeo = new THREE.TubeGeometry(curve, 240, 0.045, 8, true);
    const tube = new THREE.Mesh(tubeGeo, new THREE.MeshBasicMaterial({ color: '#b3c8ff', toneMapped: false }));
    const haloGeo = new THREE.TubeGeometry(curve, 240, 0.14, 8, true);
    const halo = new THREE.Mesh(haloGeo, new THREE.MeshBasicMaterial({ color: '#7fa2ff', transparent: true, opacity: 0.13, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }));
    const fill = new THREE.Mesh(new THREE.ShapeGeometry(new THREE.Shape(ol)), new THREE.MeshBasicMaterial({ color: '#7fa2ff', transparent: true, opacity: 0, depthWrite: false, side: THREE.DoubleSide, toneMapped: false }));
    fill.position.z = -0.6;
    [tube, halo].forEach((m) => { m.geometry.setDrawRange(0, 0); g.add(m); }); g.add(fill);
    return { A, B, ix, g, phosG, at: (id) => A[ix[id]], contour: { v: 0, total: tubeGeo.index.count, tube, halo, fill }, glow: { v: 0 }, core: { v: 0 } };
  }

  const heavyBFS = (m, root) => {
    const depth = new Map([[m.ix[root], 0]]), q = [m.ix[root]];
    while (q.length) { const i = q.shift(); m.B.forEach((bd) => { const j = bd.a === i ? bd.b : bd.b === i ? bd.a : -1; if (j >= 0 && !depth.has(j)) { depth.set(j, depth.get(i) + 1); q.push(j); } }); }
    return depth;
  };
  // construcción: los átomos aparecen en orden de enlaces desde C7a; cada varilla crece desde un átomo ya visible
  function grow(m, t0, dt) {
    const dep = heavyBFS(m, 'C7a');
    m.A.forEach((a, i) => tl.to(a.show, { v: 1, duration: 0.36, ease: M.spring(0.1) }, t0 + dep.get(i) * dt));
    m.B.forEach((bd) => { if (dep.get(bd.a) > dep.get(bd.b)) [bd.a, bd.b] = [bd.b, bd.a];
      tl.to(bd.g, { v: 1, duration: dt, ease: 'none' }, t0 + dep.get(bd.a) * dt + 0.07); });   // sale de un átomo ya visible y llega cuando aparece el siguiente
    return dep;
  }

  const mA = buildMolecule({ phos: true }, V(0, 0, 0));
  const mB = buildMolecule({ oh5: true, nMe: false }, V(3.0, -5.6, 0));   // en diagonal, sin tocarse

  /* ---------------- beat 1: psilocibina se arma y rota ---------------- */
  grow(mA, 0.2, 0.12);

  /* ---------------- beat 2: pierde el fosfato → psilocina (activa, azul) ---------------- */
  const T_CUT = 5.0;
  const cutB = mA.B.find((bd) => bd.cut); cutB.k = { v: 0 };
  const phos = { d: 0, rot: 0, fade: 1 };
  tl.to(cutB.k, { v: 1, duration: 0.5, ease: 'appleOut' }, T_CUT);
  tl.to(phos, { d: 9, rot: 1.1, duration: 2.3, ease: 'power2.in' }, T_CUT + 0.05);
  tl.to(phos, { fade: 0, duration: 0.8, ease: 'appleIn' }, T_CUT + 1.4);
  const P0 = mA.at('P').p.clone(), phosDir = V(-0.55, 0.45, -0.7).normalize(), phosAxis = V(0.3, 0.2, 0.93).normalize();
  // destello cálido en los dos átomos del enlace que se corta (sin piezas sueltas)
  const flash = { v: 0 }; tl.to(flash, { v: 1, duration: 0.14, ease: 'appleOut' }, T_CUT); tl.to(flash, { v: 0, duration: 0.6, ease: 'appleIn' }, T_CUT + 0.14);
  const WARM = new THREE.Color('#ffb46a');
  // onda de activación desde el O4 recién liberado
  const depAct = heavyBFS(mA, 'O4'); let maxD = 0; depAct.forEach((v, i) => { if (mA.A[i].grp !== 'phos') maxD = Math.max(maxD, v); });
  const wave = { w: 0 };
  tl.to(wave, { w: 1, duration: 1.3, ease: 'apple' }, T_CUT + 0.7);
  tl.to(mA.glow, { v: 1, duration: 1.3, ease: 'apple' }, T_CUT + 0.7);
  tl.to(act, { intensity: 30, duration: 1.4, ease: 'apple' }, T_CUT + 0.8);
  
  /* ---------------- beat 3: junto a la serotonina, núcleo indol común ---------------- */
  const T3 = 8.95;
  tl.to(mA.glow, { v: 0, duration: 1.0, ease: 'apple' }, T3);
  tl.to(act, { intensity: 0, duration: 1.0, ease: 'apple' }, T3);
  grow(mB, T3 + 0.35, 0.1);
  const T_CORE = T3 + 1.4;
  [mA, mB].forEach((m) => {
    tl.to(m.contour, { v: 1, duration: 1.15, ease: 'apple' }, T_CORE);
    tl.to(m.core, { v: 1, duration: 0.9, ease: 'apple' }, T_CORE + 0.2);
  });

  // rotación lenta (misma orientación para las dos moléculas)
  const spin = { a: -0.5 };
  tl.to(spin, { a: 0.1, duration: T3, ease: 'none' }, 0);
  tl.to(spin, { a: -0.28, duration: 1.4, ease: 'apple' }, T3);
  tl.to(spin, { a: 0.02, duration: 3.5, ease: 'none' }, T3 + 1.4);

  /* ---------------- cámara ---------------- */
  const cam = { ang: -0.1, el: 0.16, rad: 23.6, lx: 0.4, ly: 0.75, lz: 0, shift: -420 };
  tl.to(cam, { ang: 0.04, rad: 22.6, duration: 4.8, ease: 'apple' }, 0);
  tl.to(cam, { ang: 0.1, rad: 21.4, lx: 0.9, ly: 0.45, duration: 2.6, ease: 'apple' }, 4.8);
  tl.to(cam, { ang: 0.14, rad: 21.0, duration: T3 - 7.4, ease: 'none' }, 7.4);
  tl.to(cam, { ang: 0, el: 0.1, rad: 37, lx: 0.7, ly: -2.15, shift: -334, duration: 1.7, ease: 'apple' }, T3);
  tl.to(cam, { rad: 36, duration: 3.2, ease: 'none' }, T3 + 1.7);

  /* ---------------- texto (skill motion-copy: 6 palabras en total) ---------------- */
  const nA = M.textIn($('#nA'), 0.9, { dur: 1.0, stagger: 0.035, ease: 'appleOut' });
  const nB = M.textIn($('#nB'), 0.9 + 7 * 0.035, { dur: 1.0, stagger: 0.035, ease: 'appleOut' });
  const nC = M.textIn($('#nC'), 0.9 + 9 * 0.035, { dur: 1.0, stagger: 0.035, ease: 'appleOut' });
  // "bi" se tiñe del color del fosfato, se va con él; "na" cierra el hueco y la palabra se vuelve azul
  tl.to('#nB', { color: '#E3A560', duration: 0.35, ease: 'apple' }, T_CUT - 0.45);
  M.textOut(nB, T_CUT + 0.1, { stagger: 0.04, dur: 0.45 });
  const wB = $('#nB').getBoundingClientRect().width;
  tl.to('#nC', { x: -wB, duration: 0.8, ease: 'apple' }, T_CUT + 0.22);
  tl.to(['#nA', '#nC'], { color: '#8FB0FF', duration: 0.9, ease: 'apple' }, T_CUT + 0.75);
  M.textOut(nA, T3 - 0.2, { stagger: 0.015 }); M.textOut(nC, T3 - 0.2 + 7 * 0.015, { stagger: 0.015 });

  const pA = M.textIn($('#prima .a'), T3 + 0.8, { type: 'words', dur: 0.8, stagger: 0.06, ease: 'appleOut' });
  const pB = M.textIn($('#prima .b'), T3 + 1.05, { dur: 0.9, stagger: 0.03, ease: 'appleOut' });
  M.textOut(pA, 13.05, { type: 'words', stagger: 0.02 }); M.textOut(pB, 13.1, { stagger: 0.012 });
  tl.to('#fade', { opacity: 1, duration: 0.55, ease: 'appleIn' }, 13.3);

  /* ---------------- por cuadro ---------------- */
  const qP = new THREE.Quaternion(), dv = V(), side = V(), tmp = V(), e0 = V(), e1 = V();
  const setStick = (c, p0, p1, r, off) => {
    dv.subVectors(p1, p0); const len = dv.length();
    if (len < 1e-3) { c.visible = false; return; }
    dv.divideScalar(len); side.crossVectors(dv, ZL); if (side.lengthSq() < 1e-4) side.set(1, 0, 0); side.normalize();
    c.visible = true; c.position.copy(p0).add(p1).multiplyScalar(0.5).addScaledVector(side, off);
    c.quaternion.setFromUnitVectors(UP, dv); c.scale.set(r, len, r);
  };
  function update(m) {
    const inPhos = m === mA;
    // fosfato: se separa como bloque, gira y se aleja hacia la oscuridad
    if (inPhos) {
      qP.setFromAxisAngle(phosAxis, phos.rot);
      m.phosG.quaternion.copy(qP);
      m.phosG.position.copy(P0).addScaledVector(phosDir, phos.d).sub(tmp.copy(P0).applyQuaternion(qP));
    }
    const glow = m.glow.v, core = m.core.v, w = wave.w * (maxD + 1.5);
    m.A.forEach((a, i) => {
      const s = EL[a.el].r * a.show.v;
      a.mesh.scale.setScalar(Math.max(1e-4, s)); a.mesh.visible = s > 1e-3 && !(a.grp === 'phos' && phos.fade < 0.01);
      if (a.id === 'O4' || a.id === 'P') { a.mat.emissive.copy(WARM); a.mat.emissiveIntensity = 0.9 * flash.v; }
      if (a.grp === 'phos') { a.mat.opacity = phos.fade; a.mat.depthWrite = phos.fade > 0.99; return; }
      // azul: onda (psilocina activa) + núcleo común (beat 3)
      let e = 0;
      if (inPhos) { const x = w - depAct.get(i); e = glow * Math.min(1, Math.max(0, x)) * (1.3 + 1.0 * Math.exp(-x * x * 1.2)) * (a.el === 'N' ? 0.6 : 1); }
      if (a.ring) e = Math.max(e, 1.1 * core);
      a.mat.userData.rim.value = e;
    });
    m.B.forEach((bd) => {
      const A0 = m.A[bd.a], A1 = m.A[bd.b], g = bd.g.v;
      const dbl = bd.o === 2, r = dbl ? 0.068 : 0.1, off = dbl ? 0.12 : 0;
      if (bd.grp === 'phos') { bd.mat.opacity = phos.fade; bd.mat.depthWrite = phos.fade > 0.99; }
      e0.copy(A0.p); e1.copy(A0.p).lerp(A1.p, g);
      if (bd.cut) {
        const k = bd.k.v, h = 0.5 * (1 - k);
        bd.mat.opacity = 1; bd.half.material = bd.mat;
        if (k <= 0) { bd.sticks.forEach((c) => setStick(c, e0, e1, r, 0)); bd.half.visible = false; }
        else {
          // mitad que queda en el O4 y mitad que se lleva el fosfato; ambas se retraen dentro de su átomo
          tmp.copy(A0.p).lerp(A1.p, h); setStick(bd.sticks[0], A0.p, tmp, r, 0); if (h < 0.2) bd.sticks[0].visible = false;
          tmp.copy(A1.p).lerp(A0.p, h); setStick(bd.half, A1.p, tmp, r, 0); if (h < 0.2 || phos.fade < 0.01) bd.half.visible = false;
        }
        return;
      }
      if (g < 0.002 || (bd.grp === 'phos' && phos.fade < 0.01)) { bd.sticks.forEach((c) => (c.visible = false)); return; }
      bd.sticks.forEach((c, j) => setStick(c, e0, e1, r, dbl ? (j ? off : -off) : 0));
      if (bd.grp === 'phos') return;
      let e = 0;
      if (inPhos) { const x = w - Math.max(depAct.get(bd.a), depAct.get(bd.b)); e = glow * Math.min(1, Math.max(0, x)) * (0.45 + 0.7 * Math.exp(-x * x * 1.2)); }
      if (A0.ring && A1.ring) e = Math.max(e, 0.5 * core);
      bd.mat.color.copy(STICK_C).lerp(STICK_B, Math.min(1, e / 0.45)); bd.mat.emissive.copy(BLUE); bd.mat.emissiveIntensity = e * 0.5;
    });
    // contorno que se dibuja
    const c = m.contour, n = Math.floor(c.total * c.v / 3) * 3;
    c.tube.geometry.setDrawRange(0, n); c.halo.geometry.setDrawRange(0, n);
    c.fill.material.opacity = 0.035 * core;
    m.g.rotation.y = spin.a;
  }

  M.onFrame(() => {
    update(mA); update(mB);
    camera.position.set(cam.lx + Math.sin(cam.ang) * Math.cos(cam.el) * cam.rad, cam.ly + Math.sin(cam.el) * cam.rad, cam.lz + Math.cos(cam.ang) * Math.cos(cam.el) * cam.rad);
    camera.lookAt(cam.lx, cam.ly, cam.lz);
    camera.setViewOffset(1920, 1080, cam.shift, 0, 1920, 1080);
    S.render();
  });

});
