<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>H03 · Receptor 5-HT2A (3D)</title>
<link rel="stylesheet" href="../lib/theme.css">
<link rel="stylesheet" href="../lib/fonts-spartan.css">
<script type="importmap">{ "imports": { "three": "../node_modules/three/build/three.module.js", "three/addons/": "../node_modules/three/examples/jsm/" } }</script>
<style>
  /* Guion de color (v3): cálido terroso para lo orgánico (neurona, membrana, receptor en reposo);
     UN acento frío, azul psilocibina, solo para la psilocina y lo activo. El caramelo es solo de la neurona. */
  :root { --bone: #F3EDE2; --caramel: #E3A560; --blue: #8FB0FF; --dim: rgba(243,237,226,0.66); }
  body { background: #060504; }
  #gl { position: absolute; inset: 0; }
  #grain { position: absolute; inset: -20px; opacity: 0.06; mix-blend-mode: overlay; pointer-events: none; }
  #vig { position: absolute; inset: 0; background: radial-gradient(115% 100% at 62% 42%, transparent 50%, rgba(4,3,2,0.6) 100%); }
  .t { position: absolute; left: 140px; font-family: var(--f-display); color: var(--bone); letter-spacing: -0.035em; line-height: 1.2; white-space: nowrap; }
  #title { top: 668px; }
  #title .a { display: block; font-size: 128px; font-weight: 300; color: var(--dim); letter-spacing: -0.02em; }
  #title .b { display: block; font-size: 200px; font-weight: 800; margin-top: -44px; }
  #title .sb { font-size: 0.56em; font-weight: 700; letter-spacing: -0.02em; margin-left: 0.03em; position: relative; top: 0.14em; }
  #l2 { top: 736px; font-size: 112px; font-weight: 700; }
  #l2 em { font-style: normal; color: var(--blue); }
  #num { top: 150px; font-size: 330px; font-weight: 900; letter-spacing: -0.055em; line-height: 1.05; }
  #num .h { display: block; font-size: 110px; font-weight: 300; color: var(--dim); letter-spacing: -0.02em; line-height: 1.2; margin-bottom: -18px; }
  #num .n { display: block; }
  #num .p { color: var(--blue); font-weight: 600; margin-left: 0.12em; }
  #numL { top: 690px; line-height: 1.3; font-family: var(--f-body); font-size: 48px; font-weight: 500; letter-spacing: -0.01em; color: var(--dim); }
  #fade { position: absolute; inset: 0; background: #060504; opacity: 0; }
</style>
</head>
<body>
<div id="world">
  <div id="gl"></div>
  <div id="vig"></div>

  <div class="t" id="title"><span class="a">Receptor</span><span class="b">5-HT<span class="sb">2A</span></span></div>
  <div class="t" id="l2">Encaja como<br>una <em>llave</em></div>
  <div class="t" id="num"><span class="h">hasta</span><span class="n"><span id="numV">4</span><span class="p">%</span></span></div>
  <div class="t" id="numL">de los receptores ocupados</div>

  <canvas id="grain" width="512" height="512" style="width:1960px;height:1120px"></canvas>
  <div id="fade"></div>
</div>

<script src="../node_modules/gsap/dist/gsap.min.js"></script>
<script src="../node_modules/gsap/dist/SplitText.min.js"></script>
<script src="../node_modules/gsap/dist/DrawSVGPlugin.min.js"></script>
<script src="../node_modules/gsap/dist/CustomEase.min.js"></script>
<script src="../lib/stage.js"></script>
<script src="../lib/audio.js"></script>
<script type="module">
import { createStage3D, THREE, fbm } from '../lib/three-stage.mjs';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';
import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';

// Dato verificado (FICHA-HONGOS.md §4): "La psilocina activa el receptor 5-HT2A: en PET, hasta un 72 % de ocupación,
// que siguió la intensidad de la experiencia." — Madsen et al. 2019, Neuropsychopharmacology, PMID 30685771.
// Es el máximo (dosis más altas): por eso "hasta" en pantalla.
const OCC = 72;
const N_REC = 25;                              // receptores en la muestra de membrana
const N_OCC = Math.round(N_REC * OCC / 100);   // 18 ocupados → 18/25 = 72 %

M.scene({ duration: 15, push: 0, audio: { key: 'D', mode: 'lydian', bed: { cycle: 9, bright: 0.9 } } }, async (tl, M) => {
  const $ = (s) => document.querySelector(s);
  const DEBUG = new URLSearchParams(location.search).has('debug');
  const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
  const clamp01 = (x) => Math.min(1, Math.max(0, x));
  const sstep = (a, b, x) => { const k = clamp01((x - a) / (b - a)); return k * k * (3 - 2 * k); };
  const UP = V(0, 1, 0);

  { const g = $('#grain').getContext('2d'); const im = g.createImageData(512, 512); const rn = M.rng(3);
    for (let i = 0; i < im.data.length; i += 4) { const v = 128 + (rn() - 0.5) * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
    g.putImageData(im, 0, 0); }

  /* ---------------- escenario (misma luz y atmósfera que h01) ---------------- */
  const S = createStage3D($('#gl'), { bgTop: '#130f0c', bgBottom: '#050403', bgGlow: '#2c2017', bloom: { strength: 0.25, radius: 0.45, threshold: 0.94 }, exposure: 1.0, env: 0.2 });
  const { scene, camera, dome, renderer } = S;
  renderer.localClippingEnabled = true;
  // el entorno (reflejos suaves, igual que h01) solo en los protagonistas: en software, muestrearlo en cada píxel cuesta el doble
  const ENV = scene.environment; scene.environment = null;
  const withEnv = (m) => { m.envMap = ENV; m.envMapIntensity = 0.2; return m; };
  // niebla lineal relativa a la cámara: el protagonista queda limpio y las filas del fondo se pierden en lo oscuro
  scene.fog = new THREE.Fog('#090706', 10, 30);
  const fogS = { span: 8 };
  // clave cálida lateral, contraluz FRÍO, hemisférica tenue. Direcciones fijas respecto de la cámara
  // (la cámara pasa de mirar la neurona de frente a mirar la membrana de costado).
  const key = new THREE.DirectionalLight('#ffdcae', 2.1); key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 5; key.shadow.bias = -0.0004;
  const rim = new THREE.DirectionalLight('#7fa2ff', 1.5);
  const hemi = new THREE.HemisphereLight('#3a3440', '#140d08', 0.4);
  scene.add(key, key.target, rim, rim.target, hemi);
  const KEY_L = V(-4, 4.5, 4).normalize(), RIM_L = V(3.5, 3, -4).normalize();
  const BLUE = new THREE.Color('#7fa2ff');          // acento (luz, lo activo)
  const CYAN = new THREE.Color('#86c0ff');          // emisión del pulso: sumada a la luz cálida tira a blanco frío, no a magenta
  const COOL = new THREE.Color('#c9d0dc');          // paso intermedio hueso → azul (gris frío, sin pasar por malva)
  const mix3 = (out, base, a) => (a < 0.5 ? out.copy(base).lerp(COOL, a * 2) : out.copy(COOL).lerp(BLUE, a * 2 - 1));

  /* ======================= MEMBRANA (unidades de mundo) ======================= */
  const BW = 16, BD = 16, HXW = BW / 2, HZ = BD / 2;        // muestra de membrana (bandeja)
  const HEAD = 0.17, SP = 0.36, YT = 0.78, YB = -0.78;       // cabezas lipídicas (dos capas)
  const YTOP = YT + HEAD;
  const NR = 1.25, NR_H = 1.2;                                // radio libre de lípidos (fondo / protagonista: los lípidos lo tocan)
  const HERO_Z = HZ - 2.1;                                    // el protagonista vive DENTRO de la bicapa, en la primera fila
  const CUT0 = HERO_Z + 0.12;                                 // corte de la muestra: pasa por el centro del protagonista
  const cut = { z: CUT0 };
  const cutPlane = new THREE.Plane(V(0, 0, -1), CUT0);        // conserva z ≤ cut (solo lípidos y núcleo; nunca el receptor)

  // 25 receptores: el protagonista (fila de adelante, en el corte) + 24 en la membrana
  const rl = M.rng(7);
  const RECS = [{ x: 0, z: HERO_Z, hero: true, rot: 0, seed: 1, row: 0, col: 2, nr: NR_H }];
  const COLS = [-6.2, -3.1, 0, 3.1, 6.2], ROWS = [4.6, 2.0, -0.6, -3.2, -5.8];
  ROWS.forEach((z, j) => COLS.forEach((x, i) => {
    if (j === 0 && i === 2) return;
    RECS.push({ x: x + (rl() - 0.5) * 0.3, z: z + (rl() - 0.5) * 0.24, hero: false, rot: rl() * 6.283, seed: 10 + j * 5 + i, row: j, col: i, nr: NR });
  }));
  // 7 vacíos repartidos → 18 ocupados de 25 (72 %)
  const EMPTY = new Set(['0:3', '1:0', '1:3', '2:2', '3:1', '3:4', '4:1']);
  RECS.forEach((q) => (q.occ = q.hero || !EMPTY.has(q.row + ':' + q.col)));
  if (RECS.filter((q) => q.occ).length !== N_OCC) console.error('ocupación mal armada');

  /* ---------------- receptor: 7 hélices transmembrana (cilindros limpios) + asas ---------------- */
  const HXR = 0.21, PITCH = 0.5;
  const A0 = Math.PI / 2 - 5 * (2 * Math.PI / 7);            // TM6 (índice 5) mira hacia +z
  const Y_CUT = -0.72;                                        // receptores del fondo: terminan dentro de la bicapa (no se ve nada colgando)
  function recSpec(seed, full) {
    const rr = M.rng(seed * 97 + 3);
    return Array.from({ length: 7 }, (_, i) => {
      const a = A0 + i * 2 * Math.PI / 7 + (rr() - 0.5) * 0.1;
      const R = 0.75 + rr() * 0.04;
      const rho = V(Math.cos(a), 0, Math.sin(a)), tan = V(-Math.sin(a), 0, Math.cos(a));
      let c = rho.clone().multiplyScalar(R).setY((rr() - 0.5) * 0.12);
      let L = 2.85 + rr() * 0.25;
      // haz levemente torcido (hiperboloide): las hélices no se cruzan y el vestíbulo superior queda abierto
      const dir = UP.clone().addScaledVector(tan, 0.2 + rr() * 0.05).addScaledVector(rho, 0.02).normalize();
      const top = c.clone().addScaledVector(dir, L / 2);
      let bot = c.clone().addScaledVector(dir, -L / 2);
      if (!full) { bot = top.clone().addScaledVector(dir, -(top.y - Y_CUT) / dir.y); L = top.distanceTo(bot); c = top.clone().add(bot).multiplyScalar(0.5); }
      return { a, R, rho, tan, c, L, dir, top, bot };
    });
  }
  function helixGeo(L, segR, segH) {
    let g = new THREE.CapsuleGeometry(HXR, L, 5, segR, segH);
    g.deleteAttribute('uv'); g.deleteAttribute('normal'); g = mergeVertices(g);
    const p = g.attributes.position;
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
      const w = 1 - sstep(L / 2 - 0.14, L / 2 + 0.02, Math.abs(y));
      const k = 1 + 0.015 * w * Math.sin(Math.atan2(z, x) + 2 * Math.PI * y / PITCH);   // surco helicoidal apenas insinuado
      p.setXYZ(i, x * k, y, z * k);
    }
    g.computeVertexNormals();
    return g;
  }
  const qFromDir = (d) => new THREE.Quaternion().setFromUnitVectors(UP, d);
  function loopCurve(A, B, s, h, out) {
    const mid = A.clone().add(B).multiplyScalar(0.5), ro = V(mid.x, 0, mid.z).normalize(), up = V(0, s, 0);
    return new THREE.CatmullRomCurve3([A.clone(), A.clone().addScaledVector(up, h * 0.55).addScaledVector(ro, out * 0.3),
      mid.clone().addScaledVector(up, h).addScaledVector(ro, out), B.clone().addScaledVector(up, h * 0.55).addScaledVector(ro, out * 0.3), B.clone()], false, 'centripetal');
  }
  function termCurve(A, s, ro, tn) {
    const up = V(0, s, 0);
    return new THREE.CatmullRomCurve3([A.clone(), A.clone().addScaledVector(up, 0.3).addScaledVector(ro, 0.12), A.clone().addScaledVector(up, 0.46).addScaledVector(ro, 0.42).addScaledVector(tn, 0.12),
      A.clone().addScaledVector(up, 0.4).addScaledVector(ro, 0.72).addScaledVector(tn, 0.3)], false, 'centripetal');
  }
  // tubo con radio variable; flare > 0 ensancha la raíz (la rama nace como un cono que se funde con el soma)
  function taperTubeGeo(curve, r0, r1, segs, radial, flare = 0, len = 1) {
    const geo = new THREE.TubeGeometry(curve, segs, 1, radial, false);
    const pos = geo.attributes.position, c = V(), v = V();
    for (let i = 0; i <= segs; i++) { const u = i / segs; curve.getPointAt(u, c);
      const rad = (r0 + (r1 - r0) * Math.pow(u, 0.85)) * (1 + flare * Math.exp(-u * len / 0.06));
      for (let j = 0; j <= radial; j++) { const k = i * (radial + 1) + j; v.fromBufferAttribute(pos, k).sub(c).multiplyScalar(rad).add(c); pos.setXYZ(k, v.x, v.y, v.z); } }
    geo.deleteAttribute('uv'); geo.computeVertexNormals();
    return geo;
  }
  const LOOPS_EC = [[1, 2], [3, 4], [5, 6]], LOOPS_IC = [[0, 1], [2, 3], [4, 5]];
  function loopDefs(H, full) {
    const L = [];
    LOOPS_EC.forEach(([i, j]) => L.push({ i, j, s: 1, h: j === 4 ? 0.34 : 0.27, out: 0.18 }));
    if (full) LOOPS_IC.forEach(([i, j]) => L.push({ i, j, s: -1, h: i === 4 ? 0.55 : 0.34, out: 0.26 }));
    return L.map((d) => ({ ...d, curve: loopCurve(d.s > 0 ? H[d.i].top : H[d.i].bot, d.s > 0 ? H[d.j].top : H[d.j].bot, d.s, d.h, d.out) }));
  }
  // extremos: C (intracelular, desde TM7) y N (extracelular, desde TM1) → topología 7TM completa
  const C_DIR = V(-1, 0, -0.35).normalize();                  // la cola C va hacia atrás: en el plano general la tapa la bandeja
  const termDefs = (H) => [{ curve: termCurve(H[6].bot, -1, C_DIR, V(0, 0, -1)), end: 0.035 },
    { curve: termCurve(H[0].top, 1, H[0].rho, H[0].tan), end: 0.035 }];
  const LOOP_R = 0.075, LOOP_R_BG = 0.045;                    // asas finas en el fondo: no forman un campo de grampas
  function receptorGeos(H, detail) {
    const segR = detail ? 28 : 12, segH = detail ? 64 : 18, ts = detail ? 44 : 18, tr = detail ? 10 : 6, lr = detail ? LOOP_R : LOOP_R_BG;
    const hel = H.map((h) => helixGeo(h.L, segR, segH));
    const loops = loopDefs(H, detail).map((d) => ({ ...d, geo: new THREE.TubeGeometry(d.curve, ts, lr, tr, false) }));
    loops.forEach((l) => l.geo.deleteAttribute('uv'));
    const terms = (detail ? termDefs(H) : []).map((d) => { const g = taperTubeGeo(d.curve, LOOP_R, d.end, ts, tr); const cap = new THREE.SphereGeometry(d.end, 8, 6); cap.deleteAttribute('uv'); cap.translate(...d.curve.getPointAt(1).toArray()); return [g, cap]; }).flat();
    return { hel, loops, terms };
  }

  // protagonista: hueso (valor medio-alto) + filo frío propio (Fresnel) + pulso al activarse.
  // Activación: hueso → gris frío → azul (nunca pasa por malva) y emisión cian.
  const U = { uPulse: { value: 3.0 }, uPA: { value: 0 }, uGlow: { value: 0 }, uAct: { value: 0 }, uRim: { value: 0.32 },
    uPulseC: { value: CYAN.clone() }, uGlowC: { value: BLUE.clone() }, uTint: { value: BLUE.clone() }, uCool: { value: COOL.clone() }, uRimC: { value: CYAN.clone() } };
  function makeHeroMat(extra = {}) {
    const m = withEnv(new THREE.MeshPhysicalMaterial({ color: '#d8c2a2', roughness: 0.42, clearcoat: 0.3, clearcoatRoughness: 0.35, ...extra }));
    m.onBeforeCompile = (sh) => {
      Object.assign(sh.uniforms, U);
      sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying float vWY;')
        .replace('#include <begin_vertex>', '#include <begin_vertex>\nvWY = (modelMatrix * vec4(transformed, 1.0)).y;');
      sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nvarying float vWY; uniform float uPulse; uniform float uPA; uniform float uGlow; uniform float uAct; uniform float uRim; uniform vec3 uPulseC; uniform vec3 uGlowC; uniform vec3 uTint; uniform vec3 uCool; uniform vec3 uRimC;')
        .replace('#include <color_fragment>', '#include <color_fragment>\ndiffuseColor.rgb = uAct < 0.5 ? mix(diffuseColor.rgb, uCool, uAct * 2.0) : mix(uCool, uTint, uAct * 2.0 - 1.0);')
        .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
          float frz = 1.0 - clamp(dot(normalize(normal), normalize(vViewPosition)), 0.0, 1.0);
          totalEmissiveRadiance += uRimC * uRim * pow(frz, 2.6);
          totalEmissiveRadiance += uGlowC * uGlow + uPulseC * uPA * 1.3 * exp(-pow((vWY - uPulse) / 0.32, 2.0));`);
    };
    m.customProgramCacheKey = () => 'h03-hero';
    return m;
  }
  // plano general: con la cámara arriba, la parte intracelular del protagonista se recorta como la de los demás (Y_CUT),
  // así no se asoma nada por las rendijas de la bandeja. Antes de eso el plano no corta nada.
  const heroClip = new THREE.Plane(V(0, 1, 0), 50);
  const heroMat = makeHeroMat({ clippingPlanes: [heroClip] });
  const ghostMat = makeHeroMat({ transparent: true, opacity: 1, depthWrite: false, clippingPlanes: [heroClip] });   // TM5/TM6 translúcidas: se ve la llave entrar
  const REC_BG = new THREE.Color('#4e443c'), REC_EMPTY = new THREE.Color('#7a6e62');

  const MEM = new THREE.Group(); scene.add(MEM);
  const RECG = [];
  RECS.forEach((q) => {
    const H = recSpec(q.seed, q.hero);
    const G = receptorGeos(H, q.hero);
    const grp = new THREE.Group(); grp.position.set(q.x, 0, q.z); grp.rotation.y = q.rot; MEM.add(grp);
    const o = { q, H, grp, loops: G.loops };
    if (q.hero) {
      o.mat = heroMat;
      o.hel = H.map((h, i) => { const m = new THREE.Mesh(G.hel[i], heroMat); m.position.copy(h.c); m.quaternion.copy(qFromDir(h.dir)); m.castShadow = true; m.receiveShadow = true; grp.add(m); return m; });
      o.loopMeshes = G.loops.map((l) => { const m = new THREE.Mesh(l.geo, heroMat); m.castShadow = true; m.receiveShadow = true; grp.add(m); return m; });
      G.terms.forEach((g) => { const m = new THREE.Mesh(g, heroMat); m.castShadow = true; grp.add(m); });
    } else {
      o.mat = new THREE.MeshStandardMaterial({ color: REC_BG.clone(), roughness: 0.55, emissive: CYAN.clone(), emissiveIntensity: 0 });
      o.lift = { v: 0 }; o.act = { v: 0 };
      const parts = H.map((h, i) => G.hel[i].applyMatrix4(new THREE.Matrix4().compose(h.c, qFromDir(h.dir), V(1, 1, 1))));
      const m = new THREE.Mesh(mergeGeometries([...parts, ...G.loops.map((l) => l.geo), ...G.terms]), o.mat);
      m.castShadow = true; m.receiveShadow = true; grp.add(m);
    }
    RECG.push(o);
  });
  const HERO = RECG[0];

  /* ---------------- bicapa lipídica ---------------- */
  const rh = M.rng(19);
  const sideBack = (x, z) => Math.min(HXW - Math.abs(x), HZ + z) < 0.62;     // bordes laterales y de atrás (se ven siempre)
  const freeOf = (x, z) => !RECS.some((q) => Math.hypot(x - q.x, z - q.z) < q.nr);
  const lipTop = [], lipBot = [];
  // secundario: valores bajos y poco saturados
  const cA = new THREE.Color('#3a322c'), cB = new THREE.Color('#453b33'), cC = new THREE.Color('#2e2823');
  for (const [arr, y, off, bottom] of [[lipTop, YT, 0, false], [lipBot, YB, 0.5, true]]) {
    for (let j = 0; ; j++) {
      const z = -HZ + HEAD + j * SP * 0.866; if (z > HZ - HEAD + 1e-6) break;
      for (let i = 0; ; i++) {
        const x = -HXW + HEAD + (i + ((j + (off ? 1 : 0)) % 2) * 0.5) * SP; if (x > HXW - HEAD + 1e-6) break;
        const xx = x + (rh() - 0.5) * 0.025, zz = z + (rh() - 0.5) * 0.025;
        if (!freeOf(xx, zz)) continue;
        const sb = sideBack(xx, zz), nearCut = zz > CUT0 - 0.8;      // la capa de abajo y las colas solo existen donde se pueden ver
        if (bottom && !sb && !nearCut) continue;
        const c = cA.clone().lerp(cB, rh()).lerp(cC, rh() * 0.5);
        arr.push({ x: xx, y: y + (rh() - 0.5) * 0.025, z: zz, s: 0.94 + rh() * 0.1, c, sb, tail: sb || nearCut });
      }
    }
  }
  const headGeo = new THREE.SphereGeometry(1, 10, 7);
  const headMat = new THREE.MeshLambertMaterial({ color: '#ffffff' });     // Lambert: secundario y barato de sombrear
  const heads = new THREE.InstancedMesh(headGeo, headMat, lipTop.length); heads.receiveShadow = true; MEM.add(heads);
  const headsB = new THREE.InstancedMesh(headGeo, headMat, lipBot.length); headsB.receiveShadow = true; MEM.add(headsB);
  const m4 = new THREE.Matrix4(), q0 = new THREE.Quaternion(), vS = V(), vP = V();
  lipTop.forEach((L, i) => heads.setColorAt(i, L.c));
  lipBot.forEach((L, i) => headsB.setColorAt(i, L.c));
  // colas: en los bordes y en la franja del corte
  const tailDefs = [];
  const tailOf = (L, s, hi) => { for (let k = 0; k < 2; k++) { const dx = (k - 0.5) * 0.1 + (rh() - 0.5) * 0.05, dz = (rh() - 0.5) * 0.08;
    tailDefs.push({ L, hi, a: V(L.x + dx * 0.5, L.y - s * 0.08, L.z + dz * 0.5), b: V(L.x + dx * 1.4 + (rh() - 0.5) * 0.06, s * 0.1, L.z + dz * 1.4) }); } };
  lipTop.forEach((L, i) => L.tail && tailOf(L, 1, i));
  lipBot.forEach((L) => L.tail && tailOf(L, -1, -1));
  const tailGeo = new THREE.CylinderGeometry(1, 1, 1, 6, 1, true);

  const cz = { lD: Math.log(D0 * 0.6) };
  const D_REF = D0 * 0.92, T_DIVE = 1.8, T_DIVE_END = 3.9;

  const mc = { D: 15, el: 0.34, az: 0.42, tx: 0.2, ty: 0.35, tz: HERO_Z - 0.4, shift: -400 };
  tl.fromTo(cz, { lD: Math.log(D_REF) }, { lD: Math.log(mc.D), duration: T_DIVE_END - T_DIVE, ease: 'apple', immediateRender: false }, T_DIVE);
  const tilt = { v: 0 }, T_TILT = 3.1, TILT_DUR = 1.1;
  tl.to(tilt, { v: 1, duration: TILT_DUR, ease: 'apple' }, T_TILT);
  tl.to(mc, { az: 0.38, duration: 1.4, ease: 'none' }, T_TILT + TILT_DUR);

  // beat 2 — la psilocina baja y entra en el bolsillo (cámara encima del bolsillo, TM5/TM6 translúcidas); el receptor se activa
  const T_MOL = 5.9, T_INS = 7.15, T_ACT = 7.5;
  const mol = { p: 0, i: 0 };
  tl.to(mol, { p: 1, duration: T_INS - T_MOL, ease: 'appleOut' }, T_MOL);
  tl.to(mc, { D: 7.5, el: 0.3, az: 0.3, tx: 0, ty: 0.8, tz: HERO_Z, shift: -380, duration: 1.15, ease: 'apple' }, 6.0);
  const ghost = { v: 1 };
  tl.to(ghost, { v: 0.3, duration: 0.5, ease: 'apple' }, 6.3);
  tl.to(mol, { i: 1, duration: 0.3, ease: 'apple' }, T_INS);
  tl.to(ghost, { v: 1, duration: 0.5, ease: 'apple' }, 8.0);
  tl.fromTo(U.uAct, { value: 0 }, { value: 0.9, duration: 0.85, ease: 'appleOut', immediateRender: false }, T_ACT - 0.15);
  tl.fromTo(U.uPA, { value: 0 }, { value: 1, duration: 0.12, ease: 'none', immediateRender: false }, T_ACT);
  tl.fromTo(U.uPulse, { value: 2.6 }, { value: -2.4, duration: 1.0, ease: 'apple', immediateRender: false }, T_ACT);
  tl.to(U.uPA, { value: 0, duration: 0.25, ease: 'none' }, T_ACT + 0.85);
  tl.to(U.uGlow, { value: 0.18, duration: 0.8, ease: 'appleOut' }, T_ACT + 0.1);
  const sw = { v: 0 }; tl.to(sw, { v: 1, duration: 0.8, ease: 'apple' }, T_ACT + 0.15);
  tl.to(mc, { D: 12, el: 0.2, az: 0.26, ty: 0.3, shift: -390, duration: 0.9, ease: 'apple' }, 7.95);
  tl.to(mc, { az: 0.2, duration: 1.5, ease: 'none' }, 8.85);
  const ripples = [{ x: 0, z: HERO_Z, t0: T_ACT + 0.02, v: 4.2, w: 0.5, a: 0.12, g: 0.9, life: 2.3 }, { x: 0, z: HERO_Z, t0: T_ACT + 0.34, v: 4.2, w: 0.45, a: 0.07, g: 0.55, life: 2.0 }];

  // beat 3 — el corte se cierra (bandeja limpia, el protagonista es uno más) y 18 de 25 quedan ocupados (72 %)
  const T_B3 = 10.35;
  tl.to(mc, { D: 47, el: 0.8, az: 0.12, tx: 0, ty: -0.7, tz: 0.3, shift: -400, duration: 1.5, ease: 'apple' }, T_B3);
  tl.to(cut, { z: HZ + 0.1, duration: 1.2, ease: 'apple' }, T_B3 + 0.05);
  tl.to(fogS, { span: 30, duration: 1.5, ease: 'apple' }, T_B3);
  tl.set(heroClip, { constant: -Y_CUT }, T_B3 + 1.35);
  tl.to(mc, { az: 0.04, duration: 15 - T_B3 - 1.5, ease: 'none' }, T_B3 + 1.5);
  const occBg = RECG.filter((o) => !o.q.hero && o.q.occ);
  { const ro = M.rng(5); for (let i = occBg.length - 1; i > 0; i--) { const j = Math.floor(ro() * (i + 1)); [occBg[i], occBg[j]] = [occBg[j], occBg[i]]; } }
  RECG.forEach((o) => { if (o.lift) tl.to(o.lift, { v: 1, duration: 0.6, ease: 'apple' }, T_B3 + 0.1); });   // todos legibles: vacío = hueso apagado
  const bgMols = new THREE.InstancedMesh(molGeo, molMat, occBg.length); bgMols.castShadow = true; scene.add(bgMols);
  let T_LAST = 0;
  occBg.forEach((o, k) => {
    o.dock = { v: 0 }; const t0 = T_B3 + 0.05 + k * 0.035;
    tl.to(o.dock, { v: 1, duration: 0.75, ease: 'appleOut' }, t0);
    tl.to(o.act, { v: 0.9, duration: 0.45, ease: 'appleOut' }, t0 + 0.62);
    tl.to(o.mat, { emissiveIntensity: 0.55, duration: 0.08, ease: 'none' }, t0 + 0.7);
    tl.to(o.mat, { emissiveIntensity: 0.1, duration: 0.45, ease: 'appleOut' }, t0 + 0.78);
    ripples.push({ x: o.q.x, z: o.q.z, t0: t0 + 0.72, v: 3.0, w: 0.35, a: 0.04, g: 0.22, life: 0.8 });
    T_LAST = Math.max(T_LAST, t0 + 0.75);
  });
  const T_NUM = T_LAST;                                       // el contador llega a 72

  /* ---------------- texto (skill motion-copy): 12 palabras en toda la escena ---------------- */
  const tA = M.textIn($('#title .a'), 3.65, { dur: 1.0, stagger: 0.04, ease: 'appleOut' });
  const tB = M.textIn($('#title .b'), 3.8, { dur: 1.0, stagger: 0.04, ease: 'appleOut' });
  M.textOut(tA, 5.85, { stagger: 0.015 }); M.textOut(tB, 5.9, { stagger: 0.015 });
  const l2 = M.textIn($('#l2'), 6.25, { type: 'words', dur: 0.8, stagger: 0.06, ease: 'appleOut' });
  M.textOut(l2, 10.15, { type: 'words', stagger: 0.02 });
  // el número cuenta mientras llegan las moléculas; "hasta" y el rótulo entran cuando queda en 72
  tl.from('#num .n', { yPercent: 12, opacity: 0, duration: 0.8, ease: 'appleOut' }, 10.95);
  tl.from('#num .h', { y: 24, opacity: 0, duration: 0.7, ease: 'appleOut' }, T_NUM);
  const nl = M.textIn($('#numL'), T_NUM + 0.05, { type: 'words', dur: 0.7, stagger: 0.05, ease: 'appleOut' });
  tl.to(['#num', '#numL'], { opacity: 0, y: -14, duration: 0.5, ease: 'appleIn' }, 14.1);
  tl.to('#fade', { opacity: 1, duration: 0.45, ease: 'appleIn' }, 14.25);

  /* ---------------- sonido (docs/AUDIO.md): pocos efectos, cada uno con motivo ---------------- */
  M.sfx(0.15, 'tap', { deg: 0, oct: 4, bright: 0.7, gain: -4 });                 // aparece el soma
  M.sfx(0.4, 'grow', { dur: 1.5, density: 90 });                                 // crecen las ramas
  M.sfx(T_DIVE, 'whoosh', { dur: T_DIVE_END - T_DIVE, peak: 0.5, dir: 1, gain: -1 });   // zambullida
  M.sfx(3.67, 'tick');                                                           // "Receptor 5-HT2A"
  M.sfx(T_MOL, 'whoosh', { dur: 1.1, peak: 0.3, dir: -1, gain: -7 });            // baja la psilocina
  M.sfx(6.27, 'tick', { tone: 'glass', gain: -2 });                              // "Encaja como una llave"
  M.sfx(T_INS + 0.28, 'tick', { gain: 1 });                                      // encaje
  M.sfx(T_ACT, 'swell', { dur: 1.0 }).sfx(T_ACT, 'impact', { weight: 0.8 });     // activación
  M.sfx(T_B3, 'whoosh', { dur: 1.5, peak: 0.45, dir: -1, gain: -4 });            // plano general
  [0, 5, 10, 16].forEach((k, i) => M.sfx(T_B3 + 0.05 + k * 0.035 + 0.72, 'tap', { deg: [0, 2, 4, 7][i], oct: 5, bright: 0.7, gain: -7 }));
  M.sfx(10.97, 'tick', { gain: -2 });                                            // aparece el número
  M.sfx(T_LAST, 'shimmer', { degs: [2, 4, 7], gain: -3 });                       // queda en 72 %

  /* ======================= verificación de modelado (?debug) ======================= */
  function segDist(p1, q1, p2, q2) {   // distancia mínima entre segmentos
    const d1 = q1.clone().sub(p1), d2 = q2.clone().sub(p2), r = p1.clone().sub(p2);
    const a = d1.dot(d1), e = d2.dot(d2), f = d2.dot(r), c = d1.dot(r), b = d1.dot(d2), den = a * e - b * b;
    let s = den > 1e-9 ? clamp01((b * f - c * e) / den) : 0, t = (b * s + f) / e;
    if (t < 0) { t = 0; s = a > 1e-9 ? clamp01(-c / a) : 0; } else if (t > 1) { t = 1; s = a > 1e-9 ? clamp01((b - c) / a) : 0; }
    return p1.clone().addScaledVector(d1, s).distanceTo(p2.clone().addScaledVector(d2, t));
  }
  const ptSeg = (p, a, b) => segDist(p, p, a, b);
  if (DEBUG) {
    const rep = {};
    const mn = (k, v) => (rep[k] = Math.min(rep[k] ?? 1e9, v));
    RECG.forEach((o) => {
      const H = o.H, tag = o.q.hero ? 'H:' : '';
      for (let i = 0; i < 7; i++) for (let j = i + 1; j < 7; j++) mn(tag + 'hélice↔hélice', segDist(H[i].top, H[i].bot, H[j].top, H[j].bot) - 2 * HXR * 1.1);
      Object.entries(AT).forEach(([k, p]) => { const r = EL[elOf(k)].r * MS, P = p.clone().add(V(0, Y_DOCK, 0));
        H.forEach((h) => mn(tag + 'molécula↔hélice', ptSeg(P, h.top, h.bot) - HXR * 1.1 - r));
        o.loops.forEach((l) => l.curve.getPoints(60).forEach((c) => mn(tag + 'molécula↔asa', c.distanceTo(P) - LOOP_R - r))); });
      const inv = new THREE.Matrix4().makeRotationY(-o.q.rot);
      lipTop.concat(lipBot).forEach((L) => { if (Math.hypot(L.x - o.q.x, L.z - o.q.z) > 2.2) return; const P = V(L.x - o.q.x, L.y, L.z - o.q.z).applyMatrix4(inv);
        H.forEach((h) => mn(tag + 'lípido↔hélice', ptSeg(P, h.top, h.bot) - HXR * 1.02 - HEAD * 1.0)); });
      H.forEach((h) => { for (let y = -CORE_H; y <= CORE_H + 1e-6; y += 0.08) { const u = (y - h.c.y) / h.dir.y; const p = h.c.clone().addScaledVector(h.dir, u); mn(tag + 'núcleo↔hélice', (o.q.nr - 0.1) - Math.hypot(p.x, p.z) - HXR * 1.02); } });
    });
    // separación entre huecos del núcleo (si se tocan, el triangulado del núcleo falla)
    for (let i = 0; i < RECS.length; i++) for (let j = i + 1; j < RECS.length; j++) mn('hueco↔hueco', Math.hypot(RECS[i].x - RECS[j].x, RECS[i].z - RECS[j].z) - (RECS[i].nr + RECS[j].nr - 0.2));
    RECS.forEach((q) => mn('hueco↔borde', Math.min(HXW - INS - Math.abs(q.x), HZ - INS - Math.abs(q.z)) - (q.nr - 0.1)));
    RECS.forEach((q) => { if (!q.hero) mn('fondo↔corte', CUT0 - (q.z + 1.02)); });
    console.log('CLEARANCE', JSON.stringify(rep, (k, v) => (typeof v === 'number' ? +v.toFixed(3) : v)), 'P', PL.toArray().map((x) => x.toFixed(3)).join(','), 'N', NL.toArray().map((x) => x.toFixed(3)).join(','),
      'D0', D0.toFixed(1), 'EL_N', EL_N.toFixed(3), 'lip', lipTop.length, lipBot.length, tailDefs.length, 'molH', MOL_H.toFixed(3), 'T_LAST', T_LAST.toFixed(2));
  }

  if (DEBUG) window.__dbg = { S, key, heads, headsB, tails, MEM, RECG, heroMat, neuMat, THREE, bgMols, heroMol, coreMat, NEU,
    // recorrido de la psilocina del protagonista: holgura mínima contra hélices (con TM6 en su pose actual) y asas
    checkPath(t0, t1, dt) { let worst = 1e9, wt = 0; const g = HERO.grp;
      for (let t = t0; t <= t1 + 1e-6; t += dt) { M.seek(t); heroMol.updateMatrixWorld(true); g.updateMatrixWorld(true);
        Object.entries(AT).forEach(([k, p]) => { const P = heroMol.localToWorld(p.clone()), r = EL[elOf(k)].r * MS;
          HERO.hel.forEach((m, i) => { const h = HERO.H[i], d = UP.clone().applyQuaternion(m.quaternion), a = m.position.clone().addScaledVector(d, h.L / 2), b = m.position.clone().addScaledVector(d, -h.L / 2);
            const v = ptSeg(P, g.localToWorld(a), g.localToWorld(b)) - HXR * 1.05 - r; if (v < worst) { worst = v; wt = t; } });
          HERO.loops.forEach((l) => l.curve.getPoints(40).forEach((c) => { const v = g.localToWorld(c.clone()).distanceTo(P) - LOOP_R - r; if (v < worst) { worst = v; wt = t; } })); }); }
      return { worst, wt }; } };

  /* ======================= POR CUADRO ======================= */
  const bx = V(), by = V(), bz = V(), T = V(), tmp = V(), qT = new THREE.Quaternion(), eul = new THREE.Euler();
  const mcT = V();
  const hc = new THREE.Color();
  // TM6 del protagonista: gira sobre su extremo superior; el extremo intracelular se abre hacia afuera
  const tm6 = HERO.H[5], tm6q0 = qFromDir(tm6.dir), tm6Axis = UP.clone().cross(tm6.rho).normalize().negate();
  const icl3 = HERO.loops.findIndex((l) => l.s < 0 && l.i === 4);
  const GHOST = [4, 5];                                        // TM5 y TM6: las que tapan el bolsillo desde esta cámara
  let swCache = -1, ghostOn = false;
  const neuMode = { overlay: null };
  const setNeuMode = (overlay) => { if (neuMode.overlay === overlay) return; neuMode.overlay = overlay;
    neuMat.transparent = overlay; neuMat.depthWrite = !overlay; neuMat.needsUpdate = true; };

  M.onFrame((t) => {
    /* cámara: zambullida en escala logarítmica hacia P (P queda fijo en pantalla), luego giro al corte y órbita */
    const D = t < T_DIVE_END ? Math.exp(cz.lD) : mc.D;
    const k = tilt.v;
    const el = EL_N + (mc.el - EL_N) * k, az = mc.az * k;
    if (t < T_DIVE) T.copy(T0); else T.copy(PW).addScaledVector(tmp.copy(T0).sub(PW), Math.min(1, D / D_REF));
    mcT.set(mc.tx, mc.ty, mc.tz); T.lerp(mcT, sstep(0, 1, k));
    const sk = Math.max(1, D / 21);
    camera.near = Math.max(0.05, D * 0.01); camera.far = Math.max(250, D * 3);
    camera.position.set(T.x + D * Math.sin(az) * Math.cos(el), T.y + D * Math.sin(el), T.z + D * Math.cos(az) * Math.cos(el));
    camera.up.set(0, 1, 0); camera.lookAt(T);
    camera.setViewOffset(1920, 1080, mc.shift, 0, 1920, 1080);
    camera.updateMatrixWorld();
    scene.fog.near = D + 0.5 * sk; scene.fog.far = D + fogS.span * sk;
    dome.position.copy(camera.position); dome.quaternion.copy(camera.quaternion); dome.scale.setScalar(camera.far * 0.45 / 80);
    camera.matrixWorld.extractBasis(bx, by, bz);
    const ld = 40 * sk;
    for (const [L, d] of [[key, KEY_L], [rim, RIM_L]]) { L.position.copy(T).addScaledVector(bx, d.x * ld).addScaledVector(by, d.y * ld).addScaledVector(bz, d.z * ld); L.target.position.copy(T); }
    hemi.position.copy(by);
    { const E = 14 * sk, sc = key.shadow.camera; sc.left = -E; sc.right = E; sc.top = E; sc.bottom = -E; sc.near = 0.5 * sk; sc.far = 90 * sk; sc.updateProjectionMatrix(); key.shadow.normalBias = 0.02 * sk; }

    /* neurona: crecimiento y fundido (la cara del soma se disuelve en la muestra, vista de frente) */
    soma.scale.setScalar(Math.max(0.001, somaS.v));
    tubes.forEach((o) => { o.geo.setDrawRange(0, Math.floor(o.segs * o.prog.v) * o.radial * 6); if (o.cap) o.cap.visible = o.prog.v > 0.999; });
    const neuOp = t >= T_DIVE_END ? 0 : sstep(20, 50, D);   // se funde recién cuando la cara del soma llena el cuadro
    const memOn = t >= T_DIVE_END || D < 80;
    neuMat.color.copy(NEU_C0).lerp(NEU_C1, sstep(260, 70, D));   // de cerca, menos saturado
    NEU.visible = neuOp > 0.002; MEM.visible = memOn;
    const overlay = NEU.visible && memOn;
    setNeuMode(overlay);
    neuMat.opacity = overlay ? neuOp : 1;
    clearer.visible = overlay;
    PRE.forEach(([m, p]) => { p.visible = overlay && m.visible; p.scale.copy(m.scale); });
    outlineMat.opacity = 0.9 * outl.v * sstep(50, 66, D);   // se va antes de que asomen las aristas de la bandeja
    outline.geometry.instanceCount = Math.max(0, Math.round(OUT_N * outl.v)); outline.visible = outlineMat.opacity > 0.002;

    /* corte de la muestra */
    const c = cut.z;
    cutPlane.constant = c;
    if (edgeC !== c) { edgeC = c; buildEdges(c); }

    /* ondas en la membrana (cabezas que suben, se aclaran y se enfrían apenas) */
    const topDy = new Float32Array(lipTop.length);
    for (let i = 0; i < lipTop.length; i++) {
      const L = lipTop[i]; let dy = 0, gl = 0;
      for (const rp of ripples) { const age = t - rp.t0; if (age <= 0 || age > rp.life) continue;
        const d = Math.hypot(L.x - rp.x, L.z - rp.z), g = Math.exp(-(((d - NR - rp.v * age) / rp.w) ** 2)) * (1 - age / rp.life) * Math.min(1, age * 8);
        dy += rp.a * g; gl += rp.g * g; }
      topDy[i] = dy; gl = Math.min(0.4, gl);
      heads.setMatrixAt(i, m4.compose(vP.set(L.x, L.y + dy, L.z), q0, vS.setScalar(Math.max(1e-5, HEAD * L.s * shownAt(L.z, c)))));
      heads.setColorAt(i, hc.copy(L.c).lerp(CYAN, gl * 0.6).multiplyScalar(1 + 1.2 * gl));
    }
    heads.instanceMatrix.needsUpdate = true; heads.instanceColor.needsUpdate = true;
    lipBot.forEach((L, i) => headsB.setMatrixAt(i, m4.compose(vP.set(L.x, L.y, L.z), q0, vS.setScalar(Math.max(1e-5, HEAD * L.s * tailVis(L, c))))));
    headsB.instanceMatrix.needsUpdate = true;
    tailDefs.forEach((d, i) => setTail(i, d.hi >= 0 ? topDy[d.hi] : 0, tailVis(d.L, c))); tails.instanceMatrix.needsUpdate = true;

    /* TM6 del protagonista y su asa intracelular */
    if (Math.abs(sw.v - swCache) > 1e-4) {
      swCache = sw.v;
      const q = new THREE.Quaternion().setFromAxisAngle(tm6Axis, 0.1 * sw.v).multiply(tm6q0);
      const dir = UP.clone().applyQuaternion(q);
      HERO.hel[5].quaternion.copy(q); HERO.hel[5].position.copy(tm6.top).addScaledVector(dir, -tm6.L / 2);
      const bot = tm6.top.clone().addScaledVector(dir, -tm6.L);
      const L = HERO.loops[icl3]; const cv = loopCurve(HERO.H[4].bot, bot, -1, L.h, L.out);
      HERO.loopMeshes[icl3].geometry.dispose(); HERO.loopMeshes[icl3].geometry = new THREE.TubeGeometry(cv, 44, LOOP_R, 10, false);
    }
    /* TM5/TM6 translúcidas mientras entra la llave */
    const gOn = ghost.v < 0.999;
    if (gOn !== ghostOn) { ghostOn = gOn; GHOST.forEach((i) => (HERO.hel[i].material = gOn ? ghostMat : heroMat)); }
    ghostMat.opacity = ghost.v;

    /* psilocina del protagonista: baja girando desde arriba a la derecha, se alinea y entra */
    heroMol.visible = t > T_MOL - 0.05;
    if (heroMol.visible) {
      const s0 = V(1.5, 6.2, HERO_Z + 0.5), c1 = V(0.55, 3.0, HERO_Z + 0.25), hov = V(0, Y_DOCK + 0.32, HERO_Z), u = mol.p;
      tmp.copy(s0).multiplyScalar((1 - u) * (1 - u)).addScaledVector(c1, 2 * (1 - u) * u).addScaledVector(hov, u * u);
      tmp.y -= 0.32 * mol.i;
      heroMol.position.copy(tmp);
      heroMol.rotation.set(0.5 * (1 - u), 2.6 * (1 - u) * (1 - u), 0.25 * (1 - u));
    }

    /* beat 3: las demás psilocinas llegan a sus receptores; vacíos en hueso apagado, ocupados en azul */
    let docked = 1;
    RECG.forEach((o) => { if (!o.lift) return; mix3(o.mat.color, hc.copy(REC_BG).lerp(REC_EMPTY, o.lift.v), o.act.v); });
    occBg.forEach((o, k) => {
      const v = o.dock.v; if (v >= 0.985) docked++;
      const sc = v <= 0 ? 0.0001 : Math.min(1, v * 3.5);
      eul.set(0.4 * (1 - v), o.q.rot + 2.4 * (1 - v), 0); qT.setFromEuler(eul);
      bgMols.setMatrixAt(k, m4.compose(vP.set(o.q.x, Y_DOCK + 4.2 * (1 - v), o.q.z), qT, vS.setScalar(sc)));
    });
    bgMols.instanceMatrix.needsUpdate = true; bgMols.visible = t > T_B3;
    $('#numV').textContent = M.fmt(docked * 4);

    S.render();
  });
});
