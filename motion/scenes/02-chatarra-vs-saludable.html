<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>02 · Chatarra vs. saludable</title>
<link rel="stylesheet" href="../lib/theme.css">
<style>
  /* ---------- Beat 1 · kicker + tarjetas ---------- */
  #kicker1 { top: 150px; }

  #grp { position: absolute; inset: 0; }
  #links { position: absolute; left: 0; top: 0; overflow: visible; }

  .food { top: 262px; width: 560px; height: 516px; padding: 38px 44px 0; }
  #cardL { left: 200px; }
  #cardR { left: 1160px; }
  .food .head { display: flex; align-items: center; justify-content: space-between; }
  .food .lbl { font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 26px; line-height: 1.35;
    letter-spacing: 0.3em; color: var(--sky); }
  .food .sw { width: 46px; height: 6px; border-radius: 3px; }
  #cardL .sw { background: var(--electric); }
  #cardR .sw { background: var(--cyan); }
  .food .ttl { font-weight: 900; font-size: 74px; letter-spacing: -0.035em; line-height: 1.25; color: var(--white); white-space: nowrap; }
  .food .badges { display: flex; gap: 22px; margin-top: 16px; }
  .food .ico-badge { width: 112px; height: 112px; border-radius: 28px; }
  .food .ico-badge .ico { width: 64px; height: 64px; }
  .food .rule { height: 2px; background: var(--line-faint); margin-top: 30px; transform-origin: 0 50%; }
  .food .val { display: flex; align-items: baseline; gap: 18px; margin-top: 10px; transform-origin: 0% 80%; }
  .food .val .num { font-size: 124px; line-height: 1.08; color: var(--white); }
  .food .val .unit { font-size: 38px; }

  /* ---------- Beat 3 · resultado ---------- */
  #fx { position: absolute; left: 0; top: 0; overflow: visible; }
  #res { left: 240px; top: 604px; width: 1440px; height: 350px; --reflect: initial; } /* sin reflejo: quedaría pegado al borde inferior */
  #res .left { position: absolute; left: 56px; top: 0; bottom: 0; width: 700px; display: flex; flex-direction: column; justify-content: center; }
  #res .rk { font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 26px; letter-spacing: 0.3em; color: var(--sky);
    text-transform: uppercase; display: inline-flex; align-items: center; gap: 16px; line-height: 1.35; }
  #res .rk .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 12px var(--cyan); }
  html.verde #res .rk .dot { box-shadow: none; }
  #res .l1, #res .l2 { font-weight: 800; font-size: 58px; letter-spacing: -0.03em; line-height: 1.25; white-space: nowrap; }
  #res .l1 { margin-top: 18px; color: var(--white); }
  #res .l2 { display: flex; align-items: center; gap: 16px; margin-top: 2px; }
  #res .l2 .arr { width: 54px; height: 54px; color: var(--cyan); flex: none; }
  #res .l2 .t { color: var(--cyan); }
  #res .vsep { position: absolute; left: 792px; top: 50px; bottom: 50px; width: 2px; background: var(--line-faint); transform-origin: 50% 0; }

  #chartBox { position: absolute; left: 836px; top: 34px; width: 564px; height: 290px; }
  #chartBox .cl { position: absolute; font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 22px; line-height: 1.3;
    letter-spacing: 0.14em; color: var(--sky); white-space: nowrap; }
  #tPeso { left: 26px; top: 0; }
  #tTiempo { right: 4px; top: 254px; }
  #legend { position: absolute; right: 4px; top: 0; display: flex; align-items: center; gap: 26px; }
  #legend .it { display: flex; align-items: center; gap: 12px; }
  #legend .ln { width: 32px; height: 6px; border-radius: 3px; transform-origin: 0 50%; }
  #legend .t { font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 22px; line-height: 1.3; letter-spacing: 0.14em; color: var(--sky); }
  #plot { position: absolute; left: 0; top: 40px; overflow: visible; }

  /* ---------- Beat 4 · remate ---------- */
  #kicker2 { top: 336px; }
  #big { top: 368px; left: 0; right: 0; text-align: center; }
  #big .display { font-size: 224px; display: inline-block; text-shadow: none;
    filter: drop-shadow(0 0 26px rgba(32,196,239,0.30)) drop-shadow(0 0 70px rgba(8,126,255,0.22)); }
  html.verde #big .display { filter: none; }
  #bEq { display: inline-block; filter: var(--glow-cyan); margin: 0 0.06em; }
  #pillWrap { position: absolute; left: 960px; top: 726px; }
  #pill { position: relative; transform: translateX(-50%); padding: 20px 44px 20px 24px; gap: 22px; }
  #pill .ico-badge { width: 76px; height: 76px; border-radius: 999px; }
  #pill .ico-badge .ico { width: 46px; height: 46px; }
  #pill .t { font-size: 50px; font-weight: 800; letter-spacing: -0.02em; }
  #pill .t span { color: var(--cyan); }
</style>
</head>
<body>
<div id="bg"></div>
<div id="world">

  <!-- Beat 1 -->
  <div id="kicker1" class="abs center-x kicker"><span class="dot"></span><span class="txt">Misma cantidad de calorías</span></div>

  <div id="grp">
    <!-- conexiones, signo "=" y nodo (coordenadas del grupo) -->
    <svg id="links" viewBox="0 0 1920 1080" width="1920" height="1080">
      <defs>
        <radialGradient id="gFloorA" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#20C4EF" stop-opacity="0.30"/>
          <stop offset="50%" stop-color="#087EFF" stop-opacity="0.10"/>
          <stop offset="100%" stop-color="#087EFF" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="gEqHalo" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#20C4EF" stop-opacity="0.36"/>
          <stop offset="40%" stop-color="#087EFF" stop-opacity="0.14"/>
          <stop offset="100%" stop-color="#087EFF" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="gEqDisc" cx="42%" cy="34%" r="70%">
          <stop offset="0%" stop-color="#1A5AA8" stop-opacity="0.55"/>
          <stop offset="60%" stop-color="#0A2750" stop-opacity="0.75"/>
          <stop offset="100%" stop-color="#061B3A" stop-opacity="0.85"/>
        </radialGradient>
        <linearGradient id="gBar" gradientUnits="userSpaceOnUse" x1="904" y1="0" x2="1016" y2="0">
          <stop offset="0%" stop-color="#087EFF"/><stop offset="50%" stop-color="#8AE6FF"/><stop offset="100%" stop-color="#087EFF"/>
        </linearGradient>
        <linearGradient id="gLink" gradientUnits="userSpaceOnUse" x1="0" y1="786" x2="0" y2="905">
          <stop offset="0%" stop-color="#087EFF"/><stop offset="100%" stop-color="#20C4EF"/>
        </linearGradient>
      </defs>

      <ellipse class="fondo-only floor" id="floorL" cx="480" cy="812" rx="330" ry="46" fill="url(#gFloorA)"/>
      <ellipse class="fondo-only floor" id="floorR" cx="1440" cy="812" rx="330" ry="46" fill="url(#gFloorA)"/>

      <!-- signo = -->
      <circle id="eqHalo" class="fondo-only" cx="960" cy="520" r="210" fill="url(#gEqHalo)"/>
      <circle id="eqTicks" cx="960" cy="520" r="124" fill="none" class="st-faint" stroke-width="12" stroke-dasharray="2.5 10.5"/>
      <circle id="eqDiscF" class="fondo-only" cx="960" cy="520" r="100" fill="url(#gEqDisc)"/>
      <circle id="eqDiscV" class="verde-only" cx="960" cy="520" r="100" fill="#0A2448"/>
      <g class="glow">
        <circle id="eqRing" cx="960" cy="520" r="100" fill="none" class="st-main" stroke-width="3.5"/>
        <line id="eq1" x1="912" y1="499" x2="1008" y2="499" stroke="url(#gBar)" stroke-width="18" stroke-linecap="round"/>
        <line id="eq2" x1="912" y1="541" x2="1008" y2="541" stroke="url(#gBar)" stroke-width="18" stroke-linecap="round"/>
      </g>

      <!-- conexiones -->
      <g class="glow-soft">
        <path id="linkL" d="M480,786 V838 Q480,905 547,905 H936" fill="none" stroke="url(#gLink)" stroke-width="4" stroke-linecap="round"/>
        <path id="linkR" d="M1440,786 V838 Q1440,905 1373,905 H984" fill="none" stroke="url(#gLink)" stroke-width="4" stroke-linecap="round"/>
      </g>
      <circle id="dotL" class="f-white glow" r="0"/>
      <circle id="dotR" class="f-white glow" r="0"/>

      <!-- nodo -->
      <circle id="nodeRing" cx="960" cy="905" r="38" fill="none" class="st-faint" stroke-width="2.5"/>
      <g id="node" class="glow">
        <circle id="nodeCore" cx="960" cy="905" r="20" class="f-night st-main" stroke-width="4.5"/>
        <circle id="nodeDot" cx="960" cy="905" r="7" class="f-cyan"/>
      </g>
    </svg>

    <div class="food card" id="cardL"><div class="accent"></div>
      <div class="head"><span class="lbl">COMIDA</span><span class="sw"></span></div>
      <div class="ttl">SALUDABLE</div>
      <div class="badges">
        <span class="ico-badge"><i data-icon="carrot"></i></span>
        <span class="ico-badge"><i data-icon="fish"></i></span>
        <span class="ico-badge"><i data-icon="avocado"></i></span>
      </div>
      <div class="rule"></div>
      <div class="val"><span class="num" id="cL">0</span><span class="unit">kcal</span></div>
    </div>

    <div class="food card" id="cardR"><div class="accent"></div>
      <div class="head"><span class="lbl">COMIDA</span><span class="sw"></span></div>
      <div class="ttl">CHATARRA</div>
      <div class="badges">
        <span class="ico-badge"><i data-icon="hamburger"></i></span>
        <span class="ico-badge"><i data-icon="pizza"></i></span>
        <span class="ico-badge"><i data-icon="ice-cream"></i></span>
      </div>
      <div class="rule"></div>
      <div class="val"><span class="num" id="cR">0</span><span class="unit">kcal</span></div>
    </div>
  </div>

  <!-- Beat 3: vínculo nodo → resultado (coordenadas de mundo) -->
  <svg id="fx" viewBox="0 0 1920 1080" width="1920" height="1080">
    <line id="drop" x1="960" y1="0" x2="960" y2="604" class="st-main" stroke-width="3" stroke-linecap="round"/>
  </svg>

  <div class="card" id="res"><div class="accent"></div>
    <div class="left">
      <div class="rk"><span class="dot"></span><span class="rkt">Resultado</span></div>
      <div class="l1">Mismo déficit</div>
      <div class="l2"><i class="arr" data-icon="arrow-right"></i><span class="t">misma pérdida de peso</span></div>
    </div>
    <div class="vsep"></div>
    <div id="chartBox">
      <div class="cl" id="tPeso">PESO</div>
      <div id="legend">
        <div class="it"><span class="ln" style="background:#087EFF"></span><span class="t">SALUDABLE</span></div>
        <div class="it"><span class="ln" style="background:#20C4EF"></span><span class="t">CHATARRA</span></div>
      </div>
      <svg id="plot" viewBox="0 0 564 210" width="564" height="210">
        <defs>
          <linearGradient id="gArea" gradientUnits="userSpaceOnUse" x1="0" y1="26" x2="0" y2="200">
            <stop offset="0%" stop-color="#20C4EF" stop-opacity="0.22"/>
            <stop offset="100%" stop-color="#087EFF" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <line class="grid st-faint" x1="28" y1="50" x2="556" y2="50" stroke-width="1.5"/>
        <line class="grid st-faint" x1="28" y1="100" x2="556" y2="100" stroke-width="1.5"/>
        <line class="grid st-faint" x1="28" y1="150" x2="556" y2="150" stroke-width="1.5"/>
        <line id="axY" x1="28" y1="4" x2="28" y2="200" class="st-soft" stroke-width="2.5" stroke-linecap="round"/>
        <line id="axX" x1="28" y1="200" x2="556" y2="200" class="st-soft" stroke-width="2.5" stroke-linecap="round"/>
        <path id="area" class="fondo-only" d="M42,26 C150,34 226,120 322,146 S480,180 548,184 L548,200 L42,200 Z" fill="url(#gArea)"/>
        <path id="curveA" d="M42,26 C150,34 226,120 322,146 S480,180 548,184" fill="none" stroke="#087EFF" stroke-width="11" stroke-linecap="round"/>
        <path id="curveB" d="M42,26 C150,34 226,120 322,146 S480,180 548,184" fill="none" stroke="#20C4EF" stroke-width="4" stroke-linecap="round"/>
        <g class="glow"><circle id="headA" r="0" fill="#087EFF"/><circle id="headB" r="0" class="f-white"/></g>
      </svg>
      <div class="cl" id="tTiempo">TIEMPO</div>
    </div>
  </div>

  <!-- Beat 4: remate -->
  <div id="kicker2" class="abs center-x kicker"><span class="dot"></span><span class="txt">Para la balanza</span></div>
  <div id="big" class="abs"><div class="display reflect" id="bigTxt"><span id="bA">1 kcal</span> <span id="bEq">=</span> <span id="bB">1 kcal</span></div></div>
  <div id="pillWrap"><div id="pill" class="pill">
    <span class="ico-badge"><i data-icon="scales"></i></span><span class="t">Venga de <span>donde venga</span></span>
  </div></div>

</div>

<script src="../node_modules/gsap/dist/gsap.min.js"></script>
<script src="../node_modules/gsap/dist/SplitText.min.js"></script>
<script src="../node_modules/gsap/dist/DrawSVGPlugin.min.js"></script>
<script src="../node_modules/gsap/dist/CustomEase.min.js"></script>
<script src="../lib/stage.js"></script>
<script>
M.scene({ duration: 14.95, icons: ['carrot', 'fish', 'avocado', 'hamburger', 'pizza', 'ice-cream', 'arrow-right', 'scales'] }, (tl, M) => {
  const $ = (s) => document.querySelector(s);
  const $$ = (s) => [...document.querySelectorAll(s)];
  const L = (id) => document.getElementById(id);
  const set = (el, a) => { for (const k in a) el.setAttribute(k, a[k]); };

  /* Transformaciones SVG propias (escala/rotación alrededor de un punto fijo).
     Se escriben en el atributo `transform` en cada frame desde proxies del timeline,
     así el origen no depende del cálculo de bbox de GSAP. */
  const XF = [];
  const xf = (id, cx, cy, s = 1, r = 0) => { const o = { el: L(id), cx, cy, s, r }; XF.push(o); return o; };
  const tHalo = xf('eqHalo', 960, 520), tTicks = xf('eqTicks', 960, 520);
  const tDiscF = xf('eqDiscF', 960, 520), tDiscV = xf('eqDiscV', 960, 520);
  const tNode = xf('node', 960, 905), tCore = xf('nodeCore', 960, 905), tNDot = xf('nodeDot', 960, 905), tNRing = xf('nodeRing', 960, 905);
  const tFloorL = xf('floorL', 480, 812), tFloorR = xf('floorR', 1440, 812);
  const hidden = (el, on, off) => { // visible sólo entre on y off (evita puntos de trazos de largo 0 con remate redondo)
    tl.fromTo(el, { visibility: 'hidden' }, { visibility: 'visible', duration: 0.001, immediateRender: true }, on);
    if (off != null) tl.to(el, { visibility: 'hidden', duration: 0.001 }, off);
  };

  /* ---------------- Beat 1 · misma cantidad (0,15 – 2,25 s · quieto hasta 3,75) ---------------- */
  const k1 = M.textIn($('#kicker1 .txt'), 0.15, { type: 'words', dur: 0.8 });
  M.zoomIn($('#kicker1 .dot'), 0.15);

  gsap.set('#cardL', { rotationY: 13, transformPerspective: 1400 });
  gsap.set('#cardR', { rotationY: -13, transformPerspective: 1400 });
  M.popIn($('#cardL'), 0.3, { dur: 1.0, rotX: 16, y: 60 });
  M.popIn($('#cardR'), 0.42, { dur: 1.0, rotX: 16, y: 60 });
  if (!M.chroma) {
    tl.from([tFloorL, tFloorR], { s: 0.4, duration: 1.2, stagger: 0.12 }, 0.4);
    tl.from('.floor', { opacity: 0, duration: 1.2, stagger: 0.12 }, 0.4);
  }

  const lbls = [];
  [['#cardL', 0.55], ['#cardR', 0.67]].forEach(([c, at]) => {
    lbls.push(M.textIn($(c + ' .lbl'), at, { type: 'words', dur: 0.7 }));
    M.textIn($(c + ' .ttl'), at + 0.08, { dur: 0.85, stagger: 0.035 });
    tl.from($$(c + ' .ico-badge'), { scale: 0, duration: 0.7, ease: 'back.out(1.7)', stagger: 0.09 }, at + 0.3);
    tl.from($$(c + ' .ico-badge .ico'), { scale: 0.2, rotation: -25, duration: 0.8, ease: 'back.out(2)', stagger: 0.09 }, at + 0.38);
    tl.from($(c + ' .sw'), { scaleX: 0, transformOrigin: '100% 50%', duration: 0.6, ease: 'swift' }, at + 0.25);
    tl.from($(c + ' .rule'), { scaleX: 0, duration: 0.8, ease: 'swift' }, at + 0.45);
    // el número sube desde una máscara (clip) justo antes de que arranque el contador
    tl.fromTo($(c + ' .val'), { y: 70, clipPath: 'inset(0% -10% 100% -10%)' },
      { y: 0, clipPath: 'inset(-30% -10% -30% -10%)', duration: 0.75, ease: 'swift' }, at + 0.3);
  });
  M.counter($('#cL'), { to: 1800, at: 0.95, dur: 1.3 });
  M.counter($('#cR'), { to: 1800, at: 0.95, dur: 1.3 });
  // "latido" simultáneo de los dos números al llegar
  tl.fromTo('.food .val', { scale: 1 }, { scale: 1.05, duration: 0.18, ease: 'power2.out', yoyo: true, repeat: 1 }, 2.25);
  // deriva 2.5D muy lenta durante el quieto
  tl.to('#cardL', { rotationY: 10, duration: 5.5, ease: 'sine.inOut' }, 1.3);
  tl.to('#cardR', { rotationY: -10, duration: 5.5, ease: 'sine.inOut' }, 1.3);

  /* ---------------- Beat 2 · signo "=" y conexiones (3,75 – 5,3 s · quieto hasta 6,8) ---------------- */
  const B2 = 3.75;
  if (!M.chroma) {
    tl.from(tHalo, { s: 0.3, duration: 1.1, ease: 'smooth' }, B2);
    tl.from('#eqHalo', { opacity: 0, duration: 1.1, ease: 'smooth' }, B2);
  }
  tl.from([tDiscF, tDiscV], { s: 0, duration: 0.6, ease: 'back.out(1.4)' }, B2);
  M.draw($('#eqRing'), B2 + 0.05, { dur: 0.8 });
  tl.from(tTicks, { s: 0.6, duration: 0.9, ease: 'swift' }, B2 + 0.1);
  hidden(L('eqTicks'), B2 + 0.1);
  if (!M.chroma) tl.from('#eqTicks', { opacity: 0, duration: 0.5 }, B2 + 0.1);
  tl.fromTo(tTicks, { r: -20 }, { r: 30, duration: 6.6, ease: 'none' }, B2 + 0.1);
  hidden(L('eq1'), B2 + 0.25, 11.0);
  hidden(L('eq2'), B2 + 0.35, 11.0);
  M.draw($('#eq1'), B2 + 0.25, { dur: 0.5, from: '50% 50%' });
  M.draw($('#eq2'), B2 + 0.35, { dur: 0.5, from: '50% 50%' });

  hidden(L('linkL'), B2 + 0.45, 11.2);
  hidden(L('linkR'), B2 + 0.45, 11.2);
  M.draw($('#linkL'), B2 + 0.45, { dur: 0.85 });
  M.draw($('#linkR'), B2 + 0.45, { dur: 0.85 });
  tl.from(tCore, { s: 0, duration: 0.5, ease: 'back.out(1.8)' }, B2 + 1.05);
  tl.from(tNDot, { s: 0, duration: 0.45, ease: 'back.out(1.8)' }, B2 + 1.12);
  tl.from(tNRing, { s: 0, duration: 0.6, ease: 'swift' }, B2 + 1.1);

  // pulsos de energía que viajan desde cada tarjeta hasta el nodo
  const flow = { p: 0 };
  tl.fromTo(flow, { p: 0 }, { p: 1, duration: 0.75, ease: 'power1.inOut', repeat: 2, repeatDelay: 0.35, immediateRender: false }, B2 + 1.3);
  [B2 + 2.05, B2 + 3.15, B2 + 4.25].forEach((t) => {
    tl.fromTo(tNode, { s: 1 }, { s: 1.22, duration: 0.14, ease: 'power2.out', yoyo: true, repeat: 1, immediateRender: false }, t - 0.05);
  });

  /* ---------------- Beat 3 · resultado (6,8 – 9,1 s · quieto hasta 10,6) ---------------- */
  const B3 = 6.8;
  const S = 0.62, TY = -8;                 // encuadre final del grupo
  gsap.set('#grp', { transformOrigin: '960px 0px' });
  M.textOut(k1, B3 - 0.1, { type: 'words' });
  M.zoomOut($('#kicker1 .dot'), B3 - 0.1);
  lbls.forEach((sp) => M.textOut(sp, B3, { type: 'words' }));   // el rótulo chico se va: al achicarse quedaría < 22 px
  tl.to('#grp', { scale: S, y: TY, duration: 0.95, ease: 'swift' }, B3);
  tl.to('#cardL', { rotationY: 16, duration: 0.95, ease: 'swift' }, B3);
  tl.to('#cardR', { rotationY: -16, duration: 0.95, ease: 'swift' }, B3);

  const nodeY = 905 * S + TY;               // posición del nodo ya encuadrado
  set(L('drop'), { y1: (nodeY + 38 * S + 2).toFixed(1), y2: 606 });
  hidden(L('drop'), B3 + 0.55, 11.0);
  M.draw($('#drop'), B3 + 0.55, { dur: 0.3, ease: 'power2.in' });
  M.popIn($('#res'), B3 + 0.62, { dur: 0.9, rotX: 14, y: 50 });
  M.textIn($('#res .rkt'), B3 + 0.85, { type: 'words', dur: 0.7 });
  M.zoomIn($('#res .rk .dot'), B3 + 0.85);
  M.textIn($('#res .l1'), B3 + 0.95, { type: 'words', dur: 0.85, stagger: 0.08 });
  M.textIn($('#res .l2 .t'), B3 + 1.2, { type: 'words', dur: 0.85, stagger: 0.07 });
  tl.from('#res .l2 .arr', { scale: 0, x: -30, duration: 0.7, ease: 'back.out(1.8)' }, B3 + 1.15);
  tl.from('#res .vsep', { scaleY: 0, duration: 0.7, ease: 'swift' }, B3 + 0.95);

  // gráfico: ejes → rótulos/leyenda → curvas superpuestas
  M.draw($('#axY'), B3 + 0.9, { dur: 0.5, from: '100% 100%' });
  M.draw($('#axX'), B3 + 1.02, { dur: 0.6 });
  $$('#plot .grid').forEach((g, i) => M.draw(g, B3 + 1.2 + i * 0.07, { dur: 0.6 }));
  M.textIn($('#tPeso'), B3 + 1.05, { type: 'words', dur: 0.6 });
  $$('#legend .it').forEach((it, i) => {
    tl.from(it.querySelector('.ln'), { scaleX: 0, duration: 0.5, ease: 'swift' }, B3 + 1.15 + i * 0.12);
    M.textIn(it.querySelector('.t'), B3 + 1.2 + i * 0.12, { type: 'words', dur: 0.6 });
  });
  M.textIn($('#tTiempo'), B3 + 1.45, { type: 'words', dur: 0.6 });
  const CV0 = B3 + 1.12, CVD = 1.05;
  const cv = { a: 0, b: 0 };
  M.draw($('#curveA'), CV0, { dur: CVD });
  M.draw($('#curveB'), CV0 + 0.12, { dur: CVD });
  tl.to(cv, { a: 1, duration: CVD, ease: 'smooth' }, CV0);
  tl.to(cv, { b: 1, duration: CVD, ease: 'smooth' }, CV0 + 0.12);
  if (!M.chroma) tl.from('#area', { opacity: 0, duration: 0.9 }, CV0 + 0.6);

  /* ---------------- salida beats 2-3 (10,6 s) ---------------- */
  const X = 10.6;
  M.popOut($('#res'), X);
  M.undraw($('#drop'), X, { dur: 0.35, to: '0% 0%' });
  M.popOut($('#cardL'), X + 0.08);
  M.popOut($('#cardR'), X + 0.14);
  M.undraw($('#linkL'), X + 0.05, { dur: 0.45 });
  M.undraw($('#linkR'), X + 0.05, { dur: 0.45 });
  tl.to(tCore, { s: 0, duration: 0.45, ease: 'back.in(1.6)' }, X + 0.3);
  tl.to(tNDot, { s: 0, duration: 0.4, ease: 'back.in(1.6)' }, X + 0.25);
  tl.to(tNRing, { s: 0, duration: 0.4, ease: 'exit' }, X + 0.25);
  M.undraw($('#eq1'), X + 0.1, { dur: 0.35, to: '50% 50%' });
  M.undraw($('#eq2'), X + 0.1, { dur: 0.35, to: '50% 50%' });
  M.undraw($('#eqRing'), X + 0.15, { dur: 0.45 });
  tl.to([tDiscF, tDiscV], { s: 0, duration: 0.45, ease: 'back.in(1.6)' }, X + 0.25);
  tl.to(tTicks, { s: 0, duration: 0.45, ease: 'exit' }, X + 0.15);
  if (!M.chroma) {
    tl.to('#eqHalo', { opacity: 0, duration: 0.5 }, X + 0.1);
    tl.to('.floor', { opacity: 0, duration: 0.5 }, X + 0.1);
  }

  /* ---------------- Beat 4 · remate (10,9 – 12,45 s · quieto hasta 13,95) ---------------- */
  const B4 = 10.9;
  const k2 = M.textIn($('#kicker2 .txt'), B4, { type: 'words', dur: 0.8 });
  M.zoomIn($('#kicker2 .dot'), B4);
  const bA = M.textIn($('#bA'), B4 + 0.08, { dur: 0.9, stagger: 0.04 });
  const bE = M.textIn($('#bEq'), B4 + 0.32, { dur: 0.9, cls: 'hl' });
  const bB = M.textIn($('#bB'), B4 + 0.42, { dur: 0.9, stagger: 0.04 });
  M.popIn($('#pill'), B4 + 0.75, { dur: 0.8, rotX: 0 });
  tl.fromTo('#pill .ico', { rotation: -9 }, { rotation: 9, duration: 0.55, ease: 'sine.inOut', repeat: 2, yoyo: true }, B4 + 1.3);

  // salida final
  const E = 13.95;
  M.popOut($('#pill'), E);
  M.textOut(bB, E + 0.03, { stagger: 0.015 });
  M.textOut(bE, E + 0.05);
  M.textOut(bA, E + 0.06, { stagger: 0.015 });
  M.textOut(k2, E + 0.06, { type: 'words' });
  M.zoomOut($('#kicker2 .dot'), E + 0.06);

  /* ---------------- geometría por frame ---------------- */
  const pL = L('linkL'), pR = L('linkR'), lenL = pL.getTotalLength(), lenR = pR.getTotalLength();
  const dL = L('dotL'), dR = L('dotR');
  const cA = L('curveA'), lenA = cA.getTotalLength();
  const hA = L('headA'), hB = L('headB');
  M.onFrame(() => {
    for (const o of XF) {
      const s = Math.max(0.0001, o.s);
      o.el.setAttribute('transform', `translate(${o.cx} ${o.cy}) rotate(${o.r.toFixed(3)}) scale(${s.toFixed(4)}) translate(${-o.cx} ${-o.cy})`);
    }
    const p = flow.p, vis = p > 0.002 && p < 0.998;
    const a = pL.getPointAtLength(p * lenL), b = pR.getPointAtLength(p * lenR);
    const r = vis ? 7 * Math.sin(Math.PI * Math.min(1, p * 1.15)) + 2 : 0;
    set(dL, { cx: a.x.toFixed(2), cy: a.y.toFixed(2), r: r.toFixed(2) });
    set(dR, { cx: b.x.toFixed(2), cy: b.y.toFixed(2), r: r.toFixed(2) });
    const qa = cA.getPointAtLength(cv.a * lenA), qb = cA.getPointAtLength(cv.b * lenA);
    set(hA, { cx: qa.x.toFixed(2), cy: qa.y.toFixed(2), r: (11 * Math.min(1, cv.a * 6)).toFixed(2) });
    set(hB, { cx: qb.x.toFixed(2), cy: qb.y.toFixed(2), r: (5 * Math.min(1, cv.b * 6)).toFixed(2) });
  });
});
</script>
</body>
</html>
